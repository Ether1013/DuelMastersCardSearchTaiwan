<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Log Viewer</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }

        .log-container {
            width: 100%;
            border-collapse: collapse;
        }

        /* 第一行：Header / Info */
        .log-header-row {
            background-color: #252526;
            border-top: 1px solid #3c3c3c;
        }

        .log-header-row td {
            padding: 8px 12px;
            font-weight: bold;
            color: #569cd6;
        }

        .log-timestamp {
            color: #b5cea8;
            font-weight: normal;
            font-size: 0.9em;
            margin-left: 10px;
        }

        /* 第二行：Detail Payload (不截斷、完全顯示) */
        .log-payload-row {
            background-color: #1e1e1e;
            border-bottom: 1px solid #3c3c3c;
        }

        .log-payload-row td {
            padding: 8px 12px 16px 24px;
        }

        .payload-block {
            background-color: #0e0e0e;
            border-left: 3px solid #007acc;
            padding: 10px 14px;
            color: #ce9178;
            /* 關鍵設定：完全顯示不截斷，自動換行 */
            white-space: pre-wrap;
            word-break: break-all;
            overflow-x: auto;
            font-size: 0.9em;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>Console Event Log (50 Records)</h2>

    <table class="log-container" id="logTable">
        <!-- 資料將由 JS 動態生成 -->
    </table>

    <script>
        // 模擬 50 則包含詳細 Payload 的資料
        const generateLogs = () => {
            const logs = [];
            for (let i = 1; i <= 50; i++) {
                logs.push({
                    id: i,
                    event: `EVENT_LOG_TYPE_${(i % 5) + 1}`,
                    timestamp: new Date(Date.now() - (50 - i) * 60000).toISOString(),
                    payload: {
                        recordId: i,
                        status: i % 2 === 0 ? "SUCCESS" : "PENDING",
                        metadata: {
                            user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                            ip_address: `192.168.1.${i}`,
                            session_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c",
                            deep_nested_info: {
                                retry_count: i % 3,
                                trace_path: ["router", "auth_guard", "controller", "service_layer", "database_adapter"],
                                raw_dump: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. ".repeat(i % 3 + 1)
                            }
                        }
                    }
                });
            }
            return logs;
        };

        const logTable = document.getElementById('logTable');
        const logs = generateLogs();

        logs.forEach(log => {
            // 第一行：標題與基本資訊
            const headerRow = document.createElement('tr');
            headerRow.className = 'log-header-row';
            headerRow.innerHTML = `
                <td>
                    #${log.id} [${log.event}] 
                    <span class="log-timestamp">${log.timestamp}</span>
                </td>
            `;

            // 第二行：DETAIL PAYLOAD（放在該行下方，完全顯示不截斷）
            const payloadRow = document.createElement('tr');
            payloadRow.className = 'log-payload-row';
            payloadRow.innerHTML = `
                <td>
                    <div class="payload-block">${JSON.stringify(log.payload, null, 2)}</div>
                </td>
            `;

            logTable.appendChild(headerRow);
            logTable.appendChild(payloadRow);
        });
    </script>
</body>
</html>
