<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Stats Realtime Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-4">
            
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-chart-line text-indigo-500 text-2xl"></i>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight">API Track Monitoring Console</h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 sm:gap-4 w-full sm:w-auto justify-start sm:justify-end">
                <div id="statusBadge" class="whitespace-nowrap flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-yellow-500/10 text-yellow-500 border border-yellow-500/20">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span>Connecting...</span>
                </div>
                
                <button onclick="fetchInitialData()" class="whitespace-nowrap px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs rounded-lg transition border border-gray-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>

                <button id="generateTokenBtn" onclick="generateToken()" style="display: none;" class="whitespace-nowrap px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded-lg transition border border-indigo-500 flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-key"></i> 產生Token
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 space-y-6">
        <!-- Top Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">Total Events Recorded</p>
                    <h3 id="totalEvents" class="text-3xl font-extrabold text-white mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-indigo-500/10 rounded-lg flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-bolt text-xl"></i>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">Active Feature Types</p>
                    <h3 id="activeFeatures" class="text-3xl font-extrabold text-white mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-500/10 rounded-lg flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-cubes text-xl"></i>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">Recent Active Countries</p>
                    <h3 id="activeCountries" class="text-3xl font-extrabold text-white mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-sky-500/10 rounded-lg flex items-center justify-center text-sky-400">
                    <i class="fa-solid fa-globe text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-semibold text-gray-200 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-simple text-indigo-400"></i> Feature Trigger Count
                </h2>
                <div class="h-64">
                    <canvas id="featureChart"></canvas>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-sm">
                <h2 class="text-base font-semibold text-gray-200 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-earth-americas text-sky-400"></i> Country Distribution
                </h2>
                <div class="h-64 flex justify-center items-center">
                    <canvas id="countryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Recent Logs Table -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-sm">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <h2 class="text-base font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-purple-400"></i> Recent 50 Event Details
                </h2>
                <div class="flex items-center gap-3">
                    <select id="sortMode" onchange="changeSortMode()" class="bg-gray-800 text-xs text-gray-300 border border-gray-700 rounded-lg px-2 py-1 outline-none cursor-pointer">
                        <option value="default">預設排序 (最新事件優先)</option>
                        <option value="user">使用者別 (新用戶置頂，不擾亂當前視覺)</option>
                    </select>
                    <span class="text-xs text-gray-500">Auto-refresh via WS</span>
                </div>
            </div>
            
            <div id="tableScrollContainer" class="overflow-x-auto custom-scrollbar max-h-[500px]">
                <table class="w-full text-left text-sm text-gray-400 border-collapse">
                    <!-- 💡 已移除 thead，改用更適合手機與小螢幕的上下層單欄排版 -->
                    <tbody id="logsTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
	
	<!-- Delete User Logs Modal -->
	<div id="deleteModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
		<div class="bg-gray-900 border border-gray-800 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
			<div class="flex items-center gap-3 text-rose-500">
				<i class="fa-solid fa-triangle-exclamation text-2xl"></i>
				<h3 class="text-lg font-bold text-gray-100">刪除使用者紀錄</h3>
			</div>
			<p class="text-sm text-gray-300">
				確定要刪除使用者 <span id="modalTargetUser" class="font-mono font-bold text-sky-400"></span> 在主機記憶體中的所有 Detail 紀錄嗎？
			</p>
			<p class="text-xs text-gray-500">
				* 僅會清除主機記憶體上的 log 畫面，該使用者的編號登記不會被重置。
			</p>
			<div class="flex justify-end gap-3 pt-2">
				<button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-medium transition">
					否 (取消)
				</button>
				<button onclick="confirmDeleteUserLogs()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-medium transition shadow-lg">
					是 (刪除)
				</button>
			</div>
		</div>
	</div>

    <script>
        Chart.register(ChartDataLabels);

        const urlParams = new URLSearchParams(window.location.search);
        const adminKey = urlParams.get('admin');
        const tokenKey = urlParams.get('token');
        
        let authParam = '';
        if (adminKey) authParam = `admin=${encodeURIComponent(adminKey)}`;
        else if (tokenKey) authParam = `token=${encodeURIComponent(tokenKey)}`;

        let featureChart, countryChart;

        // 全局狀態控制表格
        let currentLogs = [];
        let knownUsers = []; // 維護使用者的排序順序
        let sortMode = 'default';
		let pendingDeleteUser = null;

        function changeSortMode() {
            sortMode = document.getElementById('sortMode').value;
            renderLogsTable();
        }

        function initCharts() {
            const ctxFeature = document.getElementById('featureChart').getContext('2d');
            featureChart = new Chart(ctxFeature, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Triggers', data: [], backgroundColor: '#6366f1', borderRadius: 4 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, datalabels: { display: false } },
                    scales: {
                        x: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } },
                        y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' }, beginAtZero: true }
                    }
                }
            });

            const ctxCountry = document.getElementById('countryChart').getContext('2d');
            countryChart = new Chart(ctxCountry, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'] }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { color: '#9ca3af' } },
                        datalabels: { color: '#ffffff', font: { weight: 'bold', size: 12 }, formatter: (value) => value > 0 ? value + ' 次' : '', anchor: 'center', align: 'center' }
                    }
                }
            });
        }

        function updateDashboard(data) {
            document.getElementById('totalEvents').innerText = data.total_events || 0;
            document.getElementById('activeFeatures').innerText = Object.keys(data.stats || {}).length;
            document.getElementById('activeCountries').innerText = Object.keys(data.recent_countries_summary || {}).length;

            featureChart.data.labels = Object.keys(data.stats || {});
            featureChart.data.datasets[0].data = Object.values(data.stats || {});
            featureChart.update();

            countryChart.data.labels = Object.keys(data.recent_countries_summary || {});
            countryChart.data.datasets[0].data = Object.values(data.recent_countries_summary || {});
            countryChart.update();

            // 更新 Log 資料庫
            currentLogs = data.recent_50_details || [];
            
            // 找出不在 knownUsers 中的新使用者，將他們推到前面
            let newUsers = [];
            currentLogs.forEach(log => {
                let u = log.user || log.country || 'Unknown';
                if (!knownUsers.includes(u) && !newUsers.includes(u)) {
                    newUsers.push(u);
                }
            });
            knownUsers = [...newUsers, ...knownUsers];

            renderLogsTable();
        }

        function renderLogsTable() {
			const container = document.getElementById('tableScrollContainer');
			const tbody = document.getElementById('logsTableBody');
			
			// 判讀當前是否為 Admin 登入 (只有帶 ?admin= 的人才有 adminKey)
			const isAdmin = Boolean(adminKey);

			// 紀錄畫面更新前的捲動狀態
			const oldScrollTop = container.scrollTop;
			const oldScrollHeight = container.scrollHeight;

			let displayLogs = [];

			if (sortMode === 'user') {
				// 依照 knownUsers 排序 (新用戶在最上方，舊用戶在下方保持原本的連續順序)
				knownUsers.forEach(u => {
					let userLogs = currentLogs.filter(log => (log.user || log.country || 'Unknown') === u);
					displayLogs.push(...userLogs);
				});
			} else {
				// 預設按時間排序
				displayLogs = [...currentLogs];
			}

			tbody.innerHTML = '';
			
			displayLogs.forEach((log) => {
				const trHeader = document.createElement('tr');
				trHeader.className = "hover:bg-gray-800/40 border-t border-gray-800/80";
				
				const userDisplay = log.user || log.country || 'Unknown';

				// 根據 isAdmin 決定使用「可點擊的互動 Badge」還是「純顯示的 Badge」
				let userBadgeHtml = '';
				if (isAdmin) {
					userBadgeHtml = `
						<span onclick="openDeleteModal('${userDisplay}')" class="px-2 py-0.5 bg-sky-500/10 text-sky-400 hover:bg-rose-500/20 hover:text-rose-300 hover:border-rose-500/30 rounded border border-sky-500/20 text-xs font-medium cursor-pointer transition flex items-center gap-1" title="點擊刪除此使用者的紀錄">
							<i class="fa-solid fa-user-astronaut text-[10px]"></i>
							${userDisplay}
						</span>`;
				} else {
					// Token 使用者：無 onclick、無手勢指標 (cursor-pointer)、無 hover 變色效果
					userBadgeHtml = `
						<span class="px-2 py-0.5 bg-sky-500/10 text-sky-400 rounded border border-sky-500/20 text-xs font-medium flex items-center gap-1">
							<i class="fa-solid fa-user-astronaut text-[10px]"></i>
							${userDisplay}
						</span>`;
				}

				trHeader.innerHTML = `
					<td class="px-4 pt-3 pb-1 align-top">
						<div class="font-mono text-xs text-gray-500 mb-1.5 flex items-center gap-1.5">
							<i class="fa-regular fa-clock"></i> ${log.time}
						</div>
						<div class="flex flex-wrap items-center gap-2">
							<span class="px-2 py-0.5 bg-indigo-500/10 text-indigo-400 rounded border border-indigo-500/20 text-xs font-medium">${log.feature}</span>
							${userBadgeHtml}
						</div>
					</td>
				`;

				const trDetail = document.createElement('tr');
				trDetail.className = "hover:bg-gray-800/40 border-b border-gray-800/80";

				let detailFormatted = '';
				if (log.detail) {
					detailFormatted = typeof log.detail === 'object' 
						? JSON.stringify(log.detail, null, 2) 
						: log.detail;
				}

				trDetail.innerHTML = `
					<td class="px-4 pt-1 pb-3">
						<div class="bg-gray-950/60 p-2.5 rounded-lg border border-gray-800/60 text-xs font-mono text-emerald-400 min-h-[40px]">
							<div class="text-[10px] text-gray-500 font-sans uppercase tracking-wider mb-1">Detail Payload</div>
							<pre class="whitespace-pre-wrap break-all overflow-x-auto leading-relaxed">${detailFormatted}</pre>
						</div>
					</td>
				`;

				tbody.appendChild(trHeader);
				tbody.appendChild(trDetail);
			});

			// 如果在使用「使用者別」模式下，且原本的卷軸有往下拉，利用高度差校正卷軸位置
			const newScrollHeight = container.scrollHeight;
			if (sortMode === 'user' && oldScrollTop > 0) {
				container.scrollTop = oldScrollTop + (newScrollHeight - oldScrollHeight);
			}
		}

        async function fetchInitialData() {
            if (!authParam) return;
            try {
                const response = await fetch(`/api/track/stats?${authParam}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    updateDashboard(data);
                }
            } catch (err) {
                console.error("HTTP Fetch failed:", err);
            }
        }

        function initWebSocket() {
            if (!authParam) return;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/console?${authParam}`;
            const ws = new WebSocket(wsUrl);
            const badge = document.getElementById('statusBadge');

            ws.onopen = () => {
                badge.className = "whitespace-nowrap flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Live Connected</span>`;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateDashboard(data);
                } catch (e) {
                    console.error("WebSocket message parsing error:", e);
                }
            };

            ws.onclose = () => {
                badge.className = "whitespace-nowrap flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Disconnected</span>`;
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = () => ws.close();
        }

        async function generateToken() {
            try {
                const response = await fetch(`/api/console/generate_token?admin=${encodeURIComponent(adminKey)}`, { method: 'POST' });
                if (!response.ok) throw new Error('產生失敗，權限不足或伺服器錯誤');
                
                const data = await response.json();
                const link = `${window.location.origin}${window.location.pathname}?token=${data.token}`;
                
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Console 單次登入連結',
                            text: '1小時內有效，單次使用的 Console 連結 (重新整理即失效)',
                            url: link
                        });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return; 
                    }
                }
                
                await navigator.clipboard.writeText(link);
                alert(`已複製單次 Token 連結至剪貼簿！\n\n${link}`);

            } catch (err) {
                alert(err.message);
            }
        }
		
		function openDeleteModal(user) {
			pendingDeleteUser = user;
			document.getElementById('modalTargetUser').innerText = user;
			document.getElementById('deleteModal').classList.remove('hidden');
		}

		function closeDeleteModal() {
			pendingDeleteUser = null;
			document.getElementById('deleteModal').classList.add('hidden');
		}

		async function confirmDeleteUserLogs() {
			if (!pendingDeleteUser) return;
			
			try {
				const response = await fetch(`/api/track/delete_user_logs?user_id=${encodeURIComponent(pendingDeleteUser)}&${authParam}`, {
					method: 'DELETE'
				});
				
				if (!response.ok) {
					throw new Error('刪除失敗，權限不足或伺服器錯誤');
				}
				
				closeDeleteModal();
			} catch (err) {
				alert(err.message);
				closeDeleteModal();
			}
		}

        window.addEventListener('DOMContentLoaded', () => {
            if (!authParam) {
                alert('未提供認證參數 (需使用 ?admin= 或 ?token= 進入)');
                return;
            }
            if (adminKey) {
                document.getElementById('generateTokenBtn').style.display = 'flex';
            }

            initCharts();
            fetchInitialData();
            initWebSocket();
        });
    </script>
</body>
</html>
