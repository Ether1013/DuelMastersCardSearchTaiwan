<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=0.35, maximum-scale=2.0, user-scalable=yes">
    <title>商品卡表展示</title>
    <style>
        /* 基礎全域樣式 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden; /* 防止 1080px 版型微幅溢出導致右側截斷 */
        }
        body { 
            font-family: "微軟正黑體", sans-serif; 
            padding: 20px 10px;
            background: #fff; 
            color: #111; 
            line-height: 1.5; 
            box-sizing: border-box;
        }
        h1 { 
            border-bottom: 2px solid #333; 
            padding-bottom: 8px; 
            font-size: 20px; 
            margin-top: 0;
        }

        /* ================= 模式 1：僅匯出圖片 (響應式卡牌寬度) ================= */
        body.mode-img-only {
            background: #111;
            color: #fff;
            /* 預設卡牌寬高與間距 CSS 變數，JS 會依螢幕寬度動態計算更新 */
            --card-w: 140px;
            --card-h: 196px;
            --card-overlap: -160px;
            --card-gap: 10px;
        }

        .img-grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1060px;
            margin: 0 auto;
            box-sizing: border-box;
            align-items: center;
        }

        .img-grid-row {
            display: flex;
            gap: var(--card-gap);
            justify-content: center;
            align-items: flex-end; /* 向下對齊/向上拉展 */
            flex-wrap: nowrap;
            width: 100%;
            box-sizing: border-box;
        }
        .img-card-col {
            width: var(--card-w);
            flex-shrink: 0;
        }
        .img-stack-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: var(--card-w);
        }
        .img-only-card {
            width: var(--card-w);
            height: var(--card-h);
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            position: relative;
            background: #222;
        }
        .img-only-card:not(:first-child) {
            margin-top: var(--card-overlap);
        }
        .no-img-box {
            width: var(--card-w);
            height: var(--card-h);
            background: #222;
            border: 2px dashed #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 12px;
            text-align: center;
            padding: 4px;
            box-sizing: border-box;
            position: relative;
        }
        .no-img-box:not(:first-child) {
            margin-top: var(--card-overlap);
        }
		.loading-img-box {
			width: var(--card-w, 140px);
			height: var(--card-h, 196px);
			background: #222;
			border: 2px dashed #0284c7;
			border-radius: 6px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: #38bdf8;
			font-size: 12px;
			gap: 8px;
			box-sizing: border-box;
			position: relative;
		}

		.loading-img-box:not(:first-child) {
			margin-top: var(--card-overlap, -160px);
		}

		.pop-img-spinner {
			border: 3px solid #334155;
			border-top: 3px solid #38bdf8;
			border-radius: 50%;
			width: 22px;
			height: 22px;
			animation: spin 1s linear infinite;
		}

        /* ================= 模式 2 & 3：標準圖文 / 純文字模式樣式 ================= */
        .card-item { 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            padding: 15px; 
            margin-bottom: 15px; 
            display: flex; 
            gap: 15px; 
            page-break-inside: avoid; 
            box-sizing: border-box;
            width: 100%;
            max-width: 100%; /* 新增這行：鎖死最大寬度 */
        }
        
        /* 圖片容器：佔比 1 */
        .card-img-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            flex: 1;          /* 新增：佔據 1 份彈性空間 */
            max-width: 25%;   /* 新增：限制最大寬度為總寬的 1/4 */
        }
        
        /* 圖片本身：寬度隨容器自適應 */
        .card-img.is-horizontal {
            width: 100%;
            height: auto;
            aspect-ratio: 1.4 / 1; /* 確保橫圖比例 */
        }
        .card-img { 
            width: 100%; 
            height: auto;
            aspect-ratio: 1 / 1.4; /* 確保直圖比例 */
            object-fit: contain; 
            background: #f0f0f0; 
            border-radius: 4px; 
            transition: all 0.2s ease;
        }

        .card-detail { 
            flex: 1; 
            min-width: 0; 
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
		/* 文字區塊：佔比 3 */
        .card-detail { 
            flex: 3;          /* 修改：佔據 3 份彈性空間，達成 1:3 完美比例 */
            min-width: 0;     /* 重要：防止內部連續長文字把 Flex 容器撐破 */
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .card-flavor { 
            background: #fffbe6; 
            border: 1px solid #ffe58f; 
            padding: 6px 10px; 
            font-style: italic; 
            font-size: 13px; 
            color: #873800; 
            border-radius: 4px; 
            margin-top: 8px; 
            margin-bottom: 8px; 
        }
        .wdata-box { 
            background: #f8f9fa; 
            border-left: 3px solid #333; 
            padding: 8px; 
            margin-top: 6px; 
            font-size: 13px; 
        }
        .sp-list { 
            margin: 4px 0 0 18px; 
            padding: 0; 
        }
        .hyper-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
            font-size: 12px;
            margin: 8px 0 4px 0;
        }
        .hyper-divider::before, .hyper-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed #d32f2f;
        }
        .hyper-divider:not(:empty)::before { margin-right: .5em; }
        .hyper-divider:not(:empty)::after { margin-left: .5em; }

        .ability-explain-box {
            background: #eef6ff;
            border: 1px solid #bbdefb;
            border-radius: 4px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
        }
        .ability-explain-item { margin-bottom: 6px; }
        .ability-explain-item:last-child { margin-bottom: 0; }
        .ability-title { font-weight: bold; color: #1565c0; }

        .export-disclaimer {
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-top: 4px;
            user-select: none;
            white-space: nowrap;
        }

        /* 載入中 Loading 畫面 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999; color: #333; font-size: 18px; font-weight: bold;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #d32f2f; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 圖文模式卡圖重疊 */
        .stack-img-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }
        .stacked-card-img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1.4;
            object-fit: contain;
            background: #f0f0f0;
            border-radius: 4px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.25);
            position: relative;
            transition: all 0.2s ease;
        }
        .stacked-card-img:not(:first-child) {
            margin-top: -125%; /* 改用百分比負邊距來重疊 */
            transition: all 0.2s ease;
        }
        .stack-img-container.is-horizontal {
            max-width: 350px;
        }
        .stacked-card-img.is-horizontal {
            width: 100%;
            height: auto;
            aspect-ratio: 1.4 / 1;
        }
        .stacked-card-img.is-horizontal:not(:first-child) {
            margin-top: -60%;
        }
		
		/* pop.html: 模式 4 (img_unfold) 全域樣式與變數 */
		body.mode-img-unfold {
			background: #111;
			color: #fff;
			--card-w: 120px;
			--card-h: 168px;
			--card-gap: 6px;
		}

		.img-unfold-grid {
			display: grid;
			grid-template-columns: repeat(8, var(--card-w));
			gap: var(--card-gap);
			justify-content: center;
			align-content: start;
			width: 100%;
			max-width: 1060px;
			margin: 0 auto;
			box-sizing: border-box;
		}

		.img-unfold-card {
			width: var(--card-w);
			height: var(--card-h);
			object-fit: contain;
			border-radius: 4px;
			box-shadow: 0 3px 8px rgba(0,0,0,0.6);
			background: #222;
		}

		.img-unfold-no-img {
			width: var(--card-w);
			height: var(--card-h);
			background: #222;
			border: 2px dashed #555;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #aaa;
			font-size: 11px;
			text-align: center;
			padding: 2px;
			box-sizing: border-box;
		}
		/* 僅在桌機版（寬螢幕）微調字體 */
		@media (min-width: 769px) {
			/* 讓右側文字欄位的主字體放放大 */
			.card-detail {
				font-size: 16px; /* 預設基礎字體加大 */
			}
			
			/* 標題加大 */
			.card-detail .card-title {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 8px;
			}

			/* 效果說明與 Flavor 字體適度放放大 */
			.wdata-box, .card-flavor {
				font-size: 14px;
				line-height: 1.6;
			}

			.sp-list {
				font-size: 14px;
			}

			.ability-explain-box {
				font-size: 13px;
			}
		}
		
		/* 1. 圖片載入中 (Spinner + 藍色虛框) */
		.loading-image-box {
			width: 100%;
			height: 100%;
			min-height: 250px;
			background: #f8f9fa;
			color: #0284c7;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			font-weight: bold;
			border-radius: 6px;
			border: 2px dashed #0284c7;
			font-size: 14px;
			gap: 10px;
			box-sizing: border-box;
		}

		.card-img-spinner {
			border: 3px solid #e2e8f0;
			border-top: 3px solid #0284c7;
			border-radius: 50%;
			width: 28px;
			height: 28px;
			animation: cardSpin 1s linear infinite;
		}

		@keyframes cardSpin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* 2. 連借都借不到 / 載入失敗 (灰色虛框) */
		.no-image-box {
			width: 100%;
			height: 100%;
			min-height: 250px;
			background: #e0e0e0;
			color: #666;
			display: flex;
			justify-content: center;
			align-items: center;
			font-weight: bold;
			border-radius: 6px;
			border: 2px dashed #ccc;
			font-size: 16px;
			box-sizing: border-box;
		}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div id="loading-text">資料讀取與卡表生成中...</div>
    </div>

    <h1 id="page-title">商品卡表載入中...</h1>
    <div id="card-list-container"></div>

    <script>
        const INFINITY_THRESHOLD = 9000000000000000;
        const NEGATIVE_INFINITY = -999999999;
        const specialIcons = ["[白金殿堂]", "⌂", "✚", "✡"];
		// 文明 Bitmask 對應設定
		const CIV_MAP = [
			{ bit: 16, name: '光' },
			{ bit: 8,  name: '水' },
			{ bit: 4,  name: '闇' },
			{ bit: 2,  name: '火' },
			{ bit: 1,  name: '自然' }
		];

		// 解析文明 Bitmask 為文字名稱（例如: "火 / 自然"）
		function getCivText(civilVal) {
			const civNum = parseInt(civilVal) || 0;
			if (civNum === 0 || civNum === 32) return '無文明';
			const names = [];
			CIV_MAP.forEach(item => {
				if (civNum & item.bit) names.push(item.name);
			});
			return names.length > 0 ? names.join(' / ') : '無文明';
		}

        function formatDisplayValue(val) {
            if (val === null || val === undefined) return '';
            const num = Number(val);
            if (!isNaN(num) && num >= INFINITY_THRESHOLD) return '∞';
            return String(val);
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function formatDmId(rawId) {
            if (!rawId) return '';
            const strId = String(rawId).trim();
            return strId.toUpperCase().startsWith('DM') ? strId : 'DM' + strId;
        }

        function renderSpItemHtml(spRaw) {
            let formatted = formatDisplayValue(spRaw);
            if (!formatted) return '';

            if (formatted.startsWith('HINT:')) {
                const hintContent = formatted.replace(/^HINT:\s*/, '');
                return `<li style="list-style-type:none;"><div style="color:#666; font-style:italic; font-size:13px; margin:4px 0;">（${hintContent}）</div></li>`;
            }

            if (formatted.includes('#')) {
                const parts = formatted.split(/#+/).map(p => p.trim()).filter(Boolean);
                if (parts.length > 0) {
                    const isSpecial = specialIcons.some(icon => parts[0].startsWith(icon));
                    const mainStyle = isSpecial ? ' style="list-style-type: none; margin-left: -1.2em;"' : '';
                    
                    let html = `<li${mainStyle}><div style="font-weight: bold; margin-bottom: 2px;">${parts[0]}</div>`;
                    html += `<ul style="margin: 2px 0 6px 18px; padding-left: 0;">`;
                    for (let i = 1; i < parts.length; i++) {
                        html += `<li>${parts[i]}</li>`;
                    }
                    html += `</ul></li>`;
                    return html;
                }
            }

            const isSpecial = specialIcons.some(icon => formatted.startsWith(icon));
            const hideStyle = isSpecial ? ' style="list-style-type: none; margin-left: -1.2em;"' : '';
            return `<li${hideStyle}>${formatted}</li>`;
        }

        function sortCardList(dataList, sortType) {
            if (!sortType || sortType === 'default') return dataList;

            const getCost = (c) => (c.wdata && c.wdata[0] && c.wdata[0].cost !== undefined && c.wdata[0].cost !== null) ? Number(c.wdata[0].cost) : NEGATIVE_INFINITY;
            const getPower = (c) => (c.wdata && c.wdata[0] && c.wdata[0].power !== undefined && c.wdata[0].power !== null) ? Number(c.wdata[0].power) : NEGATIVE_INFINITY;

            const getCivInfo = (c) => {
                let bitmask = 0;
                if (c.wdata && Array.isArray(c.wdata)) {
                    c.wdata.forEach(w => bitmask |= (parseInt(w.civil) || 0));
                }
                const validBits = bitmask & 31;
                let count = 0;
                for (let i = 0; i < 5; i++) {
                    if ((validBits & (1 << i)) !== 0) count++;
                }
                return { bitmask, count };
            };

            return [...dataList].sort((a, b) => {
                switch (sortType) {
                    case 'name_asc':
                        return (a.name || '').localeCompare(b.name || '', 'zh-TW');
                    case 'name_desc':
                        return (b.name || '').localeCompare(a.name || '', 'zh-TW');
                    case 'cost_asc':
                        return getCost(a) - getCost(b);
                    case 'cost_desc':
                        return getCost(b) - getCost(a);
                    case 'power_asc':
                        return getPower(a) - getPower(b);
                    case 'power_desc':
                        return getPower(b) - getPower(a);
                    case 'civ_custom': {
                        const civA = getCivInfo(a);
                        const civB = getCivInfo(b);
                        const groupA = civA.count <= 1 ? 1 : civA.count;
                        const groupB = civB.count <= 1 ? 1 : civB.count;

                        if (groupA !== groupB) return groupA - groupB;

                        if (groupA === 1) {
                            const orderMap = { 16: 1, 8: 2, 4: 3, 2: 4, 1: 5 };
                            const orderA = orderMap[civA.bitmask] || 6;
                            const orderB = orderMap[civB.bitmask] || 6;
                            if (orderA !== orderB) return orderA - orderB;
                        } else {
                            if (civA.bitmask !== civB.bitmask) return civB.bitmask - civA.bitmask;
                        }
                        return (a.name || '').localeCompare(b.name || '', 'zh-TW');
                    }
                    default:
                        return 0;
                }
            });
        }

        // 全域變數保存目前 rowDist 分佈，以利螢幕旋轉/縮放時動態計算卡牌大小
        let currentImgOnlyRowDist = [];

        function updateImgOnlyScale() {
			if (!document.body.classList.contains('mode-img-only') || currentImgOnlyRowDist.length === 0) return;

			// 抓取單列最多有幾張卡片 (例如 7 張)
			const maxCountInRow = Math.max(...currentImgOnlyRowDist);
			if (maxCountInRow <= 0) return;

			// 💡 1. 精準取得容器或 Body 的實際渲染內部寬度
			const container = document.getElementById('card-list-container');
			const bodyW = document.body.clientWidth || window.innerWidth;
			const actualWidth = (container && container.clientWidth > 0) ? container.clientWidth : bodyW;

			// 💡 2. 預留左右安全邊距 (24px) 與卡牌之間間距 (間距隨卡片數量調整，最小 4px)
			const gap = maxCountInRow > 5 ? 6 : 10;
			const safePadding = 24; 
			const availableWidth = actualWidth - safePadding;

			// 💡 3. 計算每張卡片的精準寬度
			let calculatedCardW = Math.floor((availableWidth - (maxCountInRow - 1) * gap) / maxCountInRow);

			// 限制卡片寬度：桌機最大 140px，手機最小不低於 30px
			calculatedCardW = Math.min(140, Math.max(30, calculatedCardW));
			
			// 依 140 : 196 (即 1 : 1.4) 比例算出高度與堆疊負邊距
			const calculatedCardH = Math.round(calculatedCardW * 1.4);
			// 重疊負邊距比例約為高度的 81.6%
			const calculatedOverlap = -Math.round(calculatedCardH * 0.816);

			// 更新 CSS 全域變數
			document.body.style.setProperty('--card-w', `${calculatedCardW}px`);
			document.body.style.setProperty('--card-h', `${calculatedCardH}px`);
			document.body.style.setProperty('--card-overlap', `${calculatedOverlap}px`);
			document.body.style.setProperty('--card-gap', `${gap}px`);
		}

        // 渲染匯出 payload 格式 (Session 模式專用)
        function renderExportPayload(payload) {
            const container = document.getElementById('card-list-container');
            const { mode, items, isDeckSet, cardTypes } = payload;

            function getCardTypeText(typeVal) {
                if (!cardTypes || !Array.isArray(cardTypes)) return typeVal;
                const match = cardTypes.find(ct => ct.value === typeVal);
                return match ? match.text : typeVal;
            }

            // ================= 模式 1：僅匯出圖片 (Image Only) =================
            if (mode === 'img_only') {
                document.body.classList.add('mode-img-only');
                document.title = `匯出結果 - 僅圖片模式 (${items.length}種卡牌)`;
                document.getElementById('page-title').innerText = `僅圖片模式 (${items.length}種卡牌)`;

                // 💡 僅圖片模式動態切換 Viewport 為裝置寬度，以利精準響應式計算圖片
                let metaViewport = document.querySelector('meta[name="viewport"]');
                if (metaViewport) {
                    metaViewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes');
                }

                // 依據原始需求：依卡牌種類數量固定計算列數與單列行數
                function calculateRowDistribution(totalCards) {
                    if (totalCards <= 0) return [];
                    if (totalCards === 9) return [5, 4];
                    if (totalCards <= 8) return [totalCards];
                    let rows = Math.ceil(totalCards / 8);
                    let baseItems = Math.floor(totalCards / rows);
                    let remainder = totalCards % rows;
                    let dist = [];
                    for (let i = 0; i < rows; i++) {
                        dist.push(baseItems + (i < remainder ? 1 : 0));
                    }
                    return dist;
                }

                currentImgOnlyRowDist = calculateRowDistribution(items.length);

                let html = '<div class="img-grid-container">';
                let currIdx = 0;

                currentImgOnlyRowDist.forEach(countInRow => {
                    html += '<div class="img-grid-row">';
                    for (let i = 0; i < countInRow; i++) {
                        const item = items[currIdx];
                        if (item) {
                            html += '<div class="img-card-col">';
                            html += '<div class="img-stack-box">';
                            
                            if (item.picUrl) {
                                for (let c = 0; c < item.count; c++) {
                                    const zIndex = c + 1; // 畫面最下方(最後一張) z-index 最高
                                    html += `<img class="img-only-card" style="z-index:${zIndex};" src="${item.picUrl}" alt="${item.name}" />`;
                                }

		// A. 響應式動態計算卡片寬度 (--card-w)
		function updateImgUnfoldScale() {
			if (!document.body.classList.contains('mode-img-unfold')) return;

			const COLS = 8;
			const container = document.getElementById('card-list-container');
			const bodyW = document.body.clientWidth || window.innerWidth;
			const actualWidth = (container && container.clientWidth > 0) ? container.clientWidth : bodyW;

			const gap = 6;
			const safePadding = 24;
			const availableWidth = actualWidth - safePadding;

			let calculatedCardW = Math.floor((availableWidth - (COLS - 1) * gap) / COLS);
			calculatedCardW = Math.min(140, Math.max(30, calculatedCardW));
			const calculatedCardH = Math.round(calculatedCardW * 1.4);

			document.body.style.setProperty('--card-w', `${calculatedCardW}px`);
			document.body.style.setProperty('--card-h', `${calculatedCardH}px`);
			document.body.style.setProperty('--card-gap', `${gap}px`);
		}

		/**
		 * 展開式純圖 (Unfolded Pure Image) 合成矩形對齊演算函式
		 * 核心：
		 * 1. 矩形度 Penalty 優先級最高
		 * 2. 【新增】跨列合成矩形加分：當 4 張卡正下方為 (3+1) 或 (2+2) 拼出等寬度 4 的矩形時給予高額加分
		 */
		function computeUnfoldLayout(items) {
			const COLS = 8;

			// 1. 將實體卡片轉為「同名卡橫條 (Strips)」
			const strips = items.map((item, originalIndex) => ({
				...item,
				id: originalIndex,
				groupCount: item.count || 1,
				length: item.count || 1
			}));

			let totalCards = 0;
			strips.forEach(s => totalCards += s.length);
			if (totalCards === 0) return [];

			const totalRows = Math.ceil(totalCards / COLS);
			const grid = Array.from({ length: totalRows }, () => Array(COLS).fill(null));

			// 2. 評估評分機制 (Evaluation Function)
			function evaluateGrid(currGrid) {
				const blockStats = {};

				for (let r = 0; r < totalRows; r++) {
					for (let c = 0; c < COLS; c++) {
						const card = currGrid[r][c];
						if (!card) continue;
						const gc = card.groupCount;
						if (!blockStats[gc]) {
							blockStats[gc] = { minR: r, maxR: r, minC: c, maxC: c, count: 0, rowFirstCol: {} };
						}
						const b = blockStats[gc];
						b.minR = Math.min(b.minR, r);
						b.maxR = Math.max(b.maxR, r);
						b.minC = Math.min(b.minC, c);
						b.maxC = Math.max(b.maxC, c);
						b.count++;

						if (b.rowFirstCol[r] === undefined || c < b.rowFirstCol[r]) {
							b.rowFirstCol[r] = c;
						}
					}
				}

				let totalPenalty = 0;
				let anchorBonus = 0;
				let compositeRectBonus = 0; // 【核心加分：跨列合成矩形】

				// 【Tier 1 - 最高權重】單一卡數群矩形度 Penalty
				Object.keys(blockStats).forEach(gc => {
					const b = blockStats[gc];
					const width = b.maxC - b.minC + 1;
					const height = b.maxR - b.minR + 1;
					const boundingBoxArea = width * height;

					totalPenalty += (boundingBoxArea - b.count) * 10000;

					// 【Tier 2 - 次高權重】同張數群左側齊頭對齊 (Column Alignment)
					const rows = Object.keys(b.rowFirstCol);
					if (rows.length > 1) {
						const firstCols = rows.map(r => b.rowFirstCol[r]);
						if (firstCols.every(col => col === firstCols[0])) {
							anchorBonus += 1000;
						}
					}
				});

				// 【Tier 3 - 核心重點】檢測 4 與下方 (3+1) 或 (2+2) 的合成矩形
				for (let r = 0; r < totalRows - 1; r++) {
					for (let c = 0; c < COLS; c++) {
						const topCard = currGrid[r][c];
						const bottomCard = currGrid[r + 1][c];

						// 條件：當上方是 4 張卡的區塊起點 (c % 4 === 0 且長度為 4)
						if (topCard && topCard.length === 4 && (c === 0 || currGrid[r][c - 1]?.id !== topCard.id)) {
							// 檢查下方在 [c ~ c+3] 這 4 個格子的填補狀況
							let subStrips = [];
							let isSubComplete = true;

							for (let k = 0; k < 4; k++) {
								const cell = currGrid[r + 1][c + k];
								if (!cell) {
									isSubComplete = false;
									break;
								}
								if (k === 0 || cell.id !== currGrid[r + 1][c + k - 1]?.id) {
									subStrips.push(cell);
								}
							}

							if (isSubComplete) {
								const subLengths = subStrips.map(s => s.length);

								// 判斷 1: 下方為 3 + 1 (例如 C C C F) 且 3 張在前、1 張在後
								if (subLengths.length === 2 && subLengths[0] === 3 && subLengths[1] === 1) {
									compositeRectBonus += 500; // 拼成 2x4 大矩形加分！
								}
								// 判斷 2: 下方為 2 + 2 (例如 C C D D)
								else if (subLengths.length === 2 && subLengths[0] === 2 && subLengths[2] === 2) {
									compositeRectBonus += 400; // 拼成 2x4 大矩形加分！
								}
							}
						}
					}
				}

				return (-totalPenalty) + anchorBonus + compositeRectBonus;
			}

			let bestGrid = null;
			let bestScore = -Infinity;

			let searchCount = 0;
			const MAX_SEARCH_NODES = 5000;

			const sortedStrips = [...strips].sort((a, b) => b.length - a.length);

			// 3. 實體橫條的回溯搜尋 (DFS with Pruning)
			function backtrack(stripIdx) {
				if (searchCount > MAX_SEARCH_NODES) return;
				searchCount++;

				if (stripIdx >= sortedStrips.length) {
					const score = evaluateGrid(grid);
					if (score > bestScore) {
						bestScore = score;
						bestGrid = grid.map(row => [...row]);
					}
					return;
				}

				const currentStrip = sortedStrips[stripIdx];
				const len = currentStrip.length;

				for (let r = 0; r < totalRows; r++) {
					for (let c = 0; c <= COLS - len; c++) {
						let canPlace = true;
						for (let k = 0; k < len; k++) {
							if (grid[r][c + k] !== null) {
								canPlace = false;
								break;
							}
						}

						if (canPlace) {
							for (let k = 0; k < len; k++) {
								grid[r][c + k] = {
									...currentStrip,
									isFirstOfCard: (k === 0)
								};
							}

							backtrack(stripIdx + 1);

							for (let k = 0; k < len; k++) {
								grid[r][c + k] = null;
							}
						}
					}
				}
			}

			backtrack(0);

			if (!bestGrid) return items;

			// 4. 展平成一維陣列回傳給渲染器
			const resultCards = [];
			for (let r = 0; r < totalRows; r++) {
				for (let c = 0; c < COLS; c++) {
					if (bestGrid[r][c]) {
						resultCards.push(bestGrid[r][c]);
					}
				}
			}
			return resultCards;
		}
		
		// 全域共用：針對指定卡牌的 sp 與 hypermode.sp 進行「或以上/或以下」替換
		function processSpText(cards) {
			if (!cards || !Array.isArray(cards)) return;
			cards.forEach(card => {
				if (card.wdata && Array.isArray(card.wdata)) {
					card.wdata.forEach(w => {
						// 處理一般 sp
						if (w.sp && Array.isArray(w.sp)) {
							w.sp = w.sp.map(s => s.replace(/以上/g, '或以上').replace(/或或以上/g, '或以上')
												  .replace(/以下/g, '或以下').replace(/或或以下/g, '或以下'));
						}
						// 處理超化模式 hypermode.sp
						if (w.hypermode && w.hypermode.sp && Array.isArray(w.hypermode.sp)) {
							w.hypermode.sp = w.hypermode.sp.map(s => s.replace(/以上/g, '或以上').replace(/或或以上/g, '或以上')
																	  .replace(/以下/g, '或以下').replace(/或或以下/g, '或以下'));
						}
					});
				}
			});
		}

        async function initPopPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionKey = urlParams.get('session');
            const setCode = urlParams.get('setCode');
            const deckListParam = urlParams.get('deckList');
            const sortParam = urlParams.get('sort');

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('page-title').innerText = "⚠️ 匯出資料已過期或不存在！";
                    document.getElementById('card-list-container').innerHTML = '<p style="color:#666; text-align:center;">請返回搜尋器頁面重新進行匯出。</p>';
                    return;
                }

                try {
                    const payload = JSON.parse(rawPayload);
                    renderExportPayload(payload);
                } catch (err) {
                    console.error("解析匯出資料失敗:", err);
                    document.getElementById('page-title').innerText = "❌ 匯出資料解析錯誤！";
                } finally {
                    document.getElementById('loading').style.display = 'none';

            }

                return;
            }

					fetch('/api/card_types').then(r => r.json()).catch(() => []),
					fetch('/api/abilities').then(r => r.json()).catch(() => []),
					fetch('/api/setlist').then(r => r.json()).catch(() => ({})),
					// 🔽 新增這行去取得替換旗標

				]);

                const rawCardTypes = ctData || [];

					processSpText(fetchedCards);
				}

				const filteredCards = sortCardList(fetchedCards, sortParam);

                    const match = rawCardTypes.find(ct => ct.value === typeVal);
                    return match ? match.text : typeVal;
                };

                const displayTitleCode = currentSetObj.setcode || setCode || '自訂牌組';
                const setName = currentSetObj.setname || currentSetObj.name || displayTitleCode;

                if (customTitleParam && customTitleParam.trim() !== '') {
                    const cleanTitle = customTitleParam.trim();
                    document.title = `${cleanTitle} - 卡表總覽`;

                const globalAppearedAbilities = new Set();
                const container = document.getElementById('card-list-container');
                let htmlContent = '';

                const isDeckSet = currentSetObj && currentSetObj.isdeck === true;

                filteredCards.forEach((card, idx) => {
                    const cleanName = card.name || '未命名卡牌';
                    let picUrl = '';
                    let flavorText = '';
                    let setCardId = '';
                    let cardCount = 1;

                    const matchedItem = setCardList.find(item => {

                        return typeof itemName === 'string' && itemName.trim() === cleanName.trim();
                    });

                    if (matchedItem && typeof matchedItem === 'object') {

                        else if (typeof matchedItem.pic === 'string') picUrl = matchedItem.pic;

                        if (matchedItem.count !== undefined && matchedItem.count !== null) cardCount = Number(matchedItem.count);

					if (!picUrl || picUrl.trim() === '') {

									});

											picUrl = foundItem.pic[0];
											break;
										} else if (typeof foundItem.pic === 'string' && foundItem.pic.trim() !== '') {
											picUrl = foundItem.pic;
											break;
										}
									}
								}
							}
						}
					}

                    let isHorizontal = false;
                    if (card.wdata && card.wdata.length > 0 && card.wdata[0].type && card.wdata[0].type.length > 0) {
                        const firstTypeVal = card.wdata[0].type[0];
                        const matchedType = rawCardTypes.find(ct => ct.value === firstTypeVal);
                        if (matchedType && matchedType.horizontal === true) {
                            isHorizontal = true;
                        }
                    }

                    const horizClass = isHorizontal ? ' is-horizontal' : '';
                    const containerMaxWidth = isHorizontal ? '35%' : '25%';

                    htmlContent += `<div class="card-item">`;
                    htmlContent += `<div class="card-img-container" style="max-width: ${containerMaxWidth};">`;

                    // pop.html (圖文模式渲染)
					if (picUrl && picUrl.trim() !== '') {
						// 1. 有卡圖資料 ➔ 使用原本的 stacked-card-img 或 card-img，並掛上 onload/onerror
						if (isDeckSet && cardCount > 1) {
							htmlContent += `<div class="stack-img-container${horizClass}">`;
							for (let c = 0; c < cardCount; c++) {
								htmlContent += `<img class="stacked-card-img${horizClass}" style="z-index: ${cardCount - c};" src="${picUrl}" alt="${cleanName}" onerror="this.outerHTML='<div class=\\'no-image-box\\'>無卡圖</div>'" />`;
							}
							htmlContent += `</div>`;
						} else {
							htmlContent += `<img class="card-img${horizClass}" src="${picUrl}" alt="${cleanName}" onerror="this.outerHTML='<div class=\\'no-image-box\\'>無卡圖</div>'" />`;
						}
					} else {
						// 2. 連圖都借不到 ➔ 直接顯示「無卡圖」
						htmlContent += `<div class="no-image-box${horizClass}">無卡圖</div>`;
					}

                    htmlContent += `<div class="export-disclaimer">圖片來源：官方/網路公開直鏈</div>`;
                    htmlContent += `</div>`;

                    htmlContent += `<div class="card-detail">`;
                    
                    let countPrefix = '';
                    if (isDeckSet && (!picUrl || picUrl.trim() === '')) {
                        countPrefix = `<span style="font-weight: bold; color: #d32f2f; margin-right: 6px;">${cardCount} ⅹ </span>`;
                    }

                    let sanctuarySymbol = '';
					let sanctuaryMsg = '';
					if (card.sanctuary !== undefined && card.sanctuary !== null) {
						if (card.sanctuary == 1) {
							sanctuarySymbol = '[殿堂]';
							sanctuaryMsg = '殿堂';
						} else if (card.sanctuary == 0) {
							sanctuarySymbol = '[白金殿堂]';
							sanctuaryMsg = '白金殿堂';
						} else if (Array.isArray(card.sanctuary) && card.sanctuary.length > 0) {
							sanctuarySymbol = '[組合殿堂]';
							sanctuaryMsg = `組合殿堂：${card.sanctuary.join(',')}`;
						}
					}

					let sanctuaryHtml = '';
					if (sanctuarySymbol) {
						const safeAttr = sanctuaryMsg.replace(/"/g, '&quot;');
						const safeAlert = sanctuaryMsg.replace(/'/g, "\\'").replace(/"/g, '\\"');
						sanctuaryHtml = `<span style="cursor: help; color: #d32f2f; margin-right: 4px;" title="${safeAttr}" onclick="alert('${safeAlert}'); event.stopPropagation();">${sanctuarySymbol}</span>`;
					}

					// ✅ 正確程式碼
					const indexPrefix = isDeckSet ? '' : `#${idx + 1} `;
					htmlContent += `<div class="card-title">${sanctuaryHtml}${indexPrefix}${countPrefix}${setCardId ? `[${formatDmId(setCardId)}] ` : ''}${cleanName}</div>`;

                    const newAbilitiesForThisCard = [];

                    if (card.wdata && Array.isArray(card.wdata)) {
                        card.wdata.forEach(w => {
                            htmlContent += `<div class="wdata-box">`;
                            const metaFields = [];

							if (w.type && Array.isArray(w.type) && w.type.length > 0) {
								const typeText = w.type.map(t => getCardTypeText(t)).join(', ');
								if (typeText) metaFields.push(`<b>卡種:</b> ${typeText}`);
							}

							// 💡 只有文明有資料時才加入
							if (w.civil !== undefined && w.civil !== null && w.civil !== '') {
								metaFields.push(`<b>文明:</b> ${getCivText(w.civil)}`);
							}

							if (w.cost !== undefined && w.cost !== null) {
								metaFields.push(`<b>費用:</b> ${formatDisplayValue(w.cost)}`);
							}

							let powerText = '';
							if (w.power !== undefined && w.power !== null) {
								powerText = formatDisplayValue(w.power);
							}
							if (w.hypermode && w.hypermode.power !== undefined && w.hypermode.power !== null) {
								const hyperPower = formatDisplayValue(w.hypermode.power);
								powerText = powerText ? `${powerText} / ${hyperPower}` : hyperPower;
							}
							if (powerText) {
								metaFields.push(`<b>攻擊力:</b> ${powerText}`);
							}

							// 第一行：只印出有資料的欄位
							if (metaFields.length > 0) {
								htmlContent += `<div>${metaFields.join(' | ')}</div>`;
							}

							// 💡 種族獨立一行：若沒種族資料，完全不輸出整行與 Title
							if (w.race && Array.isArray(w.race) && w.race.length > 0) {
								htmlContent += `<div style="margin-top: 4px;"><b>種族:</b> ${w.race.join(', ')}</div>`;
							}

                            const sortedRawAbilities = [...rawAbilities].filter(a => a && a.jap).sort((a, b) => b.jap.length - a.jap.length);

                            const checkAndCollectAbilities = (spList) => {
                                if (!spList || !Array.isArray(spList)) return;
                                spList.forEach(spText => {
                                    if (!spText) return;
                                    let tempSpText = spText;
                                    sortedRawAbilities.forEach(abil => {
                                        const keyword = abil.jap;
                                        if (tempSpText.includes(keyword)) {
                                            if (!globalAppearedAbilities.has(keyword)) {
                                                globalAppearedAbilities.add(keyword);
                                                newAbilitiesForThisCard.push(abil);
                                            }
                                            const regex = new RegExp(escapeRegExp(keyword), 'g');
                                            tempSpText = tempSpText.replace(regex, '___MATCHED___');
                                        }
                                    });
                                });
                            };

                            if (w.sp && w.sp.length > 0) {
								checkAndCollectAbilities(w.sp);
								htmlContent += `<ul class="sp-list">`;
								w.sp.forEach(s => htmlContent += renderSpItemHtml(s));
								htmlContent += `</ul>`;
							} else {
								// 💡 若無特殊能力，顯示 ( 無能力 )
								htmlContent += `<div style="font-size:13px; color:#777; font-style:italic; margin-top:4px;">( 無能力 )</div>`;
							}

                            if (w.hypermode && w.hypermode.sp && w.hypermode.sp.length > 0) {
                                checkAndCollectAbilities(w.hypermode.sp);
                                htmlContent += `<div class="hyper-divider">Hyper Mode</div>`;
                                htmlContent += `<ul class="sp-list">`;
                                w.hypermode.sp.forEach(hs => htmlContent += renderSpItemHtml(hs));
                                htmlContent += `</ul>`;
                            }

                            htmlContent += `</div>`;
                        });
                    }

                    if (card.mana !== null && card.mana !== undefined) {
                        htmlContent += `
                            <div style="background: #f1f8e9; border-left: 3px solid #4caf50; padding: 6px 10px; font-size: 13px; font-weight: bold; color: #33691e; border-radius: 4px; margin-top: 8px;">
                                魔力供應 ${card.mana}
                            </div>
                        `;
                    }

                    if (flavorText) {
                        htmlContent += `<div class="card-flavor">Flavor: ${flavorText}</div>`;
                    }

                    if (newAbilitiesForThisCard.length > 0) {
                        htmlContent += `<div class="ability-explain-box">`;
                        newAbilitiesForThisCard.forEach(abil => {
                            const headerLine = [abil.jap, abil.chi || abil.cht, abil.eng].filter(Boolean).join(' / ');
                            const descStr = abil.descript || abil.desc || abil.text || abil.detail || '(無效果說明)';
                            htmlContent += `
                                <div class="ability-explain-item">
                                    <span class="ability-title">【${headerLine}】</span>: ${descStr}
                                </div>
                            `;
                        });
                        htmlContent += `</div>`;
                    }

                    htmlContent += `</div></div>`;
                });

                container.innerHTML = htmlContent;

            } catch (err) {
                console.error("載入發生錯誤:", err);
                document.getElementById('page-title').innerText = "❌ 載入失敗，請確認網路或 API 狀態。";
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 💡 監聽螢幕旋轉與 Resize 事件：手機轉橫向時即時重新調整純圖片模式的大小
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(updateImgOnlyScale, 100);
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(updateImgOnlyScale, 200);
        });

        window.addEventListener('DOMContentLoaded', initPopPage);
    </script>
</body>
</html>
