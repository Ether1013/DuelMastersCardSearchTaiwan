<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品卡表展示</title>
    <style>
        body { 
            font-family: "微軟正黑體", sans-serif; 
            padding: 20px; 
            background: #fff; 
            color: #111; 
            line-height: 1.5; 
        }
        h1 { 
            border-bottom: 2px solid #333; 
            padding-bottom: 8px; 
            font-size: 20px; 
        }
        .card-item { 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            padding: 15px; 
            margin-bottom: 15px; 
            display: flex; 
            gap: 15px; 
            page-break-inside: avoid; 
        }
        .card-img-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			flex-shrink: 0;
			max-width: 140px; /* 💡 請改成 width: auto; 讓 inline style 能動態覆蓋 */
			width: auto;
		}
		/* 橫向單張卡圖 */
		.card-img.is-horizontal {
			width: 196px !important;
			height: 140px !important;
		}
        .card-img { 
			width: 140px; 
			height: 196px; 
			object-fit: contain; 
			background: #f0f0f0; 
			border-radius: 4px; 
			transition: all 0.2s ease; /* 旋轉螢幕時有平滑過渡 */
		}
        .card-detail { 
            flex: 1; 
        }
        .card-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: #d32f2f; 
            margin-bottom: 6px; 
        }
        .card-flavor { 
            background: #fffbe6; 
            border: 1px solid #ffe58f; 
            padding: 6px 10px; 
            font-style: italic; 
            font-size: 13px; 
            color: #873800; 
            border-radius: 4px; 
            margin-top: 8px; 
            margin-bottom: 8px; 
        }
        .wdata-box { 
            background: #f8f9fa; 
            border-left: 3px solid #333; 
            padding: 8px; 
            margin-top: 6px; 
            font-size: 13px; 
        }
        .sp-list { 
            margin: 4px 0 0 18px; 
            padding: 0; 
        }
        .hyper-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
            font-size: 12px;
            margin: 8px 0 4px 0;
        }
        .hyper-divider::before, .hyper-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed #d32f2f;
        }
        .hyper-divider:not(:empty)::before { margin-right: .5em; }
        .hyper-divider:not(:empty)::after { margin-left: .5em; }

        .ability-explain-box {
            background: #eef6ff;
            border: 1px solid #bbdefb;
            border-radius: 4px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
        }
        .ability-explain-item { margin-bottom: 6px; }
        .ability-explain-item:last-child { margin-bottom: 0; }
        .ability-title { font-weight: bold; color: #1565c0; }

        .export-disclaimer {
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-top: 4px;
            user-select: none;
            white-space: nowrap;
        }

        /* 載入中 Loading 畫面 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999; color: #333; font-size: 18px; font-weight: bold;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #d32f2f; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
		
		/* 套牌卡圖多張重疊 CSS */
		.stack-img-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			position: relative;
			margin-bottom: 10px;
		}
		.stacked-card-img {
			width: 140px;
			height: 196px;
			object-fit: contain;
			background: #f0f0f0;
			border-radius: 4px;
			box-shadow: 0 -2px 6px rgba(0,0,0,0.25);
			position: relative;
			transition: all 0.2s ease;
		}

		/* 從第二張開始向上滑入覆蓋 */
		.stacked-card-img:not(:first-child) {
			margin-top: -165px; /* 預設重疊偏移量 */
			transition: all 0.2s ease;
		}
		
		/* 1. 針對多張重疊容器與卡圖增加橫向卡支援 */
		.stack-img-container.is-horizontal {
			max-width: 196px; /* 橫向卡寬度展開 */
		}

		/* 橫向卡的重疊圖片樣式 */
		.stacked-card-img.is-horizontal {
			width: 196px !important;
			height: 140px !important;
		}

		/* 2. 訂正：橫向卡專用的重疊位移量（因為高度只有 140px，負邊距需縮小） */
		.stacked-card-img.is-horizontal:not(:first-child) {
			margin-top: -110px !important; /* 調整為適合橫向卡高度的偏移量 */
		}

		/* ===================================================
		   💡 行動裝置 + 直立螢幕 (Portrait) 尺寸縮小 40% 響應式設定
		   =================================================== */
		@media (max-width: 768px) and (orientation: portrait) {
			/* 💡 新增：卡圖外容器最大寬度同步縮小為 84px */
			.card-img-container {
				max-width: 84px !important;
			}

			/* 1. 單張卡圖：寬 84px / 高 118px */
			.card-img {
				width: 84px !important;
				height: 118px !important;
			}

			/* 2. 重疊卡圖：寬 84px / 高 118px */
			.stacked-card-img {
				width: 84px !important;
				height: 118px !important;
			}

			/* 3. 重疊偏移量：-99px */
			.stacked-card-img:not(:first-child) {
				margin-top: -99px !important;
			}
			.stacked-card-img.is-horizontal {
				width: 118px !important;
				height: 84px !important;
			}
			.stacked-card-img.is-horizontal:not(:first-child) {
				margin-top: -66px !important;
			}
		}
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div id="loading-text">資料讀取與卡表生成中...</div>
    </div>

    <h1 id="page-title">商品卡表載入中...</h1>
    <div id="card-list-container"></div>

    <script>
		const INFINITY_THRESHOLD = 9000000000000000;

		function formatDisplayValue(val) {
			if (val === null || val === undefined) return '';
			const num = Number(val);
			if (!isNaN(num) && num >= INFINITY_THRESHOLD) return '∞';
			return String(val);
		}

		function escapeRegExp(string) {
			return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
		}

		function formatDmId(rawId) {
			if (!rawId) return '';
			const strId = String(rawId).trim();
			return strId.toUpperCase().startsWith('DM') ? strId : 'DM' + strId;
		}

		async function initPopPage() {
			const urlParams = new URLSearchParams(window.location.search);
			const setCode = urlParams.get('setCode');

			if (!setCode) {
				document.getElementById('loading').style.display = 'none';
				document.getElementById('page-title').innerText = "❌ 錯誤：未在 URL 中指定 setCode 參數！";
				return;
			}

			try {
				// 💡 併行讀取：專用商品卡片資料 + 類型與能力靜態檔 + 全域商品列表(作為備援)
				const [popRes, ctData, abilData, setlistData] = await Promise.all([
					fetch(`/api/pop/${encodeURIComponent(setCode)}`),
					fetch('/api/card_types').then(r => r.json()).catch(() => []),
					fetch('/api/abilities').then(r => r.json()).catch(() => []),
					fetch('/api/setlist').then(r => r.json()).catch(() => ({}))
				]);

				if (!popRes.ok) {
					document.getElementById('loading').style.display = 'none';
					document.getElementById('page-title').innerText = `❌ 錯誤：找不到代碼為「${setCode}」的商品資料！`;
					return;
				}

				const { set_info: currentSetObj, cards: filteredCards } = await popRes.json();
				const rawCardTypes = ctData || [];
				const rawAbilities = abilData || [];
				const rawSetlist = setlistData || {};

				const getCardTypeText = (typeVal) => {
					const match = rawCardTypes.find(ct => ct.value === typeVal);
					return match ? match.text : typeVal;
				};

				const setName = currentSetObj.setname || currentSetObj.name || setCode;
				document.getElementById('page-title').innerText = `${setCode} ${setName} - 卡表總覽`;

				const setCardList = currentSetObj.setcardlist || currentSetObj.cardlist || [];
				if (!Array.isArray(setCardList) || setCardList.length === 0) {
					document.getElementById('loading').style.display = 'none';
					document.getElementById('card-list-container').innerHTML = '<div>目前商品無收錄卡牌資料。</div>';
					return;
				}

				// 全域出現過的能力關鍵字集合
				const globalAppearedAbilities = new Set();
				const container = document.getElementById('card-list-container');
				let htmlContent = '';

				const isDeckSet = currentSetObj && currentSetObj.isdeck === true;

				// 💡 對過濾好的 filteredCards 進行渲染
				filteredCards.forEach((card, idx) => {
					const cleanName = card.name || '未命名卡牌';
					let picUrl = '';
					let flavorText = '';
					let setCardId = '';
					let cardCount = 1;

					// 1. 優先從專用商品對應資料中提取 Pic, Flavor, ID, Count
					const matchedItem = setCardList.find(item => {
						const itemName = (typeof item === 'object' && item !== null) ? item.name : item;
						return typeof itemName === 'string' && itemName.trim() === cleanName.trim();
					});

					if (matchedItem && typeof matchedItem === 'object') {
						if (Array.isArray(matchedItem.pic) && matchedItem.pic.length > 0) picUrl = matchedItem.pic[0];
						else if (typeof matchedItem.pic === 'string') picUrl = matchedItem.pic;

						if (Array.isArray(matchedItem.flavor) && matchedItem.flavor.length > 0) flavorText = matchedItem.flavor[0];
						else if (typeof matchedItem.flavor === 'string') flavorText = matchedItem.flavor;

						if (matchedItem.id) setCardId = Array.isArray(matchedItem.id) ? matchedItem.id[0] : matchedItem.id;

						if (matchedItem.count !== undefined && matchedItem.count !== null) {
							cardCount = Number(matchedItem.count);
						}
					}

					// 2. 備援層級一：若商品資料無圖片，讀取卡牌物件自身的 pic
					if (!picUrl || picUrl.trim() === '') {
						picUrl = card.pic || '';
					}

					// 3. 備援層級二：若仍無圖片，遍歷全域 Setlist 資料庫搜尋對應圖片
					if (!picUrl || picUrl.trim() === '') {
						const cleanTargetName = cleanName.trim();
						if (typeof rawSetlist === 'object' && rawSetlist !== null && cleanTargetName) {
							for (const setObj of Object.values(rawSetlist)) {
								const cardList = setObj.setcardlist || setObj.cardlist;
								if (Array.isArray(cardList)) {
									const foundItem = cardList.find(item => {
										const itemName = (typeof item === 'object' && item !== null) ? item.name : item;
										return typeof itemName === 'string' && itemName.trim() === cleanTargetName;
									});

									if (foundItem && foundItem.pic) {
										if (Array.isArray(foundItem.pic) && foundItem.pic.length > 0 && foundItem.pic[0]) {
											picUrl = foundItem.pic[0];
											break;
										} else if (typeof foundItem.pic === 'string' && foundItem.pic.trim() !== '') {
											picUrl = foundItem.pic;
											break;
										}
									}
								}
							}
						}
					}

					// 💡 判斷是否為橫向卡
					let isHorizontal = false;
					if (card.wdata && card.wdata.length > 0 && card.wdata[0].type && card.wdata[0].type.length > 0) {
						const firstTypeVal = card.wdata[0].type[0];
						const matchedType = rawCardTypes.find(ct => ct.value === firstTypeVal);
						if (matchedType && matchedType.horizontal === true) {
							isHorizontal = true;
						}
					}

					const horizClass = isHorizontal ? ' is-horizontal' : '';
					const containerMaxWidth = isHorizontal ? '196px' : '140px';

					// ------------------- A. 圖片與 DOM 結構 -------------------
					htmlContent += `<div class="card-item">`;
					htmlContent += `<div class="card-img-container" style="max-width: ${containerMaxWidth};">`;

					if (picUrl && picUrl.trim() !== '') {
						if (isDeckSet && cardCount > 1) {
							htmlContent += `<div class="stack-img-container${horizClass}">`;
							for (let c = 0; c < cardCount; c++) {
								htmlContent += `<img class="stacked-card-img${horizClass}" style="z-index: ${cardCount - c};" src="${picUrl}" alt="${cleanName}" />`;
							}
							htmlContent += `</div>`;
						} else {
							htmlContent += `<img class="card-img${horizClass}" src="${picUrl}" alt="${cleanName}" />`;
						}
					} else {
						htmlContent += `<div class="card-img${horizClass}" style="display:flex;align-items:center;justify-content:center;color:#888;">No Image</div>`;
					}

					htmlContent += `<div class="export-disclaimer">圖片來源：官方/網路公開直鏈</div>`;
					htmlContent += `</div>`; // 關閉 .card-img-container

					// ------------------- B. 卡牌詳細文字 -------------------
					htmlContent += `<div class="card-detail">`;
					
					let countPrefix = '';
					if (isDeckSet && (!picUrl || picUrl.trim() === '') && cardCount > 1) {
						countPrefix = `<span style="font-weight: bold; color: #d32f2f; margin-right: 6px;">${cardCount} ⅹ </span>`;
					}

					const indexPrefix = isDeckSet ? '' : `#${idx + 1} `;

					htmlContent += `<div class="card-title">${indexPrefix}${countPrefix}${setCardId ? `[${formatDmId(setCardId)}] ` : ''}${cleanName}</div>`;

					const newAbilitiesForThisCard = [];

					if (card.wdata && Array.isArray(card.wdata)) {
						card.wdata.forEach(w => {
							const typeText = (w.type && Array.isArray(w.type)) 
								? w.type.map(t => getCardTypeText(t)).join(', ') 
								: '無';

							let displayPower = w.power !== undefined && w.power !== null ? formatDisplayValue(w.power) : '-';
							if (w.hypermode && w.hypermode.power !== undefined && w.hypermode.power !== null) {
								displayPower = `${displayPower} / ${formatDisplayValue(w.hypermode.power)}`;
							}

							htmlContent += `<div class="wdata-box">`;
							htmlContent += `<div><b>卡種:</b> ${typeText} | <b>費用:</b> ${w.cost !== undefined && w.cost !== null ? formatDisplayValue(w.cost) : '-'} | <b>攻擊力:</b> ${displayPower} | <b>種族:</b> ${w.race ? w.race.join(', ') : '無'}</div>`;

							const sortedRawAbilities = [...rawAbilities].filter(a => a && a.jap).sort((a, b) => b.jap.length - a.jap.length);

							const checkAndCollectAbilities = (spList) => {
								if (!spList || !Array.isArray(spList)) return;
								spList.forEach(spText => {
									if (!spText) return;
									let tempSpText = spText;
									sortedRawAbilities.forEach(abil => {
										const keyword = abil.jap;
										if (tempSpText.includes(keyword)) {
											if (!globalAppearedAbilities.has(keyword)) {
												globalAppearedAbilities.add(keyword);
												newAbilitiesForThisCard.push(abil);
											}
											const regex = new RegExp(escapeRegExp(keyword), 'g');
											tempSpText = tempSpText.replace(regex, '___MATCHED___');
										}
									});
								});
							};

							if (w.sp && w.sp.length > 0) {
								checkAndCollectAbilities(w.sp);
								htmlContent += `<ul class="sp-list">`;
								w.sp.forEach(s => htmlContent += `<li>${formatDisplayValue(s)}</li>`);
								htmlContent += `</ul>`;
							}

							if (w.hypermode && w.hypermode.sp && w.hypermode.sp.length > 0) {
								checkAndCollectAbilities(w.hypermode.sp);
								htmlContent += `<div class="hyper-divider">Hyper Mode</div>`;
								htmlContent += `<ul class="sp-list">`;
								w.hypermode.sp.forEach(hs => htmlContent += `<li>${formatDisplayValue(hs)}</li>`);
								htmlContent += `</ul>`;
							}

							htmlContent += `</div>`;
						});
					}

					if (card.mana !== null && card.mana !== undefined) {
						htmlContent += `
							<div style="background: #f1f8e9; border-left: 3px solid #4caf50; padding: 6px 10px; font-size: 13px; font-weight: bold; color: #33691e; border-radius: 4px; margin-top: 8px;">
								Mana: ${card.mana}
							</div>
						`;
					}

					if (flavorText) {
						htmlContent += `<div class="card-flavor">Flavor: ${flavorText}</div>`;
					}

					if (newAbilitiesForThisCard.length > 0) {
						htmlContent += `<div class="ability-explain-box">`;
						newAbilitiesForThisCard.forEach(abil => {
							const headerLine = [abil.jap, abil.chi || abil.cht, abil.eng].filter(Boolean).join(' / ');
							const descStr = abil.descript || abil.desc || abil.text || abil.detail || '(無效果說明)';
							htmlContent += `
								<div class="ability-explain-item">
									<span class="ability-title">【${headerLine}】</span>: ${descStr}
								</div>
							`;
						});
						htmlContent += `</div>`;
					}

					htmlContent += `</div></div>`; // 關閉 .card-detail 與 .card-item
				});

				container.innerHTML = htmlContent;

			} catch (err) {
				console.error("載入發生錯誤:", err);
				document.getElementById('page-title').innerText = "❌ 載入失敗，請確認網路或 API 狀態。";
			} finally {
				document.getElementById('loading').style.display = 'none';
			}
		}

		window.addEventListener('DOMContentLoaded', initPopPage);
	</script>
</body>
</html>
