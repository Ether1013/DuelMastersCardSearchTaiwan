<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌列表匯出結果</title>
    <style>
        /* 基礎全域樣式 */
        body {
            font-family: "微軟正黑體", sans-serif;
            margin: 0;
            padding: 20px;
            background: #fff;
            color: #111;
            line-height: 1.5;
        }

        /* ================= 模式 1：僅匯出圖片 (圖格展開模式) ================= */
        body.mode-img-only {
            background: #111 !important;
            color: #fff !important;
        }
        .img-grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .img-grid-row {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            align-items: flex-end; /* 💡 向底對齊 */
        }
        .img-card-col {
            flex: 1;
            min-width: 0;
        }
        .img-stack-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .img-only-card {
            width: 100%;
            max-width: 160px;
            height: auto;
            aspect-ratio: 5/7; /* 直立呈現不打橫 */
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            position: relative;
            background: #222;
        }
        /* 💡 僅在「僅圖片模式」專用的推疊負邊距 */
        .img-only-card:not(:last-child) {
            margin-bottom: -118%;
        }
        .no-img-box {
            width: 100%;
            max-width: 160px;
            aspect-ratio: 5/7;
            background: #222;
            border: 2px dashed #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 12px;
            text-align: center;
            padding: 4px;
            box-sizing: border-box;
        }

        /* ================= 模式 2 & 3：標準圖文 / 純文字模式樣式 ================= */
        .card-item {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            page-break-inside: avoid;
        }
        .card-img-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            max-width: 140px;
        }
        .card-img-container.is-horizontal {
            max-width: 196px;
        }
        .card-img {
            width: 140px;
            height: 196px;
            object-fit: contain;
            flex-shrink: 0;
            background: #f0f0f0;
            border-radius: 4px;
        }
        .card-img.is-horizontal {
            width: 196px !important;
            height: 140px !important;
        }

        /* 圖文模式專用的階梯重疊（不影響僅圖片模式） */
        .std-stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }
        .std-stacked-img {
            width: 140px;
            height: 196px;
            object-fit: contain;
            background: #f0f0f0;
            border-radius: 4px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.25);
            position: relative;
        }
        .std-stacked-img:not(:first-child) {
            margin-top: -165px;
        }
        .std-stacked-img.is-horizontal {
            width: 196px !important;
            height: 140px !important;
        }
        .std-stacked-img.is-horizontal:not(:first-child) {
            margin-top: -110px !important;
        }

        .card-detail { flex: 1; }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 6px;
        }
        .card-flavor {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            padding: 6px 10px;
            font-style: italic;
            font-size: 13px;
            color: #873800;
            border-radius: 4px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .wdata-box {
            background: #f8f9fa;
            border-left: 3px solid #333;
            padding: 8px;
            margin-top: 6px;
            font-size: 13px;
        }
        .sp-list { margin: 4px 0 0 18px; padding: 0; }
        .hyper-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
            font-size: 12px;
            margin: 8px 0 4px 0;
        }
        .hyper-divider::before, .hyper-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed #d32f2f;
        }
        .hyper-divider:not(:empty)::before { margin-right: .5em; }
        .hyper-divider:not(:empty)::after { margin-left: .5em; }
        .ability-explain-box {
            background: #eef6ff;
            border: 1px solid #bbdefb;
            border-radius: 4px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
        }
        .ability-explain-item { margin-bottom: 6px; }
        .ability-explain-item:last-child { margin-bottom: 0; }
        .ability-title { font-weight: bold; color: #1565c0; }
        .export-disclaimer {
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-top: 4px;
            user-select: none;
            white-space: nowrap;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .card-img { width: 84px !important; height: 118px !important; }
            .std-stacked-img { width: 84px !important; height: 118px !important; }
            .std-stacked-img:not(:first-child) { margin-top: -99px !important; }
            .std-stacked-img.is-horizontal { width: 118px !important; height: 84px !important; }
            .std-stacked-img.is-horizontal:not(:first-child) { margin-top: -66px !important; }
        }
    </style>
</head>
<body>
    <div id="app-root">載入中...</div>

    <script>
        (function() {
            const rawPayload = sessionStorage.getItem('dm_export_payload');
            const appRoot = document.getElementById('app-root');

            if (!rawPayload) {
                appRoot.innerHTML = `
                    <div style="text-align:center; padding-top:60px; font-family:sans-serif;">
                        <h2>⚠️ 匯出資料已過期或不存在</h2>
                        <p style="color:#666;">請回搜尋器頁面重新點擊「匯出」按鈕。</p>
                    </div>
                `;
                return;
            }

            try {
                const payload = JSON.parse(rawPayload);
                const { mode, items, isDeckSet, cardTypes } = payload;
                const specialIcons = ["✪", "⌂", "✚", "✡"];

                function getCardTypeText(typeVal) {
                    if (!cardTypes || !Array.isArray(cardTypes)) return typeVal;
                    const match = cardTypes.find(ct => ct.value === typeVal);
                    return match ? match.text : typeVal;
                }

                // ----------------------------------------------------
                // 模式 1：僅匯出圖片 (Image Only)
                // ----------------------------------------------------
                if (mode === 'img_only') {
                    document.body.classList.add('mode-img-only');
                    document.title = `匯出結果 - 僅圖片模式 (${items.length}種卡牌)`;

                    function calculateRowDistribution(totalCards) {
                        if (totalCards <= 0) return [];
                        if (totalCards === 9) return [5, 4];
                        if (totalCards <= 8) return [totalCards];
                        let rows = Math.ceil(totalCards / 8);
                        let baseItems = Math.floor(totalCards / rows);
                        let remainder = totalCards % rows;
                        let dist = [];
                        for (let i = 0; i < rows; i++) {
                            dist.push(baseItems + (i < remainder ? 1 : 0));
                        }
                        return dist;
                    }

                    const rowDist = calculateRowDistribution(items.length);
                    let html = '<div class="img-grid-container">';
                    let currIdx = 0;

                    rowDist.forEach(countInRow => {
                        html += '<div class="img-grid-row">';
                        for (let i = 0; i < countInRow; i++) {
                            const item = items[currIdx];
                            if (item) {
                                html += '<div class="img-card-col">';
                                if (item.picUrl) {
                                    html += '<div class="img-stack-box">';
                                    for (let c = 0; c < item.count; c++) {
                                        const zIndex = c + 1; // 向後上堆疊：底部的卡 z-index 最高
                                        html += `<img class="img-only-card" style="z-index:${zIndex};" src="${item.picUrl}" alt="${item.name}" />`;
                                    }
                                    html += '</div>';
                                } else {
                                    html += `<div class="no-img-box">${item.name}<br>(No Image)</div>`;
                                }
                                html += '</div>';
                            }
                            currIdx++;
                        }
                        html += '</div>';
                    });
                    html += '</div>';
                    appRoot.innerHTML = html;
                    return;
                }

                // ----------------------------------------------------
                // 模式 2 & 3：圖+效果 (img_text) 與 只要效果 (text_only)
                // ----------------------------------------------------
                document.title = `卡牌列表匯出結果 (${items.length}張)`;
                const includeImage = (mode === 'img_text');
                let html = '';

                items.forEach((item, idx) => {
                    const cleanName = item.name || '未命名卡牌';
                    const picUrl = item.picUrl || '';
                    const flavorText = item.flavorText || '';
                    const setCardId = item.setCardId || '';
                    const cardCount = item.count || 1;
                    const isHorizontal = item.isHorizontal || false;
                    const horizClass = isHorizontal ? ' is-horizontal' : '';

                    html += '<div class="card-item">';

                    // 左欄：圖片
                    if (includeImage) {
                        const containerMaxWidth = isHorizontal ? '196px' : '140px';
                        html += `<div class="card-img-container${horizClass}" style="max-width:${containerMaxWidth};">`;
                        
                        if (picUrl) {
                            if (isDeckSet && cardCount > 1) {
                                html += `<div class="std-stack-container${horizClass}">`;
                                for (let c = 0; c < cardCount; c++) {
                                    html += `<img class="std-stacked-img${horizClass}" style="z-index:${cardCount - c};" src="${picUrl}" alt="${cleanName}" />`;
                                }
                                html += '</div>';
                            } else {
                                html += `<img class="card-img${horizClass}" src="${picUrl}" alt="${cleanName}" />`;
                            }
                        } else {
                            html += `<div class="card-img${horizClass}" style="display:flex;align-items:center;justify-content:center;color:#888;">No Image</div>`;
                        }

                        html += '<div class="export-disclaimer">圖片來源：官方/網路公開直鏈</div>';
                        html += '</div>';
                    }

                    // 右欄：詳細資料
                    html += '<div class="card-detail">';
                    
                    let countPrefix = '';
                    if (isDeckSet && (!includeImage || !picUrl)) {
                        countPrefix = `<span style="font-weight:bold; color:#d32f2f; margin-right:6px;">${cardCount} ⅹ </span>`;
                    }
                    const indexPrefix = isDeckSet ? '' : `#${idx + 1} `;
                    html += `<div class="card-title">${indexPrefix}${countPrefix}${setCardId ? `[DM${setCardId}] ` : ''}${cleanName}</div>`;

                    if (item.wdata && Array.isArray(item.wdata)) {
                        item.wdata.forEach(w => {
                            const typeText = (w.type && Array.isArray(w.type)) ? w.type.map(t => getCardTypeText(t)).join(', ') : '無';
                            let displayPower = w.power ?? '-';
                            if (w.hypermode && w.hypermode.power !== undefined && w.hypermode.power !== null) {
                                displayPower = `${displayPower} / ${w.hypermode.power}`;
                            }

                            html += '<div class="wdata-box">';
                            html += `<div><b>卡種:</b> ${typeText} | <b>費用:</b> ${w.cost ?? '-'} | <b>攻擊力:</b> ${displayPower} | <b>種族:</b> ${w.race ? w.race.join(', ') : '無'}</div>`;

                            function renderSpListHtml(spList) {
                                if (!spList || !Array.isArray(spList) || spList.length === 0) return '';
                                let spHtml = '<ul class="sp-list">';
                                spList.forEach(spRaw => {
                                    if (!spRaw) return;
                                    let formatted = String(spRaw);
                                    if (formatted.startsWith('HINT:')) {
                                        const hintContent = formatted.replace(/^HINT:\s*/, '');
                                        spHtml += `<li style="list-style-type:none;"><div style="color:#666; font-style:italic; font-size:13px; margin:4px 0;">（${hintContent}）</div></li>`;
                                    } else if (formatted.includes('#')) {
                                        const parts = formatted.split(/#+/).map(p => p.trim()).filter(Boolean);
                                        if (parts.length > 0) {
                                            const isSpecial = specialIcons.some(icon => parts[0].startsWith(icon));
                                            const mainStyle = isSpecial ? ' style="list-style-type:none; margin-left:-1.2em;"' : '';
                                            spHtml += `<li${mainStyle}><div style="font-weight:bold; margin-bottom:2px;">${parts[0]}</div><ul style="margin:2px 0 6px 18px; padding-left:0;">`;
                                            for (let i = 1; i < parts.length; i++) {
                                                spHtml += `<li>${parts[i]}</li>`;
                                            }
                                            spHtml += '</ul></li>';
                                        }
                                    } else {
                                        const isSpecial = specialIcons.some(icon => formatted.startsWith(icon));
                                        const hideStyle = isSpecial ? ' style="list-style-type:none; margin-left:-1.2em;"' : '';
                                        spHtml += `<li${hideStyle}>${formatted}</li>`;
                                    }
                                });
                                spHtml += '</ul>';
                                return spHtml;
                            }

                            html += renderSpListHtml(w.sp);

                            if (w.hypermode && w.hypermode.sp && w.hypermode.sp.length > 0) {
                                html += '<div class="hyper-divider">Hyper Mode</div>';
                                html += renderSpListHtml(w.hypermode.sp);
                            }

                            html += '</div>';
                        });
                    }

                    if (item.mana !== null && item.mana !== undefined) {
                        html += `<div style="background:#f1f8e9; border-left:3px solid #4caf50; padding:6px 10px; font-size:13px; font-weight:bold; color:#33691e; border-radius:4px; margin-top:8px;">魔力供應 ${item.mana}</div>`;
                    }

                    if (flavorText) {
                        html += `<div class="card-flavor">Flavor: ${flavorText}</div>`;
                    }

                    if (item.explainedAbilities && item.explainedAbilities.length > 0) {
                        html += '<div class="ability-explain-box">';
                        item.explainedAbilities.forEach(abil => {
                            const headerLine = [abil.jap, abil.chi || abil.cht, abil.eng].filter(Boolean).join(' / ');
                            const descStr = abil.descript || abil.desc || abil.text || abil.detail || '(無效果說明)';
                            html += `<div class="ability-explain-item"><span class="ability-title">【${headerLine}】</span>: ${descStr}</div>`;
                        });
                        html += '</div>';
                    }

                    html += '</div></div>';
                });

                appRoot.innerHTML = html;

            } catch (err) {
                console.error("解析匯出資料失敗:", err);
                appRoot.innerHTML = '<h3 style="color:red; text-align:center;">匯出資料解析錯誤</h3>';
            }
        })();
    </script>
</body>
</html>
