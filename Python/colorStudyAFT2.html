const DB = {"sourceName":"AFT_Grade2_Color_Certification_Terms_v3.xlsx","sourceRows":106,"terms":[{"id":"1","sourceId":1,"ja":"表色系","zh":"表色系統 / 表色系","en":"Color System","definition":"色を分類したり、伝達する時に基準となる色彩体系（基本的なルール）のこと。数字や記号を組み合わせて色を表すシステム。","sourceDefinition":"色を分類したり、伝達する時に基準となる色彩体系（基本的なルール）のこと。数字や記号を組み合わせて色を表すシステム。","notes":"以數字或記號定量標示色彩的體系，分為顯色系（Color Order System，如PCCS、Munsell）與混色系（如XYZ）。","unit":"found","micro":false,"sourceJa":"表色系","typing":true,"sourceCaution":"","aliases":["表色系"],"visual":"none"},{"id":"2","sourceId":2,"ja":"色の三属性","zh":"色彩三屬性","en":"Three Attributes of Color","definition":"色を伝えたり、表したりする時に使う『色相・明度・彩度』という３つのモノサシのこと。","sourceDefinition":"色を伝えたり、表したりする時に使う『色相・明度・彩度』という３つのモノサシのこと。","notes":"構成色彩的三個基本要素：色相（Hue）、明度（Lightness/Value）、彩度（Chroma/Saturation）。","unit":"found","micro":false,"sourceJa":"色の三属性","typing":true,"sourceCaution":"","aliases":["色の三属性"],"visual":"none"},{"id":"3-1","sourceId":3,"ja":"色相","zh":"色相","en":"Hue / Spectrum","definition":"色みの性質・色合いを表すもの。","sourceDefinition":"色相：色みの性質・色合いのこと。スペクトル：光を分解したときに波長順に並んで見える赤・橙・黄・緑・青・紫などの帯状の光の列。","notes":"色相為色彩相貌與特徵；光經複折射分解後依波長排列呈現紅橙黃綠青藍紫的帶狀光稱為光譜。","unit":"found","micro":true,"sourceJa":"色相 / スペクトル","typing":true,"sourceCaution":"","aliases":["色相"],"visual":"none"},{"id":"3-2","sourceId":3,"ja":"スペクトル","zh":"分光光譜","en":"Hue / Spectrum","definition":"光を分解したとき、波長順に並ぶ帯状の光の列。","sourceDefinition":"色相：色みの性質・色合いのこと。スペクトル：光を分解したときに波長順に並んで見える赤・橙・黄・緑・青・紫などの帯状の光の列。","notes":"色相為色彩相貌與特徵；光經複折射分解後依波長排列呈現紅橙黃綠青藍紫的帶狀光稱為光譜。","unit":"found","micro":true,"sourceJa":"色相 / スペクトル","typing":true,"sourceCaution":"","aliases":["スペクトル"],"visual":"none"},{"id":"4","sourceId":4,"ja":"色相環","zh":"色相環","en":"Hue Circle","definition":"すべての色が循環する環にしたもの。向かい合う色どうしは究極の反対色（補色）となる。","sourceDefinition":"すべての色が循環する環にしたもの。向かい合う色どうしは究極の反対色（補色）となる。","notes":"將紅、黃、綠、藍等色相首尾相接排列成環狀的圓環圖系，用於輔助配色與對比判讀。","unit":"found","micro":false,"sourceJa":"色相環","typing":true,"sourceCaution":"","aliases":["色相環"],"visual":"wheel"},{"id":"5-1","sourceId":5,"ja":"明度","zh":"明度","en":"Lightness / Greyscale","definition":"色の明るさの度合い。","sourceDefinition":"明度：色の明るさの度合いのこと。明度スケール（グレイスケール）：最も明度の高い白を上、最も明度の低い黒を下にして段階的に変わる灰色を並べた図。","notes":"色彩的明暗程度。將理想白（最高明度）至理想黑（最低明度）分為多個階調進行比對。","unit":"found","micro":true,"sourceJa":"明度 / 明度スケール","typing":true,"sourceCaution":"","aliases":["明度"],"visual":"lightness"},{"id":"5-2","sourceId":5,"ja":"明度スケール","zh":"明度階（灰階）","en":"Lightness / Greyscale","definition":"白から黒へ、明るさの段階を並べた灰色の図。","sourceDefinition":"明度：色の明るさの度合いのこと。明度スケール（グレイスケール）：最も明度の高い白を上、最も明度の低い黒を下にして段階的に変わる灰色を並べた図。","notes":"色彩的明暗程度。將理想白（最高明度）至理想黑（最低明度）分為多個階調進行比對。","unit":"found","micro":true,"sourceJa":"明度 / 明度スケール","typing":true,"sourceCaution":"","aliases":["明度スケール"],"visual":"lightness"},{"id":"6","sourceId":6,"ja":"彩度","zh":"彩度","en":"Chroma / Saturation","definition":"色の鮮やかさの度合いのこと。最も鮮やかな色から無彩色（彩度0）までの変化を表す。","sourceDefinition":"色の鮮やかさの度合いのこと。最も鮮やかな色から無彩色（彩度0）までの変化を表す。","notes":"色彩的鮮艷純淨程度。無彩色彩度為0，偏離無彩色越遠則彩度越高。","unit":"found","micro":false,"sourceJa":"彩度","typing":true,"sourceCaution":"","aliases":["彩度"],"visual":"chroma"},{"id":"7","sourceId":7,"ja":"等色相面","zh":"等色相面","en":"Iso-hue Plane","definition":"色相が等しい色を１つの面として表したもの。縦軸が明度、横軸が彩度になっている。","sourceDefinition":"色相が等しい色を１つの面として表したもの。縦軸が明度、横軸が彩度になっている。","notes":"單一色相的半圓形立面，縱軸為明度、橫軸為彩度。含純色、明清色、暗清色與中間色（濁色）。","unit":"found","micro":false,"sourceJa":"等色相面","typing":true,"sourceCaution":"","aliases":["等色相面"],"visual":"none"},{"id":"8","sourceId":8,"ja":"純色","zh":"純色","en":"Pure Color / Solid Color","definition":"有彩色のうち、最も彩度が高い色のこと。白も黒もグレイも混ざっていない純粋な色。","sourceDefinition":"有彩色のうち、最も彩度が高い色のこと。白も黒もグレイも混ざっていない純粋な色。","notes":"各色相中彩度最高的色彩，未混入白、黑或灰色。PCCS 中純色彩度統一標示為 9s。","unit":"found","micro":false,"sourceJa":"純色","typing":true,"sourceCaution":"","aliases":["純色"],"visual":"chroma"},{"id":"9","sourceId":9,"ja":"明清色","zh":"明清色","en":"Tint / Clear Light Color","definition":"純色に白だけを混ぜてできる色のこと。","sourceDefinition":"純色に白だけを混ぜてできる色のこと。","notes":"由「純色＋白色」混合而成的清亮色彩（如 p、lt、b 音調），無混入灰色，感官乾淨明亮。","unit":"found","micro":false,"sourceJa":"明清色","typing":true,"sourceCaution":"","aliases":["明清色"],"visual":"none"},{"id":"10","sourceId":10,"ja":"暗清色","zh":"暗清色","en":"Shade / Clear Dark Color","definition":"純色に黒だけを混ぜてできる色のこと。","sourceDefinition":"純色に黒だけを混ぜてできる色のこと。","notes":"由「純色＋黑色」混合而成的深沉色彩（如 dp、dk、dkg 音調），無混入灰色，保持深邃乾淨。","unit":"found","micro":false,"sourceJa":"暗清色","typing":true,"sourceCaution":"","aliases":["暗清色"],"visual":"none"},{"id":"11","sourceId":11,"ja":"中間色（濁色）","zh":"中間色 / 濁色","en":"Tone / Muted Color / Dull Color","definition":"純色に白と黒の両方（つまり灰色）を混ぜると濁った色になり、中間色（濁色）と呼ばれる。","sourceDefinition":"純色に白と黒の両方（つまり灰色）を混ぜると濁った色になり、中間色（濁色）と呼ばれる。","notes":"由「純色＋灰色」混合而成的色彩（如 ltg、sf、d、g 等音調），彩度降低，呈現平穩柔和質感。","unit":"found","micro":false,"sourceJa":"中間色（濁色）","typing":true,"sourceCaution":"","aliases":["中間色（濁色）"],"visual":"none"},{"id":"12","sourceId":12,"ja":"カラーオーダーシステム","zh":"顯色系 / 表色體系","en":"Color Order System","definition":"見た目に等しく感じられるように色票（カラーチップ）を使って色を表すことができる表色系。","sourceDefinition":"見た目に等しく感じられるように色票（カラーチップ）を使って色を表すことができる表色系。","notes":"以感官等間隔物體色色票（如 PCCS、Munsell）組成的色彩排列體系，方便視覺比對與配色選色。","unit":"found","micro":false,"sourceJa":"カラーオーダーシステム","typing":true,"sourceCaution":"","aliases":["カラーオーダーシステム"],"visual":"none"},{"id":"13","sourceId":13,"ja":"カラーチップ / 色票","zh":"色票 / 色卡","en":"Color Swatch / Color Chip","definition":"印刷や塗布などによって作られ、実際の色を確認・比較するために用いられる色標本（例：新配色カード199a）。","sourceDefinition":"印刷や塗布などによって作られ、実際の色を確認・比較するために用いられる色標本（例：新配色カード199a）。","notes":"印刷或塗佈於紙張/材質上用於精準比對色彩的實物樣本（如「新配色カード199a」）。","unit":"found","micro":false,"sourceJa":"カラーチップ / 色票","typing":false,"sourceCaution":"","aliases":["カラーチップ / 色票"],"visual":"none"},{"id":"14","sourceId":14,"ja":"色立体","zh":"色彩立體 / 色立體","en":"Color Solid","definition":"色相・明度・彩度の３つを同時に表すために三次元（立体）にしたもの。明度の基準となる無彩色を中心軸として、その周囲にいろいろな色相の等色相面を配置したもの。","sourceDefinition":"色相・明度・彩度の３つを同時に表すために三次元（立体）にしたもの。明度の基準となる無彩色を中心軸として、その周囲にいろいろな色相の等色相面を配置したもの。","notes":"以明度為中心軸，將各式等色相面依色相環順序圍繞排列建立的三維色彩空間結構。","unit":"found","micro":false,"sourceJa":"色立体","typing":true,"sourceCaution":"","aliases":["色立体"],"visual":"none"},{"id":"15","sourceId":15,"ja":"PCCS","zh":"日本色彩研究所配色體系","en":"Practical Color Co-ordinate System","definition":"『色彩調和』を目的とした色彩体系（Practical Color Co-ordinate System）。日本色彩研究所が開発。HueとToneの二属性で色を表示するヒュートーンシステムが最大の特徴。","sourceDefinition":"『色彩調和』を目的とした色彩体系（Practical Color Co-ordinate System）。日本色彩研究所が開発。HueとToneの二属性で色を表示するヒュートーンシステムが最大の特徴。","notes":"日本開發以「配色調和」為目的的表色系，採24色相與12音調（Tone）的 Hue-Tone 雙屬性架構。","unit":"found","micro":false,"sourceJa":"PCCS","typing":true,"sourceCaution":"","aliases":["PCCS"],"visual":"none"},{"id":"16","sourceId":16,"ja":"心理補色","zh":"心理補色","en":"Psychological Complementary Color","definition":"ある色をじっと見つめ続けた後、その色を視界から取り去った時に視界にぼんやり見える反対色のこと（PCCS色相環の対向位置）。","sourceDefinition":"ある色をじっと見つめ続けた後、その色を視界から取り去った時に視界にぼんやり見える反対色のこと（PCCS色相環の対向位置）。","notes":"凝視某色後在視覺中出現的對立補色（如紅對青綠、黃對藍紫），PCCS 色相環相對位置即基於此安排。","unit":"found","micro":false,"sourceJa":"心理補色","typing":true,"sourceCaution":"","aliases":["心理補色"],"visual":"none"},{"id":"17","sourceId":17,"ja":"ヒュートーンシステム","zh":"色相音調體系","en":"Hue-Tone System","definition":"Hue（色相）と、明度と彩度を複合して捉えた概念であるTone（トーン）の２つの属性を使って色を表すしくみ。","sourceDefinition":"Hue（色相）と、明度と彩度を複合して捉えた概念であるTone（トーン）の２つの属性を使って色を表すしくみ。","notes":"PCCS的核心概念，將明度與彩度複合稱為「Tone（音調）」，與「Hue（色相）」搭配進行直覺配色。","unit":"found","micro":false,"sourceJa":"ヒュートーンシステム","typing":true,"sourceCaution":"","aliases":["ヒュートーンシステム"],"visual":"none"},{"id":"18","sourceId":18,"ja":"マンセル表色系","zh":"曼塞爾表色系","en":"Munsell Color System","definition":"アメリカの画家・美術教育家のマンセルが考案し、アメリカ光学会（OSA）が修正した国際的に通用する表色系（修正マンセル表色系）。HV/Cで表示。","sourceDefinition":"アメリカの画家・美術教育家のマンセルが考案し、アメリカ光学会（OSA）が修正した国際的に通用する表色系（修正マンセル表色系）。HV/Cで表示。","notes":"美國 Munsell 提出的物體色顯色體系，以 HV/C 標示。2級測驗考點為與 PCCS 符號與明彩度極值的對照。","unit":"found","micro":false,"sourceJa":"マンセル表色系","typing":true,"sourceCaution":"","aliases":["マンセル表色系"],"visual":"none"},{"id":"19","sourceId":19,"ja":"カラーツリー","zh":"色彩樹 (曼塞爾色立體)","en":"Color Tree","definition":"マンセル色立体の通称。色相によって最高彩度の値や明度の位置が異なり、木がぐーんと伸びているように見えることから名付けられた。","sourceDefinition":"マンセル色立体の通称。色相によって最高彩度の値や明度の位置が異なり、木がぐーんと伸びているように見えることから名付けられた。","notes":"因曼塞爾各色相之最高彩度值與明度位置不一（如5R彩度高達14、5BG僅8），其色立體呈樹枝狀不規則形狀。","unit":"found","micro":false,"sourceJa":"カラーツリー","typing":true,"sourceCaution":"","aliases":["カラーツリー"],"visual":"none"},{"id":"20","sourceId":20,"ja":"等明度面","zh":"等明度面","en":"Iso-lightness Plane","definition":"色立立体を中心軸に対して垂直に交わるように水平に切断したときに現れる、明度の等しい面。","sourceDefinition":"色立立体を中心軸に対して垂直に交わるように水平に切断したときに現れる、明度の等しい面。","notes":"在色立體中水平切開獲得的平面，該平面上所有色彩皆具有完全相同的明度值。","unit":"found","micro":false,"sourceJa":"等明度面","typing":true,"sourceCaution":"","aliases":["等明度面"],"visual":"none"},{"id":"21","sourceId":21,"ja":"色の心理効果","zh":"色彩心理效果","en":"Psychological Effects of Color","definition":"色を見たときに起こる感情や主観的な心理的影響（暖色・寒色、進出・後退、膨張・収縮、重軽、硬軟など）。","sourceDefinition":"色を見たときに起こる感情や主観的な心理的影響（暖色・寒色、進出・後退、膨張・収縮、重軽、硬軟など）。","notes":"色彩帶給視覺與心理的主觀感受，含溫冷感、進退感、膨脹收縮感、輕重感與硬軟感。","unit":"psy","micro":false,"sourceJa":"色の心理効果","typing":true,"sourceCaution":"","aliases":["色の心理効果"],"visual":"none"},{"id":"22-1","sourceId":22,"ja":"暖色","zh":"暖色","en":"Warm / Cool / Neutral Colors","definition":"赤・橙・黄など、暖かく感じられる色。","sourceDefinition":"暖かく感じられる暖色（赤・橙・黄）、冷たく感じられる寒色（青・青緑）、暖かくも冷たく感じられない中性色（緑・紫・無彩色）。","notes":"暖色（紅橙黃）具溫熱感，寒色（藍青）具冰涼感，綠、紫與無彩色屬於中性色。","unit":"psy","micro":true,"sourceJa":"暖色・寒色・中性色","typing":true,"sourceCaution":"","aliases":["暖色"],"visual":"none"},{"id":"22-2","sourceId":22,"ja":"寒色","zh":"寒色","en":"Warm / Cool / Neutral Colors","definition":"青・青緑など、冷たく感じられる色。","sourceDefinition":"暖かく感じられる暖色（赤・橙・黄）、冷たく感じられる寒色（青・青緑）、暖かくも冷たく感じられない中性色（緑・紫・無彩色）。","notes":"暖色（紅橙黃）具溫熱感，寒色（藍青）具冰涼感，綠、紫與無彩色屬於中性色。","unit":"psy","micro":true,"sourceJa":"暖色・寒色・中性色","typing":true,"sourceCaution":"","aliases":["寒色"],"visual":"none"},{"id":"22-3","sourceId":22,"ja":"中性色","zh":"中性色","en":"Warm / Cool / Neutral Colors","definition":"暖かくも冷たくも感じにくい色。","sourceDefinition":"暖かく感じられる暖色（赤・橙・黄）、冷たく感じられる寒色（青・青緑）、暖かくも冷たく感じられない中性色（緑・紫・無彩色）。","notes":"暖色（紅橙黃）具溫熱感，寒色（藍青）具冰涼感，綠、紫與無彩色屬於中性色。","unit":"psy","micro":true,"sourceJa":"暖色・寒色・中性色","typing":true,"sourceCaution":"","aliases":["中性色"],"visual":"none"},{"id":"23-1","sourceId":23,"ja":"進出色","zh":"進出色","en":"Advancing / Receding Colors","definition":"実際より近くに感じられる色。","sourceDefinition":"実際の距離よりも近くに感じられる進出色（高明度暖色）、遠くに感じられる後退色（低明度寒色）。","notes":"感覺比實際距離更近的色稱為進出色（高明度暖色）；感覺更遠的稱為後退色（低明度寒色）。","unit":"psy","micro":true,"sourceJa":"進出色・後退色","typing":true,"sourceCaution":"","aliases":["進出色"],"visual":"none"},{"id":"23-2","sourceId":23,"ja":"後退色","zh":"後退色","en":"Advancing / Receding Colors","definition":"実際より遠くに感じられる色。","sourceDefinition":"実際の距離よりも近くに感じられる進出色（高明度暖色）、遠くに感じられる後退色（低明度寒色）。","notes":"感覺比實際距離更近的色稱為進出色（高明度暖色）；感覺更遠的稱為後退色（低明度寒色）。","unit":"psy","micro":true,"sourceJa":"進出色・後退色","typing":true,"sourceCaution":"","aliases":["後退色"],"visual":"none"},{"id":"24-1","sourceId":24,"ja":"膨張色","zh":"膨脹色","en":"Expanding / Contracting Colors","definition":"実際より大きく見える色。","sourceDefinition":"大きく見える膨張色（高明度色）、小さく見える収縮色（低明度色）。","notes":"感覺面積比實際大的色彩稱為膨脹色（高明度色）；感覺較小的稱為收縮色（低明度色）。","unit":"psy","micro":true,"sourceJa":"膨張色・収縮色","typing":true,"sourceCaution":"","aliases":["膨張色"],"visual":"none"},{"id":"24-2","sourceId":24,"ja":"収縮色","zh":"收縮色","en":"Expanding / Contracting Colors","definition":"実際より小さく見える色。","sourceDefinition":"大きく見える膨張色（高明度色）、小さく見える収縮色（低明度色）。","notes":"感覺面積比實際大的色彩稱為膨脹色（高明度色）；感覺較小的稱為收縮色（低明度色）。","unit":"psy","micro":true,"sourceJa":"膨張色・収縮色","typing":true,"sourceCaution":"","aliases":["収縮色"],"visual":"none"},{"id":"25","sourceId":25,"ja":"同時対比","zh":"同時對比","en":"Simultaneous Contrast","definition":"隣り合う色どうしで起こる空間的な対比。図の色がどのように変化して見えるかによって明度対比・色相対比・彩度対比・補色対比に分けられる。","sourceDefinition":"隣り合う色どうしで起こる空間的な対比。図の色がどのように変化して見えるかによって明度対比・色相対比・彩度対比・補色対比に分けられる。","notes":"相鄰色彩同時存在時相互影響，產生的明度對比、色相對比、彩度對比與補色對比。","unit":"psy","micro":false,"sourceJa":"同時対比","typing":true,"sourceCaution":"","aliases":["同時対比"],"visual":"none"},{"id":"26-1","sourceId":26,"ja":"継時対比","zh":"時間性對比","en":"Successive Contrast / Afterimage","definition":"異なる時間に見た色同士の影響による対比。","sourceDefinition":"有色彩をじっと見つめたあとに残像として見える反対色（心理補色）の現象。時間的な色の対比。","notes":"凝視某色一段時間後移開視線，視覺會浮現該色心理補色的現象（時間性對比）。","unit":"psy","micro":true,"sourceJa":"継時対比 / 補色残像","typing":true,"sourceCaution":"","aliases":["継時対比"],"visual":"none"},{"id":"26-2","sourceId":26,"ja":"補色残像","zh":"補色殘像","en":"Successive Contrast / Afterimage","definition":"ある色を見つめた後に、反対色が残像として見える現象。","sourceDefinition":"有色彩をじっと見つめたあとに残像として見える反対色（心理補色）の現象。時間的な色の対比。","notes":"凝視某色一段時間後移開視線，視覺會浮現該色心理補色的現象（時間性對比）。","unit":"psy","micro":true,"sourceJa":"継時対比 / 補色残像","typing":true,"sourceCaution":"","aliases":["補色残像"],"visual":"none"},{"id":"27","sourceId":27,"ja":"色の同化","zh":"色彩同化（同化效果）","en":"Color Assimilation","definition":"ある色に別の色を少し挿入することで、挿入された色に近づいて見える現象（対比とは逆の効果）。","sourceDefinition":"ある色に別の色を少し挿入することで、挿入された色に近づいて見える現象（対比とは逆の効果）。","notes":"當線條或圖案極為細密時，相鄰色彩不產生對比而是相互滲透接近的現象。","unit":"psy","micro":false,"sourceJa":"色の同化","typing":true,"sourceCaution":"","aliases":["色の同化"],"visual":"none"},{"id":"28","sourceId":28,"ja":"面積効果","zh":"面積效果","en":"Area Effect","definition":"同じ色でも、大きさ（面積）が変わると見え方や印象が変化する現象。一般的に面積が大きくなるほど明るく鮮やかに見える。","sourceDefinition":"同じ色でも、大きさ（面積）が変わると見え方や印象が変化する現象。一般的に面積が大きくなるほど明るく鮮やかに見える。","notes":"相同色彩面積增大時，明度與彩度會感覺更高的現象。室內選牆紙時極為關鍵。","unit":"psy","micro":false,"sourceJa":"面積効果","typing":true,"sourceCaution":"","aliases":["面積効果"],"visual":"none"},{"id":"29","sourceId":29,"ja":"視認性","zh":"視認性 (易發現度)","en":"Legibility / Visibility","definition":"注意を向けて対象を探す時の『発見しやすさ』のこと。背景色と対象の色との明度差が大きいほど高くなる。","sourceDefinition":"注意を向けて対象を探す時の『発見しやすさ』のこと。背景色と対象の色との明度差が大きいほど高くなる。","notes":"有意識尋找目標時的容易發現程度，取決於背景與圖形的「明度差」（如黃底黑字視認性極高）。","unit":"psy","micro":false,"sourceJa":"視認性","typing":true,"sourceCaution":"","aliases":["視認性"],"visual":"none"},{"id":"30","sourceId":30,"ja":"誘目性","zh":"誘目性 (吸引力)","en":"Attractiveness / Noticeability","definition":"注意を向けていない対象の『発見されやすさ』のこと（無意識に目を引く性質）。高彩度の暖色系が高い。","sourceDefinition":"注意を向けていない対象の『発見されやすさ』のこと（無意識に目を引く性質）。高彩度の暖色系が高い。","notes":"無意中吸引目光注意的程度。高彩度的暖色（如鮮紅色）具有最高之誘目性。","unit":"psy","micro":false,"sourceJa":"誘目性","typing":true,"sourceCaution":"","aliases":["誘目性"],"visual":"none"},{"id":"31-1","sourceId":31,"ja":"明視性","zh":"明視性（圖形易解度）","en":"Visual Clarity / Readability","definition":"図形や表示の意味を理解しやすい程度。","sourceDefinition":"発見された対象の『意味の理解のしやすさ』を表す言葉。対象が図形の場合は明視性、文字の場合は可視性という。","notes":"明視性指圖形或指標容易理解的程度；可視性指文字、數字與符號容易被辨認閱讀的程度。","unit":"psy","micro":true,"sourceJa":"明視性 / 可視性","typing":true,"sourceCaution":"","aliases":["明視性"],"visual":"none"},{"id":"31-2","sourceId":31,"ja":"可視性","zh":"可視性（文字易讀度）","en":"Visual Clarity / Readability","definition":"文字や数字を読み取りやすい程度。","sourceDefinition":"発見された対象の『意味の理解のしやすさ』を表す言葉。対象が図形の場合は明視性、文字の場合は可視性という。","notes":"明視性指圖形或指標容易理解的程度；可視性指文字、數字與符號容易被辨認閱讀的程度。","unit":"psy","micro":true,"sourceJa":"明視性 / 可視性","typing":true,"sourceCaution":"","aliases":["可視性"],"visual":"none"},{"id":"32","sourceId":32,"ja":"識別性","zh":"識別性 (易區分度)","en":"Distinctiveness / Identifiability","definition":"対象が複数ある時の『区別のしやすさ』のこと（複雑な地下路線図などで色を使い分ける効果）。","sourceDefinition":"対象が複数ある時の『区別のしやすさ』のこと（複雑な地下路線図などで色を使い分ける効果）。","notes":"多個目標同時出現時，彼此之間相互區別、不易混淆的程度（如捷運路線圖與管線標示）。","unit":"psy","micro":false,"sourceJa":"識別性","typing":true,"sourceCaution":"","aliases":["識別性"],"visual":"none"},{"id":"33","sourceId":33,"ja":"色嗜好","zh":"色彩偏好","en":"Color Preference","definition":"色の好みのこと。個人や集団が特定の色彩に対して抱く主観的な好き嫌いの傾向。","sourceDefinition":"色の好みのこと。個人や集団が特定の色彩に対して抱く主観的な好き嫌いの傾向。","notes":"對於色彩個人或群體的主觀喜好偏向，受年齡、文化、時代及物品用途（如服飾與文具）顯著影響。","unit":"psy","micro":false,"sourceJa":"色嗜好","typing":true,"sourceCaution":"","aliases":["色嗜好"],"visual":"none"},{"id":"34","sourceId":34,"ja":"嗜好色","zh":"偏好色 / 喜愛色","en":"Preferred Color","definition":"好きとされる特定の色のこと。調査において最も好まれる色（日米ともに青が上位）。","sourceDefinition":"好きとされる特定の色のこと。調査において最も好まれる色（日米ともに青が上位）。","notes":"受調查者最喜愛的特定色彩。日本調查顯示「藍色 (Blue)」長期居於偏好色首位。","unit":"psy","micro":false,"sourceJa":"嗜好色","typing":true,"sourceCaution":"","aliases":["嗜好色"],"visual":"none"},{"id":"35","sourceId":35,"ja":"錯視","zh":"視覺錯覺 / 錯視","en":"Optical Illusion","definition":"視対象の物理的特性と、見た目に感じられる心理的特性が際立ってずれる現象（目の錯覚）。","sourceDefinition":"視対象の物理的特性と、見た目に感じられる心理的特性が際立ってずれる現象（目の錯覚）。","notes":"物理實際測量數值與眼睛主觀感知產生的偏差，2級考試考點集中於各式色彩與邊界錯視現象。","unit":"psy","micro":false,"sourceJa":"錯視","typing":true,"sourceCaution":"","aliases":["錯視"],"visual":"none"},{"id":"36","sourceId":36,"ja":"側抑制","zh":"側抑制","en":"Lateral Inhibition","definition":"明るさや色相が違う色どうしが接する境界線を見た時、眼の中の神経節細胞が境界線の存在をより強調するように信号を強めて伝える働き。","sourceDefinition":"明るさや色相が違う色どうしが接する境界線を見た時、眼の中の神経節細胞が境界線の存在をより強調するように信号を強めて伝える働き。","notes":"視網膜神經節細胞強烈刺激相鄰區域發出抑制訊號的生理機制，是形成邊緣對比與赫曼網格等錯視之主因。","unit":"psy","micro":false,"sourceJa":"側抑制","typing":true,"sourceCaution":"","aliases":["側抑制"],"visual":"none"},{"id":"37","sourceId":37,"ja":"ハーマングリッド","zh":"赫曼網格錯視","en":"Hermann Grid","definition":"白い十字路の交差点部分に、ぼんやりとした黒い影が観察される錯視現象（縁辺対比・側抑制に関連）。","sourceDefinition":"白い十字路の交差点部分に、ぼんやりとした黒い影が観察される錯視現象（縁辺対比・側抑制に関連）。","notes":"白十字路口交會處浮現朦朧黑影的錯視現象，由視網膜細胞之「側抑制」作用引起。","unit":"psy","micro":false,"sourceJa":"ハーマングリッド","typing":true,"sourceCaution":"","aliases":["ハーマングリッド"],"visual":"none"},{"id":"38","sourceId":38,"ja":"マッハバンド","zh":"馬赫帶錯視","en":"Mach Bands","definition":"明るさがスムーズに変化している面との境界線において、明るい帯や暗い帯が見える錯視現象（側抑制による）。","sourceDefinition":"明るさがスムーズに変化している面との境界線において、明るい帯や暗い帯が見える錯視現象（側抑制による）。","notes":"在明暗漸變邊界處，交界靠近亮側顯得更亮、靠近暗側顯得更暗的帶狀錯視，由側抑制造成。","unit":"psy","micro":false,"sourceJa":"マッハバンド","typing":true,"sourceCaution":"","aliases":["マッハバンド"],"visual":"none"},{"id":"39","sourceId":39,"ja":"リープマン効果","zh":"利普曼效應","en":"Liebmann Effect","definition":"異なる有彩色が隣接し、その明度差がほとんどない時、色と色の境界線があいまいになり、ちらついて見えたり図と地の関係が不安定になる現象。","sourceDefinition":"異なる有彩色が隣接し、その明度差がほとんどない時、色と色の境界線があいまいになり、ちらついて見えたり図と地の関係が不安定になる現象。","notes":"不同色相若明度極度接近（明度差趨近0），輪廓邊界會變得模糊閃爍、極難辨識的現象。","unit":"psy","micro":false,"sourceJa":"リープマン効果","typing":true,"sourceCaution":"","aliases":["リープマン効果"],"visual":"none"},{"id":"40","sourceId":40,"ja":"エーレンシュタイン効果","zh":"埃倫斯坦錯視","en":"Ehrenstein Effect","definition":"格子状の十字路の部分が抜けている時、白背景では抜けた部分が明るく見え、黒背景では抜けた部分が暗く見える現象。","sourceDefinition":"格子状の十字路の部分が抜けている時、白背景では抜けた部分が明るく見え、黒背景では抜けた部分が暗く見える現象。","notes":"黑色十字線中央中空處，看起來比白背景更白、更鮮明的錯視現象。","unit":"psy","micro":false,"sourceJa":"エーレンシュタイン効果","typing":true,"sourceCaution":"","aliases":["エーレンシュタイン効果"],"visual":"none"},{"id":"41","sourceId":41,"ja":"ネオンカラー効果","zh":"霓虹色彩擴散效應","en":"Neon Color Spreading","definition":"エーレンシュタイン図形の抜けている部分を色線でつなぐと、その部分の色がにじみ出てネオンのように広がって見える現象。","sourceDefinition":"エーレンシュタイン図形の抜けている部分を色線でつなぐと、その部分の色がにじみ出てネオンのように広がって見える現象。","notes":"在埃倫斯坦線條交會處改用有彩色時，該色彩會如霓虹燈般擴散至周圍白地的錯視。","unit":"psy","micro":false,"sourceJa":"ネオンカラー効果","typing":true,"sourceCaution":"","aliases":["ネオンカラー効果"],"visual":"none"},{"id":"42","sourceId":42,"ja":"透明視","zh":"透明視錯覺","en":"Visual Transparency","definition":"重なり合った図形の一部が透明に感じられる錯視現象。視覚がより単純で規則的な見え方を好むことによって生じる。","sourceDefinition":"重なり合った図形の一部が透明に感じられる錯視現象。視覚がより単純で規則的な見え方を好むことによって生じる。","notes":"兩色重疊交界處若設定特定混色，大腦視覺會自動解釋為透光彩色玻璃重疊的視覺感知。","unit":"psy","micro":false,"sourceJa":"透明視","typing":true,"sourceCaution":"","aliases":["透明視"],"visual":"none"},{"id":"43","sourceId":43,"ja":"マカラー効果","zh":"麥考夫效應","en":"McCollough Effect","definition":"特定の色の縞模様を順応して見続けた後、黒白の縞模様を見た時に補色が現れる長時效な心理的効果。","sourceDefinition":"特定の色の縞模様を順応して見続けた後、黒白の縞模様を見た時に補色が現れる長時效な心理的効果。","notes":"長時間適應紅黑豎條與綠黑橫條後，看黑白條紋時，豎條浮現綠色補色、橫條浮現紅色補色之長時效對比錯視。","unit":"psy","micro":false,"sourceJa":"マカラー効果","typing":true,"sourceCaution":"","aliases":["マカラー効果"],"visual":"none"},{"id":"44","sourceId":44,"ja":"光源・物体・視覚","zh":"色彩感知三要素","en":"Light Source, Object, Vision","definition":"色を見るために必要な３つの要素：光を発する源である『光源』、光を受ける『物体』、光を感じる『視覚（眼・脳）』。","sourceDefinition":"色を見るために必要な３つの要素：光を発する源である『光源』、光を受ける『物体』、光を感じる『視覚（眼・脳）』。","notes":"人類產生色彩視覺必備的三大要素：提供光的「光源」、反射/透過光的「物體」、接收訊號的「視覺眼球」。","unit":"light","micro":false,"sourceJa":"光源・物体・視覚","typing":false,"sourceCaution":"","aliases":["光源・物体・視覚"],"visual":"none"},{"id":"45-1","sourceId":45,"ja":"可視光","zh":"可視光","en":"Visible Light / Wavelength","definition":"人の眼が感じることのできる電磁波の範囲。","sourceDefinition":"電磁波の中で人の眼が色として感じることのできる波長範囲（およそ380〜780nm）。波長は波の山から山までの長さ。","notes":"人眼能感知的電磁波範圍（約 380nm～780nm）。長波長為紅光，短波長為紫光。","unit":"light","micro":true,"sourceJa":"可視光 / 波長","typing":true,"sourceCaution":"","aliases":["可視光"],"visual":"none"},{"id":"45-2","sourceId":45,"ja":"波長","zh":"波長","en":"Visible Light / Wavelength","definition":"波の山から次の山までの長さ。","sourceDefinition":"電磁波の中で人の眼が色として感じることのできる波長範囲（およそ380〜780nm）。波長は波の山から山までの長さ。","notes":"人眼能感知的電磁波範圍（約 380nm～780nm）。長波長為紅光，短波長為紫光。","unit":"light","micro":true,"sourceJa":"可視光 / 波長","typing":true,"sourceCaution":"","aliases":["波長"],"visual":"none"},{"id":"46","sourceId":46,"ja":"分光分布","zh":"分光能量分佈","en":"Spectral Distribution","definition":"光源から発する光の成分（各波長ごとの光の強さ）をグラフで表したもの。","sourceDefinition":"光源から発する光の成分（各波長ごとの光の強さ）をグラフで表したもの。","notes":"表示光源在各波長下發射能量強度的曲線圖。日光分光分佈較為平緩，鎢絲燈偏重長波長。","unit":"light","micro":false,"sourceJa":"分光分布","typing":true,"sourceCaution":"","aliases":["分光分布"],"visual":"none"},{"id":"47","sourceId":47,"ja":"分光反射率曲線","zh":"分光反射率曲線","en":"Spectral Reflectance Curve","definition":"物体の表面に当たった光が、波長ごとにどのように反射するかという特性を表したグラフ。","sourceDefinition":"物体の表面に当たった光が、波長ごとにどのように反射するかという特性を表したグラフ。","notes":"表示物體表面對可見光各波長反射百分比的圖表。2級考試極高頻考點，需能依圖判讀物體顏色。","unit":"light","micro":false,"sourceJa":"分光反射率曲線","typing":true,"sourceCaution":"","aliases":["分光反射率曲線"],"visual":"none"},{"id":"48-1","sourceId":48,"ja":"拡散反射","zh":"漫反射（擴散反射）","en":"Diffuse / Specular Reflection","definition":"光がさまざまな方向に反射すること。","sourceDefinition":"あらゆる方向にまんべんなく反射する完全拡散反射（マットな紙）と、入射角と反射角が等しい正反射（光沢面・鏡面反射）。","notes":"消光材質表面呈漫反射；高光澤材質（如塗料漆面）包含正反射，影響物體色之視覺彩度感。","unit":"light","micro":true,"sourceJa":"拡散反射 / 正反射","typing":true,"sourceCaution":"","aliases":["拡散反射"],"visual":"none"},{"id":"48-2","sourceId":48,"ja":"正反射","zh":"鏡面反射（正反射）","en":"Diffuse / Specular Reflection","definition":"入射角と反射角が等しい反射。","sourceDefinition":"あらゆる方向にまんべんなく反射する完全拡散反射（マットな紙）と、入射角と反射角が等しい正反射（光沢面・鏡面反射）。","notes":"消光材質表面呈漫反射；高光澤材質（如塗料漆面）包含正反射，影響物體色之視覺彩度感。","unit":"light","micro":true,"sourceJa":"拡散反射 / 正反射","typing":true,"sourceCaution":"","aliases":["正反射"],"visual":"none"},{"id":"49","sourceId":49,"ja":"照度 (lx)","zh":"照度 (勒克斯 lx)","en":"Illuminance","definition":"光源に照らされた面（場所）の明るさを表す言葉。単位はlx（ルクス）。距離が離れるほど照度は減少する。","sourceDefinition":"光源に照らされた面（場所）の明るさを表す言葉。単位はlx（ルクス）。距離が離れるほど照度は減少する。","notes":"受照平面之明亮程度，單位為 lx。與距離的平方成反比。JIS 規範了不同作業場合之推薦照度。","unit":"light","micro":false,"sourceJa":"照度 (lx)","typing":true,"sourceCaution":"","aliases":["照度 (lx)","照度"],"visual":"none"},{"id":"50","sourceId":50,"ja":"色温度 (K)","zh":"色溫度 / 色溫 (K)","en":"Color Temperature","definition":"光の色（光色）を表す温度の概念。単位はK（ケルビン）。低色温は赤みがかった光、高色温は青みがかった光。","sourceDefinition":"光の色（光色）を表す温度の概念。単位はK（ケルビン）。低色温は赤みがかった光、高色温は青みがかった光。","notes":"利用黑體輻射標示光源光色的絕對溫度（K）。低色溫（~3000K）偏暖黃，高色溫（~6500K）偏青藍。","unit":"light","micro":false,"sourceJa":"色温度 (K)","typing":true,"sourceCaution":"","aliases":["色温度 (K)","色温度"],"visual":"none"},{"id":"51-1","sourceId":51,"ja":"演色性","zh":"演色性","en":"Color Rendering / General CRI Ra","definition":"照明光が物体の色の見え方に与える特性。","sourceDefinition":"光で照明された物体の見え方に影響を与える照明光の特性を演色性という。平均演色評価数Ra（最高100）で評価する。","notes":"光源還原物體真實色彩的能力。基準光為 Ra=100，Ra≥80 為優良，2級考試計算與定義必考。","unit":"light","micro":true,"sourceJa":"演色性 / 平均演色評価数 Ra","typing":true,"sourceCaution":"","aliases":["演色性"],"visual":"none"},{"id":"51-2","sourceId":51,"ja":"平均演色評価数 Ra","zh":"平均演色評價數 Ra","en":"Color Rendering / General CRI Ra","definition":"光源の演色性を評価する数値。","sourceDefinition":"光で照明された物体の見え方に影響を与える照明光の特性を演色性という。平均演色評価数Ra（最高100）で評価する。","notes":"光源還原物體真實色彩的能力。基準光為 Ra=100，Ra≥80 為優良，2級考試計算與定義必考。","unit":"light","micro":true,"sourceJa":"演色性 / 平均演色評価数 Ra","typing":true,"sourceCaution":"","aliases":["平均演色評価数 Ra"],"visual":"none"},{"id":"52","sourceId":52,"ja":"盲点","zh":"盲點 / 視神經乳頭","en":"Blind Spot / Optic Disc","definition":"視神経乳頭と呼ばれる部位で、網膜から視神経が出ているところ。像が結ばれても見えない部分。","sourceDefinition":"視神経乳頭と呼ばれる部位で、網膜から視神経が出ているところ。像が結ばれても見えない部分。","notes":"視網膜上視神經匯聚穿出的部位（視神經乳頭），該處完全沒有感光細胞，無法感知影像。","unit":"vision","micro":false,"sourceJa":"盲点","typing":true,"sourceCaution":"","aliases":["盲点"],"visual":"none"},{"id":"53","sourceId":53,"ja":"フィル・イン","zh":"視覺補全效應 (Fill-in)","en":"Visual Completion / Fill-in","definition":"盲点部分の画像情報が欠落した部分を、周囲の情報で埋めるように大脳が補う視覚補全機能。","sourceDefinition":"盲点部分の画像情報が欠落した部分を、周囲の情報で埋めるように大脳が補う視覚補全機能。","notes":"大腦自動利用盲點周圍的視覺資訊塗補填充盲點區域缺口，使我們日常感覺不到盲點存在的機制。","unit":"vision","micro":false,"sourceJa":"フィル・イン","typing":false,"sourceCaution":"","aliases":["フィル・イン"],"visual":"none"},{"id":"54","sourceId":54,"ja":"色視野","zh":"色視野","en":"Visual Field for Colors","definition":"視線を固定した時に見える範囲（視野）の中で、色が識別できる範囲のこと（藍・黄視野が広く、紅・綠視野が狹い）。","sourceDefinition":"視線を固定した時に見える範囲（視野）の中で、色が識別できる範囲のこと（藍・黄視野が広く、紅・綠視野が狹い）。","notes":"固定視線時眼睛能辨識色彩的範圍。藍/黃視野較廣，紅/綠視野較狹窄，中心視野辨色力最強。","unit":"vision","micro":false,"sourceJa":"色視野","typing":true,"sourceCaution":"","aliases":["色視野"],"visual":"none"},{"id":"55","sourceId":55,"ja":"標準分光視感効率","zh":"標準分光視感效率 (比視感度)","en":"Standard Spectral Luminous Efficiency","definition":"人の眼が光の波長に対して感じる明るさの感度（分光視感効率・比視感度）を国際的に標準化したもの。明視視のピークは555nm。","sourceDefinition":"人の眼が光の波長に対して感じる明るさの感度（分光視感効率・比視感度）を国際的に標準化したもの。明視視のピークは555nm。","notes":"國際照明委員會 (CIE) 標準化的明視覺光譜靈敏度曲線，以 555nm（綠黃光）為最大值 1.0。","unit":"vision","micro":false,"sourceJa":"標準分光視感効率","typing":true,"sourceCaution":"","aliases":["標準分光視感効率"],"visual":"none"},{"id":"56","sourceId":56,"ja":"視物質","zh":"視物質 / 感光色素","en":"Visual Pigment","definition":"視細胞の中にあり、光を吸収して神経信号を発生させる物質。桿体にはロドプシン（視紫紅）、錐体にはフォトプシンが存在。","sourceDefinition":"視細胞の中にあり、光を吸収して神経信号を発生させる物質。桿体にはロドプシン（視紫紅）、錐体にはフォトプシンが存在。","notes":"感光細胞內吸收光線的化學物質。桿體含視紫質（Rhodopsin）；錐體含赤/綠/青視視蛋白（Opsins）。","unit":"vision","micro":false,"sourceJa":"視物質","typing":true,"sourceCaution":"","aliases":["視物質"],"visual":"none"},{"id":"57-1","sourceId":57,"ja":"明順応","zh":"明順應","en":"Light Adaptation / Dark Adaptation","definition":"暗い所から明るい所に出て、眼が慣れること。","sourceDefinition":"暗い場所から明るい場所に出て眼が慣れることを明順応（数分）、明るい場所から暗い場所に行って眼が慣れることを暗順応（約30分）。","notes":"由暗處進入亮處眼睛適應稱為明順應（只需數秒至數分）；由亮處進入暗處適應稱為暗順應（需約 30 分鐘完整重建視紫質）。","unit":"vision","micro":true,"sourceJa":"明順応・暗順応","typing":true,"sourceCaution":"","aliases":["明順応"],"visual":"none"},{"id":"57-2","sourceId":57,"ja":"暗順応","zh":"暗順應","en":"Light Adaptation / Dark Adaptation","definition":"明るい所から暗い所に入って、眼が慣れること。","sourceDefinition":"暗い場所から明るい場所に出て眼が慣れることを明順応（数分）、明るい場所から暗い場所に行って眼が慣れることを暗順応（約30分）。","notes":"由暗處進入亮處眼睛適應稱為明順應（只需數秒至數分）；由亮處進入暗處適應稱為暗順應（需約 30 分鐘完整重建視紫質）。","unit":"vision","micro":true,"sourceJa":"明順応・暗順応","typing":true,"sourceCaution":"","aliases":["暗順応"],"visual":"none"},{"id":"58-1","sourceId":58,"ja":"錐体","zh":"錐狀細胞","en":"Cones and Rods","definition":"明るい所で働き、色を感じる網膜の視細胞。","sourceDefinition":"網膜上の視細胞：明るいところで働き色を感じる『錐体』（S・M・Lの3種）と、暗いところで働き明暗を感じる『桿体』。","notes":"視網膜感光細胞：錐體負責明視覺與彩色（L/M/S錐體）；桿體負責暗視覺與明暗感知，無色彩感。","unit":"vision","micro":true,"sourceJa":"錐体・桿体","typing":true,"sourceCaution":"","aliases":["錐体"],"visual":"none"},{"id":"58-2","sourceId":58,"ja":"桿体","zh":"桿狀細胞","en":"Cones and Rods","definition":"暗い所で働き、明暗を感じる網膜の視細胞。","sourceDefinition":"網膜上の視細胞：明るいところで働き色を感じる『錐体』（S・M・Lの3種）と、暗いところで働き明暗を感じる『桿体』。","notes":"視網膜感光細胞：錐體負責明視覺與彩色（L/M/S錐體）；桿體負責暗視覺與明暗感知，無色彩感。","unit":"vision","micro":true,"sourceJa":"錐体・桿体","typing":true,"sourceCaution":"","aliases":["桿体"],"visual":"none"},{"id":"59-1","sourceId":59,"ja":"明所視","zh":"明視覺（明所視）","en":"Photopic / Scotopic / Mesopic Vision","definition":"明るい所で錐体が主に働く視覚。","sourceDefinition":"明るい場所で錐体だけで見ている状態を明視視（錐体視）、暗い場所で桿体だけで見ている状態を暗視視（桿体視）、夕方など両方が働く一時的な状態を薄明視という。","notes":"明視覺由錐體主導；暗視覺由桿體主導；薄明視（黃昏時）錐體與桿體同時工作，靈敏峰值由 555nm 移至 507nm。","unit":"vision","micro":true,"sourceJa":"明視視・暗視視・薄明視","typing":true,"sourceCaution":"Excel 第59筆將「明所視／暗所視」寫成「明視視／暗視視」；學習卡已採用可查證的標準用語。參考：JIS Z 8105 色彩用語、岩崎電気照明用語。","aliases":["明所視"],"visual":"none"},{"id":"59-2","sourceId":59,"ja":"暗所視","zh":"暗視覺（暗所視）","en":"Photopic / Scotopic / Mesopic Vision","definition":"暗い所で桿体が主に働く視覚。","sourceDefinition":"明るい場所で錐体だけで見ている状態を明視視（錐体視）、暗い場所で桿体だけで見ている状態を暗視視（桿体視）、夕方など両方が働く一時的な状態を薄明視という。","notes":"明視覺由錐體主導；暗視覺由桿體主導；薄明視（黃昏時）錐體與桿體同時工作，靈敏峰值由 555nm 移至 507nm。","unit":"vision","micro":true,"sourceJa":"明視視・暗視視・薄明視","typing":true,"sourceCaution":"Excel 第59筆將「明所視／暗所視」寫成「明視視／暗視視」；學習卡已採用可查證的標準用語。參考：JIS Z 8105 色彩用語、岩崎電気照明用語。","aliases":["暗所視"],"visual":"none"},{"id":"59-3","sourceId":59,"ja":"薄明視","zh":"中明視覺（薄明視）","en":"Photopic / Scotopic / Mesopic Vision","definition":"明所視と暗所視の間で錐体と桿体の両方が働く視覚。","sourceDefinition":"明るい場所で錐体だけで見ている状態を明視視（錐体視）、暗い場所で桿体だけで見ている状態を暗視視（桿体視）、夕方など両方が働く一時的な状態を薄明視という。","notes":"明視覺由錐體主導；暗視覺由桿體主導；薄明視（黃昏時）錐體與桿體同時工作，靈敏峰值由 555nm 移至 507nm。","unit":"vision","micro":true,"sourceJa":"明視視・暗視視・薄明視","typing":true,"sourceCaution":"Excel 第59筆將「明所視／暗所視」寫成「明視視／暗視視」；學習卡已採用可查證的標準用語。參考：JIS Z 8105 色彩用語、岩崎電気照明用語。","aliases":["薄明視"],"visual":"none"},{"id":"60","sourceId":60,"ja":"プルキンエ現象","zh":"普金捷現象","en":"Purkinje Effect","definition":"薄明視において、分光視感効率のピークが555nmから507nmへ移行し、長波長の赤・橙・黄が暗く見え、短波長の青・青緑が明るく見える現象。","sourceDefinition":"薄明視において、分光視感効率のピークが555nmから507nmへ移行し、長波長の赤・橙・黄が暗く見え、短波長の青・青緑が明るく見える現象。","notes":"照明變暗（轉為薄明視）時，光譜靈敏度向短波長轉移，使紅色相對變暗、藍青色相對變亮之現象。","unit":"vision","micro":false,"sourceJa":"プルキンエ現象","typing":true,"sourceCaution":"","aliases":["プルキンエ現象"],"visual":"none"},{"id":"61-1","sourceId":61,"ja":"色順応","zh":"色彩順應","en":"Chromatic Adaptation / Color Constancy","definition":"照明光の変化に合わせて眼の感度が調整されること。","sourceDefinition":"照明光の変化に眼の感度が自動調整される『色順応』と、照明環境が変化しても対象物を同じ色として認識できる『色の恒常性』。","notes":"眼睛依環境光源自動調整感度的能力稱為色彩順應；使我們在不同照明下仍能將白紙認知為白色的現象。","unit":"vision","micro":true,"sourceJa":"色順応 / 色の恒常性","typing":true,"sourceCaution":"","aliases":["色順応"],"visual":"none"},{"id":"61-2","sourceId":61,"ja":"色の恒常性","zh":"色彩恆常性","en":"Chromatic Adaptation / Color Constancy","definition":"照明が変わっても物体の色を比較的一定に感じること。","sourceDefinition":"照明光の変化に眼の感度が自動調整される『色順応』と、照明環境が変化しても対象物を同じ色として認識できる『色の恒常性』。","notes":"眼睛依環境光源自動調整感度的能力稱為色彩順應；使我們在不同照明下仍能將白紙認知為白色的現象。","unit":"vision","micro":true,"sourceJa":"色順応 / 色の恒常性","typing":true,"sourceCaution":"","aliases":["色の恒常性"],"visual":"none"},{"id":"62","sourceId":62,"ja":"色覚特性 (1型・2型・3型)","zh":"色覺特性 (1型/2型/3型)","en":"Color Vision Characteristics","definition":"色の識別に関する個性のこと。L錐体・M錐体・S錐体の機能状態により1型、2型、3型などに分類される。","sourceDefinition":"色の識別に関する個性のこと。L錐体・M錐体・S錐体の機能状態により1型、2型、3型などに分類される。","notes":"取代傳統「色覺異常」用語。1型（L錐體機能低下/缺失）、2型（M錐體機能低下/缺失）佔男性絕大多數。","unit":"vision","micro":false,"sourceJa":"色覚特性 (1型・2型・3型)","typing":false,"sourceCaution":"","aliases":["色覚特性 (1型・2型・3型)"],"visual":"none"},{"id":"63","sourceId":63,"ja":"加齢による色覚変化","zh":"高齡化色覺變化","en":"Age-related Vision Changes","definition":"加齢に伴う水晶体の黄変（青光の吸収増加）、視細胞の感度低下、白内障などによる色の見え方の変化。","sourceDefinition":"加齢に伴う水晶体の黄変（青光の吸収増加）、視細胞の感度低下、白内障などによる色の見え方の変化。","notes":"水晶體黃變（短波長藍光吸收率增加、難辨藍黑）、視網膜照度降低與白內障造成的辨色力改變。","unit":"vision","micro":false,"sourceJa":"加齢による色覚変化","typing":true,"sourceCaution":"","aliases":["加齢による色覚変化"],"visual":"none"},{"id":"64","sourceId":64,"ja":"色彩ユニバーサルデザイン (UC)","zh":"色彩通用設計 (UC / CUD)","en":"Color Universal Design (CUD / UC)","definition":"色覚の多様性を考慮して、すべてのユーザーに正確に情報が伝わるように配慮された色彩設計（拉大明度差、使用分隔線）。","sourceDefinition":"色覚の多様性を考慮して、すべてのユーザーに正確に情報が伝わるように配慮された色彩設計（拉大明度差、使用分隔線）。","notes":"考量多樣色覺特性與高齡者的設計。核心解題法：拉大明度差、使用白/黑分隔線（Separation）與符號輔助。","unit":"vision","micro":false,"sourceJa":"色彩ユニバーサルデザイン (UC)","typing":true,"sourceCaution":"","aliases":["色彩ユニバーサルデザイン (UC)","色彩ユニバーサルデザイン"],"visual":"none"},{"id":"65","sourceId":65,"ja":"水晶体の黄変","zh":"水晶體黃變","en":"Yellowing of Lens","definition":"加齢とともに水晶体が黄色く濁り、短波長の青い光を多く吸収するため青と黒の区別が難しくなる現象。","sourceDefinition":"加齢とともに水晶体が黄色く濁り、短波長の青い光を多く吸収するため青と黒の区別が難しくなる現象。","notes":"隨年齡增長水晶體漸趨黃褐色，強烈吸收短波長藍光，導致高齡者極難區分深藍色與黑色。","unit":"vision","micro":false,"sourceJa":"水晶体の黄変","typing":true,"sourceCaution":"","aliases":["水晶体の黄変"],"visual":"none"},{"id":"66","sourceId":66,"ja":"白内障","zh":"白內障","en":"Cataract","definition":"水晶体が白く濁る病気。光が散乱して眩しさを強く感じたり、視力・対比感が低下する。","sourceDefinition":"水晶体が白く濁る病気。光が散乱して眩しさを強く感じたり、視力・対比感が低下する。","notes":"水晶體混濁導致光線散射，出現視力模糊、畏光刺眼及色彩對比度大幅下降的生理現象。","unit":"vision","micro":false,"sourceJa":"白内障","typing":true,"sourceCaution":"","aliases":["白内障"],"visual":"none"},{"id":"67","sourceId":67,"ja":"視野欠損","zh":"視野缺損","en":"Visual Field Defect / Deficit","definition":"眼の病気（緑内障など）によって視野の中に部分的に見えないところがが生じる現象。","sourceDefinition":"眼の病気（緑内障など）によって視野の中に部分的に見えないところがが生じる現象。","notes":"因眼疾（如青光眼）導致部分視野出現無法看見區域，色彩通用設計須考量指標之擺放位置與大小。","unit":"vision","micro":false,"sourceJa":"視野欠損","typing":true,"sourceCaution":"","aliases":["視野欠損"],"visual":"none"},{"id":"68","sourceId":68,"ja":"三色説（三原色説）","zh":"三色說 / 三原色說 (Young-Helmholtz)","en":"Trichromatic Theory","definition":"ヤングとヘルムホルツによる仮説。眼の中にR・G・Bの3種類の光に反応する視細胞（錐体）があり、その組み合わせで色を認知するという説。","sourceDefinition":"ヤングとヘルムホルツによる仮説。眼の中にR・G・Bの3種類の光に反応する視細胞（錐体）があり、その組み合わせで色を認知するという説。","notes":"Young 與 Helmholtz 提出視網膜存在感知紅、綠、藍三種微粒（即 L/M/S 錐體）的色覺理論，解釋色光混色與色覺感知。","unit":"vision","micro":false,"sourceJa":"三色説（三原色説）","typing":true,"sourceCaution":"","aliases":["三色説（三原色説）"],"visual":"none"},{"id":"69","sourceId":69,"ja":"反対色説（四原色説）","zh":"反對色說 / 四原色說 (Hering)","en":"Opponent-Process Theory","definition":"ヘリングによる仮説。眼の中に「赤ー緑」「黄ー青」「白ー黒」の対照的な反応を示す対立的機構が存在するという説。","sourceDefinition":"ヘリングによる仮説。眼の中に「赤ー緑」「黄ー青」「白ー黒」の対照的な反応を示す対立的機構が存在するという説。","notes":"Hering 提出視網膜存在「紅-綠」、「黃-藍」、「白-黑」三組對立生理機制的理論，能完美解釋補色殘像與同時對比。","unit":"vision","micro":false,"sourceJa":"反対色説（四原色説）","typing":true,"sourceCaution":"","aliases":["反対色説（四原色説）"],"visual":"none"},{"id":"70","sourceId":70,"ja":"段階説","zh":"階段說 (Zone Theory)","en":"Zone Theory / Stage Theory","definition":"網膜の視細胞段階では三色説（S・M・L錐体）で受容され、それ以降の神経段階で反対色説に対応する処理が行われるという受容整合理論。","sourceDefinition":"網膜の視細胞段階では三色説（S・M・L錐体）で受容され、それ以降の神経段階で反対色説に対応する処理が行われるという受容整合理論。","notes":"現代色覺整合理論：視網膜「錐體細胞層」符合三色說，而經由雙極細胞轉譯傳輸至「神經節細胞層」後符合反對色說。","unit":"vision","micro":false,"sourceJa":"段階説","typing":true,"sourceCaution":"","aliases":["段階説"],"visual":"none"},{"id":"71","sourceId":71,"ja":"ジャッドの四つの原理","zh":"賈德色彩調和四原理","en":"Judd's Four Principles","definition":"アメリカの色彩学者ジャッドがさまざまな色彩調和論を研究・分析してまとめた４つの原理（秩序、なじみ、類似性、明瞭性）。","sourceDefinition":"アメリカの色彩学者ジャッドがさまざまな色彩調和論を研究・分析してまとめた４つの原理（秩序、なじみ、類似性、明瞭性）。","notes":"Deane B. Judd 提出的四大調和原理：秩序原理、熟悉原理（馴染み）、類似原理、明瞭性原理。","unit":"harmony","micro":false,"sourceJa":"ジャッドの四つの原理","typing":true,"sourceCaution":"","aliases":["ジャッドの四つの原理"],"visual":"none"},{"id":"72","sourceId":72,"ja":"秩序の原理","zh":"秩序原理","en":"Principle of Order","definition":"色相環上の規則的な配置（等間隔など）から法則に従って選ばれた色は調和するという原理。","sourceDefinition":"色相環上の規則的な配置（等間隔など）から法則に従って選ばれた色は調和するという原理。","notes":"Judd 四原理之一：按等間隔、規則性選取的色彩組合（如色相環等分配色），能給人系統化調和感。","unit":"harmony","micro":false,"sourceJa":"秩序の原理","typing":true,"sourceCaution":"","aliases":["秩序の原理"],"visual":"none"},{"id":"73","sourceId":73,"ja":"なじみの原理（熟知の原理）","zh":"熟悉原理 / 習慣原理","en":"Principle of Familiarity","definition":"日常で見慣れた自然の色彩（自然連鎖など）に沿った配色は調和するという原理。","sourceDefinition":"日常で見慣れた自然の色彩（自然連鎖など）に沿った配色は調和するという原理。","notes":"Judd 四原理之一：符合自然界常態經驗（如日光下自然連鎖 Natural Sequence）的色彩組合令人感到舒適自然。","unit":"harmony","micro":false,"sourceJa":"なじみの原理（熟知の原理）","typing":true,"sourceCaution":"","aliases":["なじみの原理（熟知の原理）","なじみの原理"],"visual":"none"},{"id":"74","sourceId":74,"ja":"類似性の原理","zh":"類似原理","en":"Principle of Similarity","definition":"同系色相・同系トーンなど、共通性をもつ色どうしは調和するという原理。","sourceDefinition":"同系色相・同系トーンなど、共通性をもつ色どうしは調和するという原理。","notes":"Judd 四原理之一：色彩屬性（色相或音調 Tone）具有共同性或接近的組合（如 Dominant 配色）易產生調和。","unit":"harmony","micro":false,"sourceJa":"類似性の原理","typing":true,"sourceCaution":"","aliases":["類似性の原理"],"visual":"none"},{"id":"75","sourceId":75,"ja":"明瞭性の原理","zh":"明瞭性原理","en":"Principle of Clarity","definition":"明快なコントラストをもつ色の組み合わせは明確に調和するという原理。","sourceDefinition":"明快なコントラストをもつ色の組み合わせは明確に調和するという原理。","notes":"Judd 四原理之一：色彩間對比關係明確、差異清晰不模糊的組合（如 Tricolore 配色）易產生明確調和感。","unit":"harmony","micro":false,"sourceJa":"明瞭性の原理","typing":true,"sourceCaution":"","aliases":["明瞭性の原理"],"visual":"none"},{"id":"76","sourceId":76,"ja":"色相の自然連鎖","zh":"自然連鎖 (Natural Sequence)","en":"Natural Sequence of Hues","definition":"自然光の下での色の見え方（黄に近い色は明るく見え、青紫に近い色は暗く見える）という自然界の色彩法則（Natural Sequence of Hues）。","sourceDefinition":"自然光の下での色の見え方（黄に近い色は明るく見え、青紫に近い色は暗く見える）という自然界の色彩法則（Natural Sequence of Hues）。","notes":"自然光下黃色系（8:Y）最亮、青紫色系（20:V）最暗的法則。由此衍生 Natural Harmony 與 Complex Harmony。","unit":"harmony","micro":false,"sourceJa":"色相の自然連鎖","typing":true,"sourceCaution":"","aliases":["色相の自然連鎖"],"visual":"none"},{"id":"77","sourceId":77,"ja":"色相差配色分類","zh":"色相差配色六大分類","en":"Hue Difference Classifications","definition":"PCCS色相環における色相番号の差に基づく分類：同一(0)、隣接(1)、類似(2~3)、中差(4~7)、対照(8~10)、補色(11~12)。","sourceDefinition":"PCCS色相環における色相番号の差に基づく分類：同一(0)、隣接(1)、類似(2~3)、中差(4~7)、対照(8~10)、補色(11~12)。","notes":"PCCS 24色相環配色：同一(色相差0)、鄰接(1)、類似(2~3)、中差(4~7)、對照(8~10)、補色(11~12)，2級必考算公式與判讀。","unit":"harmony","micro":false,"sourceJa":"色相差配色分類","typing":true,"sourceCaution":"","aliases":["色相差配色分類"],"visual":"none"},{"id":"78","sourceId":78,"ja":"ナチュラルハーモニー","zh":"自然色彩調和","en":"Natural Harmony","definition":"色相の自然連鎖に沿った配色。黄に近い色相を明るく、青紫に近い色相を暗く設定する調和手法。","sourceDefinition":"色相の自然連鎖に沿った配色。黄に近い色相を明るく、青紫に近い色相を暗く設定する調和手法。","notes":"順應自然連鎖的配色：靠近黃色的色相明度調高，靠近青紫色的色相明度調低，符合視覺經驗。","unit":"harmony","micro":false,"sourceJa":"ナチュラルハーモニー","typing":true,"sourceCaution":"","aliases":["ナチュラルハーモニー"],"visual":"harmony"},{"id":"79","sourceId":79,"ja":"コンプレックスハーモニー","zh":"複合調和 (逆自然配色)","en":"Complex Harmony","definition":"色相の自然連鎖に逆らった配色。黄に近い色相を暗く、青紫に近い色相を明るくする新鮮で個性的な調和手法。","sourceDefinition":"色相の自然連鎖に逆らった配色。黄に近い色相を暗く、青紫に近い色相を明るくする新鮮で個性的な調和手法。","notes":"故意顛倒自然連鎖的配色（如黃色調暗、青紫調亮），產生令人印象深刻的現代新鮮感。","unit":"harmony","micro":false,"sourceJa":"コンプレックスハーモニー","typing":true,"sourceCaution":"","aliases":["コンプレックスハーモニー"],"visual":"harmony"},{"id":"80","sourceId":80,"ja":"ドミナントカラー配色","zh":"主導色配色 (Dominant Color)","en":"Dominant Color Scheme","definition":"全体を１つの支配的な色相（同一または類似色相）でまとめる配色技法。トーンは自由に選択可能。","sourceDefinition":"全体を１つの支配的な色相（同一または類似色相）でまとめる配色技法。トーンは自由に選択可能。","notes":"統一全體色相（同一或類似色相），音調可自由變化，使色彩主題性極為明確。","unit":"harmony","micro":false,"sourceJa":"ドミナントカラー配色","typing":true,"sourceCaution":"","aliases":["ドミナントカラー配色"],"visual":"harmony"},{"id":"81","sourceId":81,"ja":"ドミナントトーン配色","zh":"主導音調配色 (Dominant Tone)","en":"Dominant Tone Scheme","definition":"全体を１つの支配的なトーン（同一トーン）でまとめる配色技法。色相は自由に選択可能。","sourceDefinition":"全体を１つの支配的なトーン（同一トーン）でまとめる配色技法。色相は自由に選択可能。","notes":"統一全體音調（同一音調），色相可自由變化，營造出強烈且一致的情境氛圍。","unit":"harmony","micro":false,"sourceJa":"ドミナントトーン配色","typing":true,"sourceCaution":"","aliases":["ドミナントトーン配色"],"visual":"harmony"},{"id":"82","sourceId":82,"ja":"トーンオントーン配色","zh":"同色相明暗配色 (Tone on Tone)","en":"Tone on Tone Scheme","definition":"同一色相（または類似色相）で、明度差・トーン差をはっきりつけた濃淡配色。","sourceDefinition":"同一色相（または類似色相）で、明度差・トーン差をはっきりつけた濃淡配色。","notes":"限定同一色相（或極近似色相），主要透過明度/音調的大幅度差異拉開階調的配色。","unit":"harmony","micro":false,"sourceJa":"トーンオントーン配色","typing":true,"sourceCaution":"","aliases":["トーンオントーン配色"],"visual":"harmony"},{"id":"83","sourceId":83,"ja":"トーンイントーン配色","zh":"同音調多配色 (Tone in Tone)","en":"Tone in Tone Scheme","definition":"同一トーン（または類似トーン）で全体をまとめた配色。色相の変化を楽しめる。","sourceDefinition":"同一トーン（または類似トーン）で全体をまとめた配色。色相の変化を楽しめる。","notes":"限定同一音調（或類似音調），組合多種不同色相，保持整體質感與調性一致。","unit":"harmony","micro":false,"sourceJa":"トーンイントーン配色","typing":true,"sourceCaution":"","aliases":["トーンイントーン配色"],"visual":"harmony"},{"id":"84","sourceId":84,"ja":"トーナル配色","zh":"濁音調配色 (Tonal Scheme)","en":"Tonal Scheme","definition":"中間色（濁色・dトーン中心）だけで作る平穏で落ち着いた印象の配色。","sourceDefinition":"中間色（濁色・dトーン中心）だけで作る平穏で落ち着いた印象の配色。","notes":"專指採用中間色音調（d、sf、ltg、g等濁色調）構成的平穩、沉著、低調配色。","unit":"harmony","micro":false,"sourceJa":"トーナル配色","typing":true,"sourceCaution":"","aliases":["トーナル配色"],"visual":"harmony"},{"id":"85-1","sourceId":85,"ja":"カマイユ配色","zh":"單色微差配色","en":"Camaïeu / Faux Camaïeu Scheme","definition":"色相とトーンが極めて近く、一見一色のように見える配色。","sourceDefinition":"カマイユ：色相もトーンも極めて似通った一見１色に見える微差配色。フォカマイユ：カマイユより少しだけ差をつけた近似配色。","notes":"Camaïeu 色相音調極接近（如質感變化）；Faux Camaïeu 比 Camaïeu 稍微拉開一點色相或音調差異。","unit":"harmony","micro":true,"sourceJa":"カマイユ配色 / フォカマイユ配色","typing":true,"sourceCaution":"","aliases":["カマイユ配色"],"visual":"harmony"},{"id":"85-2","sourceId":85,"ja":"フォカマイユ配色","zh":"偽單色微差配色","en":"Camaïeu / Faux Camaïeu Scheme","definition":"カマイユ配色より少し差がある近似配色。","sourceDefinition":"カマイユ：色相もトーンも極めて似通った一見１色に見える微差配色。フォカマイユ：カマイユより少しだけ差をつけた近似配色。","notes":"Camaïeu 色相音調極接近（如質感變化）；Faux Camaïeu 比 Camaïeu 稍微拉開一點色相或音調差異。","unit":"harmony","micro":true,"sourceJa":"カマイユ配色 / フォカマイユ配色","typing":true,"sourceCaution":"","aliases":["フォカマイユ配色"],"visual":"harmony"},{"id":"86-1","sourceId":86,"ja":"ビコロール","zh":"雙色對比配色","en":"Bicolore / Tricolore Scheme","definition":"明快なコントラストをもつ２色配色。","sourceDefinition":"ビコロール：コントラスト感のある明快な2色配色。トリコロール：フランス国旗のように明快な対比をもつ3色配色。","notes":"Bicolore 為明快強烈的2色配色；Tricolore 為具明確對比的3色配色（如國旗配色，常加白/黑）。","unit":"harmony","micro":true,"sourceJa":"ビコロール / トリコロール","typing":true,"sourceCaution":"","aliases":["ビコロール"],"visual":"harmony"},{"id":"86-2","sourceId":86,"ja":"トリコロール","zh":"三色對比配色","en":"Bicolore / Tricolore Scheme","definition":"明快なコントラストをもつ３色配色。","sourceDefinition":"ビコロール：コントラスト感のある明快な2色配色。トリコロール：フランス国旗のように明快な対比をもつ3色配色。","notes":"Bicolore 為明快強烈的2色配色；Tricolore 為具明確對比的3色配色（如國旗配色，常加白/黑）。","unit":"harmony","micro":true,"sourceJa":"ビコロール / トリコロール","typing":true,"sourceCaution":"","aliases":["トリコロール"],"visual":"harmony"},{"id":"87-1","sourceId":87,"ja":"ダイアード","zh":"補色對雙色配色","en":"Dyad / Triad / Tetrad","definition":"色相環を２等分し、向かい合う２色相を使う配色。","sourceDefinition":"色相環の幾何学的分割による配色技法：ダイアード(2色相隔180°)、トライアード(3色等分120°)、テトラード(4色正方形/長方形)。","notes":"色相環分割配色技法：Dyad(2色相隔180°)、Triad(3色等分120°)、Tetrad(4色形成矩形/正方形)。","unit":"harmony","micro":true,"sourceJa":"ダイアード / トライアード / テトラード","typing":true,"sourceCaution":"","aliases":["ダイアード"],"visual":"harmony"},{"id":"87-2","sourceId":87,"ja":"トライアード","zh":"正三角三色配色","en":"Dyad / Triad / Tetrad","definition":"色相環を３等分した３色相を使う配色。","sourceDefinition":"色相環の幾何学的分割による配色技法：ダイアード(2色相隔180°)、トライアード(3色等分120°)、テトラード(4色正方形/長方形)。","notes":"色相環分割配色技法：Dyad(2色相隔180°)、Triad(3色等分120°)、Tetrad(4色形成矩形/正方形)。","unit":"harmony","micro":true,"sourceJa":"ダイアード / トライアード / テトラード","typing":true,"sourceCaution":"","aliases":["トライアード"],"visual":"harmony"},{"id":"87-3","sourceId":87,"ja":"テトラード","zh":"四色配色","en":"Dyad / Triad / Tetrad","definition":"色相環を４つに分けた４色相を使う配色。","sourceDefinition":"色相環の幾何学的分割による配色技法：ダイアード(2色相隔180°)、トライアード(3色等分120°)、テトラード(4色正方形/長方形)。","notes":"色相環分割配色技法：Dyad(2色相隔180°)、Triad(3色等分120°)、Tetrad(4色形成矩形/正方形)。","unit":"harmony","micro":true,"sourceJa":"ダイアード / トライアード / テトラード","typing":true,"sourceCaution":"","aliases":["テトラード"],"visual":"harmony"},{"id":"88","sourceId":88,"ja":"ペンタード（ペンタード配色）","zh":"五角形配色 / 5色配色","en":"Pentad Scheme","definition":"色相環を5等分する5色配色。PCCSでは5等分できないため、トライアード（3色）に白・黒を加えて構成する。","sourceDefinition":"色相環を5等分する5色配色。PCCSでは5等分できないため、トライアード（3色）に白・黒を加えて構成する。","notes":"色相環正五角形分割配色。PCCS 24色相無法直接5等分，故實務上採用 Triad（正三角形3色）加上黑白兩色組合成5色。","unit":"harmony","micro":false,"sourceJa":"ペンタード（ペンタード配色）","typing":true,"sourceCaution":"","aliases":["ペンタード（ペンタード配色）"],"visual":"harmony"},{"id":"89","sourceId":89,"ja":"ヘクサード（ヘクサード配色）","zh":"六角形配色 / 6色配色","en":"Hexad Scheme","definition":"色相環を6等分する6色配色（4等分色相差＋白・黒、または正六角形配置）。","sourceDefinition":"色相環を6等分する6色配色（4等分色相差＋白・黒、または正六角形配置）。","notes":"色相環正六角形（每隔4個色相）分割配色，或由 Tetrad（四角形4色）加上黑白兩色組合成6色配色。","unit":"harmony","micro":false,"sourceJa":"ヘクサード（ヘクサード配色）","typing":true,"sourceCaution":"","aliases":["ヘクサード（ヘクサード配色）"],"visual":"harmony"},{"id":"90","sourceId":90,"ja":"スプリットコンプリメンタリー","zh":"分裂補色配色 (3色)","en":"Split Complementary","definition":"補色関係にある片方の色を直接使わず、その両隣の色相に分けて使う分裂補色3色配色。","sourceDefinition":"補色関係にある片方の色を直接使わず、その両隣の色相に分けて使う分裂補色3色配色。","notes":"選擇一色相，搭配其對角補色兩側的相鄰色相，構成等腰三角形之3色配色。","unit":"harmony","micro":false,"sourceJa":"スプリットコンプリメンタリー","typing":true,"sourceCaution":"","aliases":["スプリットコンプリメンタリー"],"visual":"harmony"},{"id":"91-1","sourceId":91,"ja":"アクセントカラー","zh":"點綴色","en":"Accent Color / Separation","definition":"目立つ色を小面積に使い、配色全体を引き締める方法。","sourceDefinition":"アクセントカラー：全体を引き締めるために目立つ色を小面積で使う技法。セパレーション：色の境界部分に別の色を挟んで色を分離・調整する技法。","notes":"Accent Color 以小面積高對比色醒目；Separation 在強烈或模糊邊界插入無彩色/對比色以調整對比。","unit":"harmony","micro":true,"sourceJa":"アクセントカラー / セパレーション","typing":true,"sourceCaution":"","aliases":["アクセントカラー"],"visual":"none"},{"id":"91-2","sourceId":91,"ja":"セパレーション","zh":"分隔色","en":"Accent Color / Separation","definition":"色と色の間に別の色を挟み、境界を調整する方法。","sourceDefinition":"アクセントカラー：全体を引き締めるために目立つ色を小面積で使う技法。セパレーション：色の境界部分に別の色を挟んで色を分離・調整する技法。","notes":"Accent Color 以小面積高對比色醒目；Separation 在強烈或模糊邊界插入無彩色/對比色以調整對比。","unit":"harmony","micro":true,"sourceJa":"アクセントカラー / セパレーション","typing":true,"sourceCaution":"","aliases":["セパレーション"],"visual":"none"},{"id":"92-1","sourceId":92,"ja":"系統色名","zh":"系統色名","en":"Systematic / Customary Color Names","definition":"色相・明度・彩度などの言葉を組み合わせて表す色名。","sourceDefinition":"系統色名：色相・明度・彩度に関する言葉を組み合わせて系統的に表す色名。慣用色名：古くから使われている固有の色名（植物・鉱物・風俗等に由来）。","notes":"JIS Z 8102 規範。系統色名依基本色名與修飾語標記；慣用色名為歷史、自然物件或典故演變之常用名。","unit":"names","micro":true,"sourceJa":"系統色名 / 慣用色名","typing":true,"sourceCaution":"","aliases":["系統色名"],"visual":"none"},{"id":"92-2","sourceId":92,"ja":"慣用色名","zh":"慣用色名","en":"Systematic / Customary Color Names","definition":"植物や鉱物、風俗などに由来し、古くから使われている固有の色名。","sourceDefinition":"系統色名：色相・明度・彩度に関する言葉を組み合わせて系統的に表す色名。慣用色名：古くから使われている固有の色名（植物・鉱物・風俗等に由来）。","notes":"JIS Z 8102 規範。系統色名依基本色名與修飾語標記；慣用色名為歷史、自然物件或典故演變之常用名。","unit":"names","micro":true,"sourceJa":"系統色名 / 慣用色名","typing":true,"sourceCaution":"","aliases":["慣用色名"],"visual":"none"},{"id":"93","sourceId":93,"ja":"2級慣用色名 (和名)","zh":"2級傳統和色名 (31色)","en":"Grade 2 Japanese Customary Names","definition":"2級で学ぶ日本の伝統的な慣用色名（鴇色、韓紅花、蘇芳、鳶色、海老茶、弁柄色、常盤色、緑青色、鴨川鼠、藤色、新橋色など全31色）。","sourceDefinition":"2級で学ぶ日本の伝統的な慣用色名（鴇色、韓紅花、蘇芳、鳶色、海老茶、弁柄色、常盤色、緑青色、鴨川鼠、藤色、新橋色など全31色）。","notes":"含鴇色（ときいろ）、韓紅花、蘇芳、鳶色、海老茶、弁柄色、常盤色、綠青色、鴨川鼠、藤色、新橋色等。","unit":"names","micro":false,"sourceJa":"2級慣用色名 (和名)","typing":false,"sourceCaution":"","aliases":["2級慣用色名 (和名)","2級慣用色名"],"visual":"none"},{"id":"94","sourceId":94,"ja":"2級慣用色名 (外来語)","zh":"2級外來語色名 (32色)","en":"Grade 2 Foreign Customary Names","definition":"2級で学ぶ外来語の慣用色名（ローズピンク、オールドローズ、ポピーレッド、テラコッタ、マルーン、バーガ function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localDay(t=Date.now()){const d=new Date(t);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fmtDate(t){return !t?'尚未':new Date(t).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function rec(id){return state.records[id]||{seen:0,correct:0,wrong:0,firstTry:0,typingWins:0,stage:0,due:0,last:0,days:[],studyDays:[],hard:0}}
function makeRec(id){if(!state.records[id])state.records[id]=rec(id);return state.records[id]}
function termUnit(x){return DB.units.find(u=>u.id===x.unit)}
function filtered(unit){return unit==='all'?T:T.filter(x=>x.unit===unit)}
function stats(items=T){const learned=items.filter(x=>rec(x.id).seen>0).length;const mastered=items.filter(x=>rec(x.id).stage>=4).length;const due=items.filter(x=>{let r=rec(x.id);return r.seen>0&&r.due&&r.due<=Date.now()}).length;return{learned,mastered,due,total:items.length}}
function daily(){return state.activity[localDay()]||0}
function sameId(ids,sourceId){return ids.some(x=>x.sourceId===sourceId)}
function confusable(a,b){if(a.id===b.id)return -1000;let sc=0;if(a.sourceId===b.sourceId)sc+=180;if(a.unit===b.unit)sc+=35;for(const g of GROUPS)if(g.includes(a.sourceId)&&g.includes(b.sourceId)){sc+=110;break}if(a.ja.slice(0,3)===b.ja.slice(0,3))sc+=30;else if(a.ja[0]===b.ja[0])sc+=8;if(Math.abs(a.ja.length-b.ja.length)<4)sc+=3;return sc+Math.random()*10}
function optionsFor(x,label){let candidates=T.filter(y=>y.id!==x.id && y[label]!==x[label]);candidates.sort((a,b)=>confusable(x,b)-confusable(x,a));let pool=shuffle(candidates.slice(0,Math.min(8,candidates.length))).slice(0,3);if(pool.length<3)pool=pool.concat(shuffle(candidates.filter(z=>!pool.includes(z))).slice(0,3-pool.length));return shuffle([x,...pool]).map(y=>({id:y.id,text:y[label]}));}
function jaClue(x){let s=x.definition;if(!s)s=x.notes;const tryNames=[x.ja,x.sourceJa].filter(Boolean).sort((a,b)=>b.length-a.length);for(const term of tryNames){if(term.length<2||/[\/・]/.test(term))continue;s=s.split(term).join('＿＿＿');}if(s===x.ja)s='次の色彩用語を選びなさい。';return s}
const VIS_IDS=new Set(['87-1','87-2','87-3','88','89','90','86-1','86-2']);
function visualShape(x){let n=0,positions=[];if(x.id==='87-1')positions=[0,180];if(x.id==='87-2')positions=[0,120,240];if(x.id==='87-3')positions=[0,90,180,270];if(x.id==='88')positions=[0,72,144,216,288];if(x.id==='89')positions=[0,60,120,180,240,300];if(x.id==='90')positions=[0,145,215];if(x.id==='86-1')n=2;if(x.id==='86-2')n=3;if(n){const colors=['#5352bd','#ef8292','#f7cc77'];return `<div class="visSwatches">${colors.slice(0,n).map(c=>`<i style="background:${c}"></i>`).join('')}</div><div class="legend">配色數量示意圖（非官方色票）</div>`}let dots=positions.map(deg=>{let theta=(deg-90)*Math.PI/180;const cx=120+88*Math.cos(theta),cy=120+88*Math.sin(theta);return `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="13" fill="#fff" stroke="#273047" stroke-width="4"/>`}).join('');let poly=positions.length>2?`<polygon points="${positions.map(d=>{let r=(d-90)*Math.PI/180;return `${(120+88*Math.cos(r)).toFixed(1)},${(120+88*Math.sin(r)).toFixed(1)}`}).join(' ')}" fill="#d0b8f633" stroke="#3d3859" stroke-width="2.5" stroke-dasharray="6 4"/>`:`<line x1="120" y1="32" x2="120" y2="208" stroke="#3d3859" stroke-width="2.5" stroke-dasharray="6 4"/>`;return `<svg class="visWheel" viewBox="0 0 240 240" role="img" aria-label="色相環中的${positions.length}個選定位置，僅供理解分割方式"><defs><linearGradient id="patch" x1="0" x2="1"><stop stop-color="#e7e9f7"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><circle cx="120" cy="120" r="101" fill="none" stroke="#e8e4f4" stroke-width="17"/><circle cx="120" cy="120" r="74" fill="#fff" stroke="#e8e4f4" stroke-width="1"/>${poly}${dots}<text x="120" y="125" font-size="13" font-weight="700" fill="#8d86a4" text-anchor="middle">色相環</text></svg><div class="legend">色相環幾何示意・非 PCCS 官方色票</div>`}
function mkQuestion(x,mode){const r=rec(x.id);let kind=mode;
 if(mode==='adaptive'){
   const s=r.stage;kind=s===0?'jaZh':s===1?'zhJa':s===2?(Math.random()<.6?'defJa':'compare'):s===3?(x.typing&&Math.random()<.7?'typeZh':'defJa'):(x.typing&&Math.random()<.65?'typeJa':'defJa');
 }
 if(mode==='mixed')kind=shuffle(['jaZh','zhJa','defJa','compare',...(x.typing?['typeZh']:[])])[0];
 if(mode==='mock')kind=x.typing&&Math.random()<.38?'typeJa':'defJa';
 if(mode==='typing')kind=x.typing?shuffle(['typeZh','typeJa'])[0]:'defJa';
 if(mode==='visual')kind='visual';
 if(!x.typing&&kind.startsWith('type'))kind='defJa';
 let question={termId:x.id,kind,options:[],correctId:x.id,tries:0,pick:null,excluded:null,done:false,quality:null,typed:'',hint:false};
 if(kind==='jaZh'){question.heading='次の用語の意味を選びましょう';question.prompt=x.ja;question.options=optionsFor(x,'zh');}
 else if(kind==='zhJa'){question.heading='中文概念 → 日文術語';question.prompt=x.zh;question.options=optionsFor(x,'ja');}
 else if(kind==='defJa'||kind==='compare'){question.heading=mode==='mock'?'次の説明に当てはまる語句を選びなさい':'日文定義 → 日文術語';question.prompt=jaClue(x);question.options=optionsFor(x,'ja');}
 else if(kind==='typeZh'){question.heading='日本語で答えましょう';question.prompt=x.zh;}
 else if(kind==='typeJa'){question.heading='説明に当てはまる用語を書きなさい';question.prompt=jaClue(x);}
 else if(kind==='visual'){question.heading='図に当てはまる配色技法を選びなさい';question.prompt='図の色相配置・配色数に最も近い用語はどれですか。';question.options=optionsFor(x,'ja');}
 return question;
}
function scoreAnswer(x,kind,quality){const r=makeRec(x.id);const day=localDay();r.seen++;r.last=Date.now();r.days=r.days||[];r.studyDays=r.studyDays||[];if(!r.studyDays.includes(day))r.studyDays.push(day);if(quality==='full'){r.correct++;r.firstTry++;if(kind.startsWith('type'))r.typingWins++;if(!r.days.includes(day))r.days.push(day);r.streak=(r.streak||0)+1;}
 else if(quality==='hint'){r.correct++;r.hard=(r.hard||0)+1;r.streak=0;}
 else if(quality==='learn'){r.correct++;r.hard=(r.hard||0)+1;r.streak=0;}
 else {r.wrong++;r.streak=0;r.hard=(r.hard||0)+1;}
 if(r.stage===0 && (r.seen>=1) && quality!=='wrong')r.stage=1;
 if(r.stage<=1&&r.correct>=3&&r.firstTry>=2)r.stage=2;
 if(r.stage<=2&&r.correct>=5&&r.firstTry>=4&&r.days.length>=2)r.stage=3;
 if(r.stage<=3&&r.typingWins>=2&&r.days.length>=2&&r.firstTry>=6)r.stage=4;
 if(quality==='wrong'&&r.wrong>1&&r.stage>=2)r.stage=Math.max(1,r.stage-1);
 const min=60000,dayMs=86400000;
 const interval=quality==='wrong'?5*min:quality==='hint'||quality==='learn'?dayMs:r.stage>=4?14*dayMs:r.stage===3?7*dayMs:r.stage===2?3*dayMs:dayMs;
 r.due=Date.now()+interval;
 state.activity[day]=(state.activity[day]||0)+1;
 store();
}

function shortNote(s){const parts=s.split(/[。；;]/).map(x=>x.trim()).filter(Boolean);return parts[0]?parts[0]+'。':s.slice(0,80)}
function modeTile(id,ico,title,subtitle){return `<button class="mode ${studyMode===id?'active':''}" data-mode="${id}"><div style="font-size:25px">${ico}</div><b>${title}</b><span>${subtitle}</span></button>`}
function quizHTML(){if(lastResult&&!lastResult.review&&!exercise)return resultHTML();if(exercise)return exerciseHTML();return `<div class="eyebrow">QUIZ LAB · 日文實戰訓練</div><h1 class="page-title">今天來挑戰！ <span class="muted" style="font-weight:450;font-size:18px">/ クイズ</span></h1><p class="lead">依熟練程度自動調整題型；第一次答錯只給提示，第二次才公布答案。</p><div class="setup"><div class="section-head"><h2>① 選擇訓練模式</h2></div><div class="modegrid">${modeTile('adaptive','🌱','漸進挑戰','由中日雙語逐步過渡到日文輸出')}${modeTile('mixed','🎲','混合小測','每題不同方向，不靠熟悉題型')}${modeTile('defJa','📖','日文定義','日文題幹 → 日文選項')}${modeTile('typing','✍️','日文填空','輸入日文名稱，練習主動回想')}${modeTile('compare','🧩','易混淆對決','同一概念群的相似術語')}${modeTile('visual','🎨','視覺配色題','幾何分割／配色數量示意')}${modeTile('mock','🎓','日文實戰','不顯示中文題幹，選擇與填空混合')}${modeTile('jaZh','🇯🇵','日文認詞','看到日文，選出中文意思')}${modeTile('zhJa','🔁','中文反推','看到中文，選出日文術語')}</div><div class="section-head"><h2>② 選擇範圍</h2></div><div class="panel"><div class="flexwrap"><select class="select" data-change="studyUnit">${unitOptions(studyUnit)}</select><span class="muted" style="font-size:12px">此單元可練 ${filtered(studyUnit).length} 張卡</span></div><div class="section-head" style="margin:19px 0 8px"><h2 style="font-size:14px">③ 題數</h2></div><div class="flexwrap">${[['10','10 題'],['20','20 題'],['all','全部可用術語']].map(([id,t])=>`<button class="pill ${studyAmount===id?'selected':''}" data-amount="${id}">${t}</button>`).join('')}</div><p class="hintline">漸進模式會依各詞的掌握程度切換題型。某些複合條目不適合作精確填空，系統會自動改用四選一。</p><button class="btn" style="margin-top:12px;min-width:180px" data-action="start-quiz">開始練習　→</button></div></div>`}
function getQuizPool(unit,mode){let list=filtered(unit);if(mode==='visual')list=list.filter(x=>VIS_IDS.has(x.id));if(mode==='typing')list=list.filter(x=>x.typing);return list}
function startQuiz(review=false){let pool=review?T.filter(x=>{let r=rec(x.id);return r.seen>0&&r.due&&r.due<=Date.now()}):getQuizPool(studyUnit,studyMode);if(!pool.length){toast(review?'目前沒有到期術語，可以先練新詞。':'這個範圍尚無可出題的術語。');return}
 let ranked=pool.map(x=>({x,score:(rec(x.id).seen===0?18:0)+(rec(x.id).due<=Date.now()&&rec(x.id).seen>0?25:0)+(4-rec(x.id).stage)*8+Math.random()*19})).sort((a,b)=>b.score-a.score).map(v=>v.x);
 let limit=review?Math.min(ranked.length,20):(studyAmount==='all'?ranked.length:Number(studyAmount));const use=ranked.slice(0,limit);let mode=review?'adaptive':studyMode;
 exercise={review,mode,questions:use.map(x=>mkQuestion(x,mode)),at:0,results:[],begun:Date.now()};lastResult=null;page=review?'review':'quiz';render();scrollTopPage()}
function exerciseHTML(){const E=exercise,q=E.questions[E.at],x=BYID[q.termId];if(!q)return `<div>目前沒有題目。</div>`;const fraction=Math.round((E.at+1)/E.questions.length*100);let isTyped=q.kind.startsWith('type'),isVisual=q.kind==='visual';return `<div class="quiz-wrap"><div class="q-top"><div><div class="eyebrow">${E.review?'SMART REVIEW':'QUIZ SESSION'} · ${esc(termUnit(x).ja)}</div><h1 class="page-title" style="font-size:22px">${E.review?'到期複習':'漸進式日文練習'}</h1></div><button class="btn ghost small" data-action="quit-quiz">結束測驗 ×</button></div><div class="progressbox" style="margin-top:17px"><div class="option-row"><small>第 ${E.at+1} / ${E.questions.length} 題</small><small>完成 ${Math.round(E.at/E.questions.length*100)}%</small></div><div class="progressbar"><i style="width:${Math.round(E.at/E.questions.length*100)}%"></i></div></div><div class="q-card"><div class="flexwrap"><span class="badge">${q.kind==='jaZh'?'日文認詞':q.kind==='zhJa'?'中文反推':isTyped?'日文填空':isVisual?'圖像辨識':'日文定義'}</span><span class="badge ${rec(x.id).stage>=3?'mint':''}">${MASTERY[rec(x.id).stage]}</span><span class="hintline">原始資料 #${x.sourceId}</span></div><div class="q-label" style="margin-top:18px">${esc(q.heading)}</div>${isVisual?`<div class="q-vis">${visualShape(x)}</div>`:`<div class="${q.kind==='defJa'||q.kind==='compare'||q.kind==='typeJa'?'q-def':'q-title'}">${esc(q.prompt)}</div>`}${isTyped?`<form id="typing-form" autocomplete="off"><label for="jp-answer" class="hintline">日文答案（請用日文輸入法）</label><div class="inputwrap"><input class="textinput" id="jp-answer" name="answer" lang="ja" type="text" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="在這裡輸入日文術語…" value="${esc(q.typed)}" ${q.done?'disabled':''}><button class="btn" type="submit" ${q.done?'disabled':''}>確認答案</button></div></form><div class="typing-help">支援日文 IME 輸入；輸入法選字時按 Enter 不會直接送出。</div>`:`<div class="answeropts">${q.options.map((o,i)=>{const bad=q.tries>0&&q.pick===o.id&&o.id!==q.correctId;const right=q.done&&o.id===q.correctId;const excluded=q.excluded===o.id;return `<button class="answerbtn ${bad?'selected-wrong':''} ${right?'selected-right':''} ${excluded?'excluded':''}" data-choice="${esc(o.id)}" ${q.done||excluded||bad?'disabled':''}><span class="letter">${['A','B','C','D'][i]}</span><span>${esc(o.text)}</span>${right?'<span style="margin-left:auto;color:var(--green)">✓</span>':''}</button>`}).join('')}</div>`}${q.tries===1&&!q.done?hintHTML(q,x):''}${q.done?feedbackHTML(q,x):''}<div class="q-footer"><div class="q-mini">${q.done?'這一題已記錄學習進度':q.tries===1?'第二次作答：再試一次':'先自己思考，答錯後才顯示提示'}</div>${q.done?`<button class="btn" data-action="next-question">${E.at+1===E.questions.length?'查看結果 →':'下一題 →'}</button>`:''}</div></div></div>`}
function hintHTML(q,x){const typed=q.kind.startsWith('type');const hint=typed?`首字提示：<b>${esc(Array.from(x.ja).slice(0,1).join(''))}…</b>`:'已替你排除一個干擾選項。請比較剩下兩個可能答案的意思。';return `<div class="qstatus wrong"><strong>✧ 再試一次</strong><br>${hint}<br><span class="hintline">第一次錯誤不會公布答案；第二次作答才會批改。</span></div>`}
function feedbackHTML(q,x){let full=q.quality==='full',hint=q.quality==='hint';let title=full?'🌟 正確！答得很好':hint?'✓ 第二次答對！':'↻ 這題再加入複習';let explanation=full?'你在沒有提示的情況下答對了。':hint?'這次使用了提示，系統會安排較早複習。':'兩次嘗試後仍未正確，先記住核心差異，下次再練。';return `<div class="qstatus ${full||hint?'ok':'wrong'}"><strong>${title}</strong><br>${explanation}<div style="margin-top:9px"><b>標準術語：</b><span lang="ja">${esc(x.ja)}</span><br><b>中文輔助：</b>${esc(x.zh)}</div><div style="margin-top:8px"><b>核心概念：</b>${esc(x.definition)}</div><div class="sourcebox"><details><summary>查看 Excel 原始定義與補充說明</summary><p><b>教材定義：</b>${esc(x.sourceDefinition)}</p><p><b>原始重點：</b>${esc(x.notes)}</p>${x.sourceCaution?`<p style="color:var(--red)">${esc(x.sourceCaution)}</p>`:''}</details></div></div>`}
function norm(s){return String(s??'').normalize('NFKC').replace(/[\s\u3000]/g,'').replace(/[.,。．・]/g,'').toLocaleLowerCase('ja')}
function judgeTyped(value,x){return x.aliases.some(a=>norm(value)===norm(a))}
function answerChoice(chosen){const q=exercise?.questions[exercise.at];if(!q||q.done||q.kind.startsWith('type'))return;if(q.excluded===chosen||q.pick===chosen&&q.tries===1)return;const correct=chosen===q.correctId;if(correct){finalizeQuestion(q,q.tries?'hint':'full');return}if(q.tries===0){q.tries=1;q.pick=chosen;let wrong=q.options.filter(o=>o.id!==q.correctId&&o.id!==chosen);q.excluded=wrong.length?shuffle(wrong)[0].id:null;render();return}q.pick=chosen;finalizeQuestion(q,'wrong')}
function answerTyping(value){const q=exercise?.questions[exercise.at];if(!q||q.done||!q.kind.startsWith('type'))return;const typed=String(value||'').trim();if(!typed){toast('請先輸入日文答案');return}q.typed=typed;const ok=judgeTyped(typed,BYID[q.termId]);if(ok){finalizeQuestion(q,q.tries?'hint':'full');return}if(q.tries===0){q.tries=1;q.typed='';render();document.getElementById('jp-answer')?.focus();return}finalizeQuestion(q,'wrong')}
function finalizeQuestion(q,quality){q.done=true;q.quality=quality;q.tries=quality==='wrong'?2:q.tries;const x=BYID[q.termId];scoreAnswer(x,q.kind,quality);exercise.results.push({id:x.id,quality,kind:q.kind});render()}
function finishQuiz(){if(!exercise)return;lastResult={count:exercise.questions.length,results:exercise.results,review:exercise.review,elapsed:Date.now()-exercise.begun};state.sessions.unshift({at:Date.now(),total:lastResult.count,full:lastResult.results.filter(r=>r.quality==='full').length,hint:lastResult.results.filter(r=>r.quality==='hint').length,wrong:lastResult.results.filter(r=>r.quality==='wrong').length});state.sessions=state.sessions.slice(0,40);exercise=null;store();page=lastResult.review?'review':'quiz';render();scrollTopPage()}
function resultHTML(){const r=lastResult,full=r.results.filter(q=>q.quality==='full').length,hint=r.results.filter(q=>q.quality==='hint').length,wrong=r.results.filter(q=>q.quality==='wrong').length;return `<div class="quiz-wrap"><div class="panel" style="text-align:center;padding:35px 22px"><div class="result-huge">${wrong===0?'🌷':'🎨'}</div><div class="eyebrow">SESSION COMPLETED</div><h1 class="page-title" style="margin:9px 0">${wrong===0?'練習完成！':'今天的進步已記錄'}</h1><p class="lead">${r.count} 題已完成；首次答對與提示後答對會分開記錄。</p><div class="result-grid"><div class="stat"><div class="caption">🌟 一次答對</div><div class="value">${full}</div></div><div class="stat"><div class="caption">💡 提示後答對</div><div class="value">${hint}</div></div><div class="stat"><div class="caption">↻ 需複習</div><div class="value">${wrong}</div></div></div><p class="hintline" style="margin:19px">只有跨日、無提示的日文輸出會推進較高熟練階段。</p><div class="flexwrap" style="justify-content:center"><button class="btn" data-action="result-again">再練一回合 →</button><button class="btn secondary" data-page="home">回首頁</button></div></div><div class="section-head"><h2>本次術語</h2></div><div class="list">${r.results.map(a=>{let x=BYID[a.id];return `<div class="term-row" data-detail="${x.id}"><span style="font-size:20px">${a.quality==='full'?'🌟':a.quality==='hint'?'💡':'↻'}</span><div class="term-main"><b>${esc(x.ja)}</b><span>${esc(x.zh)}</span></div><span class="mini-state muted">查看說明 →</span></div>`}).join('')}</div></div>`}
function reviewHTML(){if(exercise)return exerciseHTML();if(lastResult?.review)return resultHTML();const due=T.filter(x=>{let r=rec(x.id);return r.seen>0&&r.due&&r.due<=Date.now()}).sort((a,b)=>rec(a.id).due-rec(b.id).due);const weak=T.filter(x=>rec(x.id).wrong>0).sort((a,b)=>rec(b.id).wrong-rec(a.id).wrong).slice(0,15);return `<div class="eyebrow">SPACED REVIEW · 記憶加固</div><h1 class="page-title">錯題與到期複習</h1><p class="lead">答錯先提示再重試；需要複習的單字會依預定日期再次出現。</p><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:500px"><div class="stat"><div class="caption">↻ 現在可複習</div><div class="value">${due.length}</div><div class="tiny">到期的術語</div></div><div class="stat"><div class="caption">🧠 曾經答錯</div><div class="value">${T.filter(x=>rec(x.id).wrong>0).length}</div><div class="tiny">等待再次鞏固</div></div></div><button class="btn" data-action="start-review" ${due.length?'':'disabled'}>${due.length?'開始到期複習 →':'目前沒有到期術語'}</button>${!due.length?`<p class="notice" style="margin:15px 0">目前沒有到期項目。可以先用學習卡認識新詞，或到測驗頁挑戰其他術語。</p>`:''}<div class="section-head"><h2>到期清單</h2></div>${due.length?`<div class="list">${due.slice(0,30).map(x=>termLine(x)).join('')}</div>`:`<div class="empty"><span class="big">🌿</span>目前沒有需要立刻複習的術語。</div>`}<div class="section-head"><h2>較常答錯的術語</h2></div>${weak.length?`<div class="list">${weak.map(x=>termLine(x)).join('')}</div>`:`<div class="empty">答錯紀錄會顯示在這裡，方便針對弱點複習。</div>`}`}
function termLine(x){let r=rec(x.id),u=termUnit(x);return `<div class="term-row" data-detail="${x.id}" style="--unit:${u.color}"><i class="dot"></i><div class="term-main"><b>${esc(x.ja)}</b><span>${esc(x.zh)}</span></div><span class="badge ${r.stage===4?'mint':''}">${MASTERY[r.stage]}</span><span class="hintline" style="white-space:nowrap">→</span></div>`}
function libraryHTML(){const term=libSearch.trim().toLowerCase();let items=filtered(libUnit).filter(x=>!term||[x.ja,x.zh,x.en,x.definition,x.notes,String(x.sourceId)].some(v=>v.toLowerCase().includes(term)));if(libFilter==='favorites')items=items.filter(x=>state.favorites.includes(x.id));if(libFilter==='new')items=items.filter(x=>rec(x.id).seen===0);if(libFilter==='weak')items=items.filter(x=>rec(x.id).wrong>0);if(libFilter==='mastered')items=items.filter(x=>rec(x.id).stage>=4);return `<div class="eyebrow">COLOR TERMS · 資料圖鑑</div><h1 class="page-title">術語圖鑑</h1><p class="lead">完整保留 106 筆原始 Excel 紀錄，將部分複合術語整理成 ${T.length} 張獨立學習卡。</p><div class="filters"><input class="textinput" style="max-width:340px" type="search" data-input="libSearch" placeholder="搜尋日文、中文、英文或序號" value="${esc(libSearch)}" aria-label="搜尋術語"><select class="select" data-change="libUnit">${unitOptions(libUnit)}</select></div><div class="filters">${[['all','全部'],['new','未學'],['weak','曾答錯'],['mastered','已掌握'],['favorites','♡ 收藏']].map(([k,s])=>`<button class="pill ${libFilter===k?'selected':''}" data-lib-filter="${k}">${s}</button>`).join('')}<span class="hintline">共 ${items.length} 筆</span></div>${items.length?`<div class="list" id="term-list">${items.map(x=>termLine(x)).join('')}</div>`:`<div class="empty">找不到符合條件的術語。試著換一個搜尋詞或篩選條件。</div>`}`}
function detailHTML(id){let x=BYID[id];if(!x)return '';let r=rec(x.id),u=termUnit(x);let star=state.favorites.includes(x.id);return `<div class="modal-bg" data-action="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="術語資料"><button class="close" data-action="close-modal" aria-label="關閉">×</button><span class="badge">${esc(u.name)} · Excel #${x.sourceId}</span><h2 lang="ja">${esc(x.ja)}</h2><div class="muted" style="font-size:15px">${esc(x.zh)}</div><hr class="divider"><div class="flexwrap"><span class="badge ${r.stage>=4?'mint':''}">${MASTERY[r.stage]}</span><span class="hintline">答對 ${r.correct} 次 · 答錯 ${r.wrong} 次 · 下次複習 ${fmtDate(r.due)}</span></div><h3>短版日文理解</h3><p lang="ja">${esc(x.definition)}</p><h3>教材日文原文</h3><p lang="ja">${esc(x.sourceDefinition)}</p><h3>核心考點／中文補充</h3><p>${esc(x.notes)}</p><h3>英文對應詞（來源資料）</h3><p>${esc(x.en)}</p>${x.sourceCaution?`<p class="notice">${esc(x.sourceCaution)}</p>`:''}<hr class="divider"><div class="flexwrap"><button class="btn secondary" data-favorite="${x.id}">${star?'♥ 已收藏':'♡ 收藏這個術語'}</button><button class="btn" data-action="detail-to-learn" data-term-id="${x.id}">用學習卡練習 →</button></div><div class="credit">來源：${esc(DB.sourceName)} 第 ${x.sourceId} 筆；拆分術語標註為精簡教學句，原文仍保留。</div></div></div>`}
function settingsHTML(){return `<div class="modal-bg" data-action="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="設定與備份"><button class="close" data-action="close-modal" aria-label="關閉">×</button><span class="eyebrow">PERSONAL LEARNING · SETTINGS</span><h2>學習設定與備份</h2><p class="muted">所有資料保存在你的瀏覽器裡，不需要會員、網路或伺服器。</p><div class="settingsgrid"><div class="settingsrow"><b>每日小目標</b><label class="hintline" for="daily-goal">每天希望完成幾次練習？</label><select id="daily-goal" data-change="daily-goal" class="select" style="width:100%;margin-top:7px">${[6,12,20,30].map(n=>`<option value="${n}" ${state.settings.dailyGoal===n?'selected':''}>${n} 次</option>`).join('')}</select></div><div class="settingsrow"><b>本機儲存狀態</b><span class="badge ${persistOK?'mint':'pink'}">${persistOK?'本機記錄已啟用':'此環境無法儲存'}</span><p class="hintline">若使用 Safari 私密瀏覽、清除網站資料或換裝置，紀錄可能消失。</p></div></div><hr class="divider"><h3>進度備份</h3><div class="flexwrap"><button class="btn secondary" data-action="export">⬇ 匯出進度 JSON</button><button class="btn secondary" data-action="import">⬆ 匯入進度 JSON</button></div><p class="hintline">建議定期匯出備份；匯入會覆蓋此瀏覽器原有的學習進度。</p><hr class="divider"><h3 style="color:var(--red)">重設進度</h3><button class="btn outline-danger" data-action="reset-progress">清除本機進度</button><p class="hintline">術語資料不會被刪除，只會清除已學、錯題、收藏和練習記錄。</p><hr class="divider"><p class="notice">這是根據使用者上傳 Excel 製作的學習工具，並非 AFT 官方授權題庫。部分資料與原始用語未逐條對照官方教材，考試標準仍應依官方教材為準。圖形為概念示意，不是官方色票。</p></div></div>`}
function exportData(){const payload={app:'IRO STUDY AFT2',exported: new Date().toISOString(),source:DB.sourceName,save:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`IRO_STUDY_progress_${localDay()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(String(reader.result||''));let newSave=obj?.save;if(!newSave||!newSave.records||typeof newSave.records!=='object'||!Array.isArray(newSave.favorites))throw Error('不是 IRO STUDY 的進度備份');if(!confirm('匯入將覆蓋目前所有練習進度，確定繼續？'))return;const base=blankSave();base.favorites=newSave.favorites.filter(x=>BYID[x]);base.activity=(newSave.activity&&typeof newSave.activity==='object')?newSave.activity:{};base.sessions=Array.isArray(newSave.sessions)?newSave.sessions.slice(0,40):[];base.settings={dailyGoal:[6,12,20,30].includes(newSave.settings?.dailyGoal)?newSave.settings.dailyGoal:12};for(const [id,r] of Object.entries(newSave.records)){if(!BYID[id]||!r||typeof r!=='object')continue;const safe=makeEmptyRecc();for(const key of ['seen','correct','wrong','firstTry','typingWins','stage','due','last','hard','streak'])if(Number.isFinite(r[key]))safe[key]=Math.max(0,r[key]);safe.stage=Math.min(4,safe.stage);safe.days=Array.isArray(r.days)?r.days.filter(s=>typeof s==='string').slice(0,999):[];safe.studyDays=Array.isArray(r.studyDays)?r.studyDays.filter(s=>typeof s==='string').slice(0,999):[];base.records[id]=safe;}state=base;store();detail=null;exercise=null;lastResult=null;render();toast('進度已匯入');}catch(e){alert('無法匯入：'+e.message)}finally{document.getElementById('import-file').value=''}};reader.readAsText(file,'UTF-8')}
function makeEmptyRecc(){return {seen:0,correct:0,wrong:0,firstTry:0,typingWins:0,stage:0,due:0,last:0,hard:0,streak:0,days:[],studyDays:[]}}
function nextCard(delta=1){learnIndex=(learnIndex+delta+learnOrder.length)%learnOrder.length;learnFlipped=false;render()}
function learnRating(quality){const x=learnCurrent();if(!x)return;scoreAnswer(x,'flash',quality);nextCard();toast(quality==='full'?'🌟 已記錄「自己想起來」':quality==='learn'?'已排入近期複習':'已加入重點複習')}
// All main interactions use event delegation so rerendering does not discard listeners.
document.addEventListener('click',event=>{const el=event.target.closest('button,[data-detail],[data-unit-learn],.modal-bg');if(!el)return;const dataset=el.dataset;
 if(dataset.page){if(dataset.page==='quiz'&&exercise){page='quiz';render();scrollTopPage();return}goto(dataset.page);return}
 if(dataset.unitLearn){startLearn(dataset.unitLearn);return}
 if(dataset.detail){detail=dataset.detail;render();return}
 if(dataset.favorite){const id=dataset.favorite;const index=state.favorites.indexOf(id);if(index<0)state.favorites.push(id);else state.favorites.splice(index,1);store();render();return}
 if(dataset.rating){learnRating(dataset.rating);return}
 if(dataset.mode){studyMode=dataset.mode;render();return}
 if(dataset.amount){studyAmount=dataset.amount;render();return}
 if(dataset.libFilter){libFilter=dataset.libFilter;render();return}
 if(dataset.choice){answerChoice(dataset.choice);return}
 const a=dataset.action;if(!a)return;
 if(a==='settings'){detail='settings';document.getElementById('app').insertAdjacentHTML('beforeend',settingsHTML());return}
 if(a==='close-modal-bg'&&event.target===el){detail=null;render();return}
 if(a==='close-modal'){detail=null;render();return}
 if(a==='start-daily'){studyMode='adaptive';studyUnit='all';studyAmount='10';startQuiz();return}
 if(a==='learn-ja'){learnSide='ja';learnFlipped=false;render();return}
 if(a==='learn-zh'){learnSide='zh';learnFlipped=false;render();return}
 if(a==='flip'){learnFlipped=!learnFlipped;render();return}
 if(a==='prev-card'){nextCard(-1);return}
 if(a==='next-card'){nextCard();return}
 if(a==='start-quiz'){startQuiz();return}
 if(a==='start-review'){startQuiz(true);return}
 if(a==='next-question'){if(!exercise)return;if(exercise.at===exercise.questions.length-1)finishQuiz();else{exercise.at++;render();scrollTopPage()}return}
 if(a==='quit-quiz'){if(confirm('確定結束這次測驗？已作答的進度會保留。')){exercise=null;lastResult=null;page='quiz';render();scrollTopPage()}return}
 if(a==='result-again'){lastResult=null;if(page==='review')startQuiz(true);else{page='quiz';render();scrollTopPage()}return}
 if(a==='detail-to-learn'){const x=BYID[dataset.termId];if(!x)return;learnUnit=x.unit;learnOrder=filtered(x.unit).map(x=>x.id);learnIndex=learnOrder.indexOf(x.id);learnFlipped=false;detail=null;page='learn';render();scrollTopPage();return}
 if(a==='export'){exportData();return}
 if(a==='import'){document.getElementById('import-file').click();return}
 if(a==='reset-progress'){if(confirm('確定清除所有本機進度與收藏嗎？此操作無法還原（除非你有備份）。')){state=blankSave();store();detail=null;exercise=null;lastResult=null;learnOrder=[];render();toast('已重設本機進度')}return}
});
document.addEventListener('change',e=>{const name=e.target.dataset.change;if(!name)return;
 if(name==='learnUnit'){startLearn(e.target.value);return}
 if(name==='studyUnit'){studyUnit=e.target.value;render();return}
 if(name==='libUnit'){libUnit=e.target.value;render();return}
 if(name==='daily-goal'){state.settings.dailyGoal=Number(e.target.value);store();detail=null;render();toast('每日目標已更新');return}
});
document.addEventListener('input',e=>{if(e.target.dataset.input==='libSearch'){const pos=e.target.selectionStart;libSearch=e.target.value;const term=e.target.closest('.main');const list=term?.querySelector('#term-list');const newList=document.createElement('div');let items=filtered(libUnit).filter(x=>[x.ja,x.zh,x.en,x.definition,x.notes,String(x.sourceId)].some(v=>v.toLowerCase().includes(libSearch.toLowerCase().trim())));if(libFilter==='favorites')items=items.filter(x=>state.favorites.includes(x.id));if(libFilter==='new')items=items.filter(x=>rec(x.id).seen===0);if(libFilter==='weak')items=items.filter(x=>rec(x.id).wrong>0);if(libFilter==='mastered')items=items.filter(x=>rec(x.id).stage>=4);if(list){list.innerHTML=items.map(x=>termLine(x)).join('')||'<div class="empty">沒有符合條件的術語。</div>'}else{render();let input=document.querySelector('[data-input="libSearch"]');input?.focus();input?.setSelectionRange(pos,pos)}let count=document.querySelector('.filters .hintline');if(count)count.textContent=`共 ${items.length} 筆`;}}
);
document.addEventListener('compositionstart',()=>{composing=true});document.addEventListener('compositionend',()=>{composing=false});
document.addEventListener('submit',e=>{if(e.target.id!=='typing-form')return;e.preventDefault();if(composing||e.submitter?.disabled)return;const input=e.target.querySelector('#jp-answer');answerTyping(input?.value||'')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detail){detail=null;render();return}if(!exercise||exercise.questions[exercise.at]?.done)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.altKey||e.ctrlKey||e.metaKey)return;const n=Number(e.key);if(n>=1&&n<=4){const q=exercise.questions[exercise.at];if(q.options[n-1])answerChoice(q.options[n-1].id)}});
document.getElementById('import-file').addEventListener('change',e=>importData(e.target.files?.[0]));
render();
</script>
</body>
</html>
