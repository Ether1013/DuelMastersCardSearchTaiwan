<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌/角色 圓餅圖生成器</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- 引入 Tailwind CSS (快速排版) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .canvas-container { 
            margin: 0 auto; 
            background: white; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            /* 加入以下兩行讓外層容器自適應寬度 */
            max-width: 100%;
            height: auto !important; 
        }
        
        /* 新增這段，讓 Fabric 產生的多層 canvas 標籤也能跟著等比例縮放 */
        .canvas-container canvas {
            width: 100% !important;
            height: auto !important;
        }
        
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 1.5rem; z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="app" class="h-screen flex flex-col md:flex-row overflow-hidden">
        
        <!-- 左側控制面板 -->
        <div class="w-full md:w-1/3 h-full bg-white border-r overflow-y-auto p-4 flex flex-col">
            <h1 class="text-2xl font-bold mb-1 text-gray-800">圓餅圖生成器</h1>
            <div class="text-xs text-gray-500 mb-4 flex justify-between items-center">
                <span>每10秒自動暫存</span>
                <span v-if="lastSavedTime" class="text-green-600">已暫存: {{ lastSavedTime }}</span>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">主標題</label>
                <input v-model="chartTitle" type="text" class="w-full border rounded p-2" placeholder="例如: 2026台灣GP代表選拔戰">
            </div>

            <div class="flex-1 overflow-y-auto border-t pt-4">
                <div v-for="(item, index) in slices" :key="item.id" class="mb-4 p-3 border rounded bg-gray-50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm">切片 #{{ index + 1 }}</span>
                        <button @click="removeSlice(index)" class="text-red-500 text-xs px-2 py-1 bg-red-100 rounded hover:bg-red-200">移除</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input v-model="item.label" type="text" placeholder="標籤" class="border rounded p-1 text-sm">
                        <input v-model.number="item.value" type="number" placeholder="數值" class="border rounded p-1 text-sm">
                    </div>
                    <div class="flex gap-2">
                        <input v-model="item.imageUrl" type="text" placeholder="圖片網址或留空上傳" class="border rounded p-1 text-sm flex-1">
                        <input type="file" accept="image/*" @change="e => handleFileUpload(e, item)" class="hidden" :id="'file-'+item.id">
                        <label :for="'file-'+item.id" class="bg-gray-200 hover:bg-gray-300 text-xs py-1 px-2 rounded cursor-pointer flex items-center">上傳</label>
                    </div>
                </div>
                <button @click="addSlice" class="w-full bg-blue-100 text-blue-600 border border-blue-300 py-2 rounded mb-4 hover:bg-blue-200">+ 新增切片</button>
            </div>

            <div class="mt-4 border-t pt-4 space-y-2">
                <button @click="renderChart" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700">套用資料/重繪圓餅圖</button>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="exportProject" class="bg-gray-600 text-white py-2 rounded hover:bg-gray-700 text-sm">下載專案檔</button>
                    <div>
                        <input type="file" accept=".json" @change="importProject" class="hidden" id="load-proj">
                        <label for="load-proj" class="bg-gray-600 text-white py-2 rounded hover:bg-gray-700 w-full flex justify-center cursor-pointer text-sm">匯入專案檔</label>
                    </div>
                </div>
                <button @click="exportImage" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 text-lg">匯出結果單一圖片</button>
            </div>
        </div>

        <!-- 右側 Canvas 顯示區 -->
        <div class="w-full md:w-2/3 h-full bg-gray-100 p-4 flex overflow-auto relative">
            <div class="absolute top-4 left-4 bg-white/80 p-2 text-sm rounded shadow pointer-events-none z-10 text-gray-700">
                💡 <b>操作提示</b>：請點擊圖表兩側的<b>文字標籤</b>來啟動圖片編輯。<br>
                (左上/右上控制點為旋轉，左下/右下為縮放)
            </div>
            <!-- 將 width="1000" 修改為 width="1200" -->
			<canvas id="pieCanvas" width="1200" height="800" class="fabric-canvas"></canvas>
        </div>

        <!-- Loading 狀態 -->
        <div v-if="isLoading" id="loading-overlay">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white mb-4"></div>
            <div>{{ loadingMessage }}</div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const chartTitle = ref("2026台灣GP代表選拔戰");
                const slices = ref([
                    { id: 's1', label: '學生會(3C:6 / 4C:1)', value: 7, imageUrl: 'https://via.placeholder.com/400?text=Card1' },
                    { id: 's2', label: '水闇人偶', value: 4, imageUrl: 'https://via.placeholder.com/400?text=Card2' },
                    { id: 's3', label: '水火自然刃鬼', value: 1, imageUrl: 'https://via.placeholder.com/400?text=Card3' },
                    { id: 's4', label: '火光自然夢幻夥伴', value: 1, imageUrl: 'https://via.placeholder.com/400?text=Card4' },
                ]);

                const isLoading = ref(false);
                const loadingMessage = ref("");
                const lastSavedTime = ref("");
                let canvas = null;
                let imageLayers = {}; 

                const CX = 600;
                const CY = 420;
                const RADIUS = 280;

                onMounted(() => {
                    initFabricControls(); // 初始化 Fabric 自訂控制點
                    
                    canvas = new fabric.Canvas('pieCanvas', {
                        preserveObjectStacking: true,
                        backgroundColor: '#ffffff'
                    });

                    // 【需求2】點擊對應文字來選取圖片
                    canvas.on('mouse:down', (e) => {
                        if (e.target && e.target.isLabel) {
                            // 先將所有圖片鎖定取消選取
                            canvas.getObjects('image').forEach(o => o.set({ selectable: false, evented: false }));
                            
                            // 啟動對應圖片
                            const img = imageLayers[e.target.linkId];
                            if (img) {
                                img.set({ selectable: true, evented: true });
                                canvas.setActiveObject(img);
                                canvas.requestRenderAll();
                            }
                        }
                    });

                    // 點擊空白處或取消選取時，封鎖圖片互動
                    canvas.on('selection:cleared', () => {
                        canvas.getObjects('image').forEach(o => o.set({ selectable: false, evented: false }));
                    });

                    // 【需求1】嘗試讀取本地暫存
                    loadFromLocal();
                    
                    // 自動存檔迴圈 (每10秒)
                    setInterval(saveToLocal, 10000);
                });

                // 【需求3】自訂控制點 (旋轉與縮放)
                function initFabricControls() {
                    const controls = fabric.Object.prototype.controls;
                    // 隱藏不需要的點
                    controls.mt.visible = false;
                    controls.mb.visible = false;
                    controls.ml.visible = false;
                    controls.mr.visible = false;
                    controls.mtr.visible = false; // 隱藏原本懸空的旋轉桿

                    // 設定左上、右上為旋轉 (Rotation)
                    const rotHandler = fabric.controlsUtils.rotationWithSnapping;
                    controls.tl.actionHandler = rotHandler;
                    controls.tl.cursorStyle = 'grab';
                    
                    controls.tr.actionHandler = rotHandler;
                    controls.tr.cursorStyle = 'grab';
                    
                    // 確保左下、右下維持預設的等比縮放
                    // Fabric v5 預設 tl,tr,bl,br 都是 scalingEqually，所以 bl,br 不需特別改，只要確保顯示
                    controls.bl.visible = true;
                    controls.br.visible = true;
                    
                    // 樣式調整
                    fabric.Object.prototype.set({
                        cornerColor: '#3b82f6', borderColor: '#3b82f6',
                        cornerSize: 12, transparentCorners: false
                    });
                }

                // --- 暫存機制 (Local Storage) ---
                function packProjectData() {
                    const transforms = {};
                    for (let id in imageLayers) {
                        const img = imageLayers[id];
                        transforms[id] = {
                            left: img.left, top: img.top,
                            scaleX: img.scaleX, scaleY: img.scaleY, angle: img.angle
                        };
                    }
                    return { title: chartTitle.value, slices: slices.value, transforms: transforms };
                }

                function saveToLocal() {
                    const data = { timestamp: Date.now(), project: packProjectData() };
                    try {
                        localStorage.setItem('pieChartBackup', JSON.stringify(data));
                        const d = new Date();
                        lastSavedTime.value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
                    } catch (e) {
                        console.warn("暫存失敗，可能圖片Base64過大超過LocalStorage限制。");
                    }
                }

                function loadFromLocal() {
                    const saved = localStorage.getItem('pieChartBackup');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            // 檢查是否過期 (24小時 = 86400000 ms)
                            if (Date.now() - parsed.timestamp < 86400000) {
                                restoreProjectData(parsed.project);
                                return;
                            } else {
                                localStorage.removeItem('pieChartBackup'); // 過期清除
                            }
                        } catch(e) {}
                    }
                    // 無有效暫存則繪製初始預設值
                    renderChart();
                }

                async function restoreProjectData(data) {
                    chartTitle.value = data.title;
                    slices.value = data.slices;
                    canvas.clear();
                    canvas.backgroundColor = '#ffffff';
                    imageLayers = {};
                    
                    await renderChart();

                    // 復原圖片矩陣
                    if (data.transforms) {
                        for (let id in data.transforms) {
                            if (imageLayers[id]) {
                                imageLayers[id].set(data.transforms[id]);
                                imageLayers[id].setCoords(); // 更新點擊判定
                            }
                        }
                        canvas.renderAll();
                    }
                }

                function addSlice() {
                    slices.value.push({ id: 's' + Date.now(), label: '新項目', value: 1, imageUrl: '' });
                }

                function removeSlice(index) {
                    const item = slices.value[index];
                    if (imageLayers[item.id]) {
                        canvas.remove(imageLayers[item.id]);
                        delete imageLayers[item.id];
                    }
                    slices.value.splice(index, 1);
                }

                // 改用 Base64，確保 F5 重新整理後圖片依然存在 localStorage 裡
                function handleFileUpload(event, item) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            item.imageUrl = e.target.result;
                            item.isBlob = true; // 註記這是本地檔，匯出時不需走 Proxy
                        };
                        reader.readAsDataURL(file);
                    }
                }

                function createArcPath(cx, cy, r, startAngle, endAngle) {
                    if (endAngle - startAngle >= Math.PI * 2 - 0.001) {
                        return `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx} ${cy + r} A ${r} ${r} 0 1 1 ${cx} ${cy - r} Z`;
                    }
                    const startX = cx + r * Math.cos(startAngle);
                    const startY = cy + r * Math.sin(startAngle);
                    const endX = cx + r * Math.cos(endAngle);
                    const endY = cy + r * Math.sin(endAngle);
                    const largeArcFlag = endAngle - startAngle <= Math.PI ? "0" : "1";
                    return `M ${cx} ${cy} L ${startX} ${startY} A ${r} ${r} 0 ${largeArcFlag} 1 ${endX} ${endY} Z`;
                }

                async function renderChart() {
                    // 清除舊裝飾線
                    const objects = canvas.getObjects();
                    objects.forEach(obj => { if (obj.isDecorator) canvas.remove(obj); });

                    const titleText = new fabric.Text(chartTitle.value, {
                        left: CX, top: 50, originX: 'center', originY: 'center',
                        fontSize: 32, fontWeight: 'bold', isDecorator: true, selectable: false
                    });
                    canvas.add(titleText);

                    const total = slices.value.reduce((sum, item) => sum + (item.value || 0), 0);
                    let currentAngle = -Math.PI / 2;
                    const labelData = [];

                    for (let i = 0; i < slices.value.length; i++) {
                        const item = slices.value[i];
                        if (!item.value) continue;

                        const sliceAngle = (item.value / total) * Math.PI * 2;
                        const startAngle = currentAngle;
                        const endAngle = currentAngle + sliceAngle;
                        
                        const pathStr = createArcPath(CX, CY, RADIUS, startAngle, endAngle);
                        const clipPath = new fabric.Path(pathStr, { absolutePositioned: true });

                        if (item.imageUrl) {
                            if (!imageLayers[item.id] || imageLayers[item.id].originalUrl !== item.imageUrl) {
                                if (imageLayers[item.id]) canvas.remove(imageLayers[item.id]);
                                
                                await new Promise(resolve => {
                                    fabric.Image.fromURL(item.imageUrl, (img) => {
                                        img.set({
                                            clipPath: clipPath,
                                            left: CX, top: CY,
                                            originX: 'center', originY: 'center',
                                            originalUrl: item.imageUrl, isBlob: item.isBlob, customId: item.id,
                                            // 預設關閉選取事件，必須透過點擊文字喚醒
                                            selectable: false, evented: false
                                        });
                                        const scale = Math.max((RADIUS * 2) / img.width, (RADIUS * 2) / img.height);
                                        img.scale(scale);
                                        
                                        imageLayers[item.id] = img;
                                        canvas.insertAt(img, 0);
                                        resolve();
                                    });
                                });
                            } else {
                                imageLayers[item.id].set({ clipPath: clipPath });
                            }
                        }

                        const borderPath = new fabric.Path(pathStr, {
                            fill: 'transparent', stroke: '#ffffff', strokeWidth: 3,
                            absolutePositioned: true, selectable: false, evented: false, isDecorator: true
                        });
                        canvas.add(borderPath);

                        const midAngle = startAngle + sliceAngle / 2;
                        labelData.push({
                            id: item.id,
                            label: `${item.label} ${item.value} (${((item.value / total) * 100).toFixed(1)}%)`,
                            midAngle: midAngle,
                            side: (midAngle > -Math.PI / 2 && midAngle <= Math.PI / 2) ? 'right' : 'left'
                        });
                        currentAngle = endAngle;
                    }

                    drawLabelsAndLines(labelData);
                    canvas.renderAll();
                }

                function drawLabelsAndLines(labelData) {
                    const lefts = labelData.filter(d => d.side === 'left');
                    const rights = labelData.filter(d => d.side === 'right');

                    lefts.forEach(d => d.targetY = CY + Math.sin(d.midAngle) * RADIUS);
                    rights.forEach(d => d.targetY = CY + Math.sin(d.midAngle) * RADIUS);

                    function relax(nodes) {
                        nodes.sort((a, b) => a.targetY - b.targetY);
                        const spacing = 26;
                        for (let iter = 0; iter < 10; iter++) {
                            for (let i = 0; i < nodes.length - 1; i++) {
                                let diff = nodes[i + 1].targetY - nodes[i].targetY;
                                if (diff < spacing) {
                                    let overlap = spacing - diff;
                                    nodes[i].targetY -= overlap / 2;
                                    nodes[i + 1].targetY += overlap / 2;
                                }
                            }
                        }
                    }
                    relax(lefts); relax(rights);

                    const drawSide = (nodes, side) => {
                        nodes.forEach(node => {
                            const startX = CX + Math.cos(node.midAngle) * RADIUS;
                            const startY = CY + Math.sin(node.midAngle) * RADIUS;
                            const breakX = startX + Math.cos(node.midAngle) * 30; 
                            const endX = side === 'left' ? CX - RADIUS - 80 : CX + RADIUS + 80;
                            const align = side === 'left' ? 'right' : 'left';

                            const polyline = new fabric.Polyline([
                                {x: startX, y: startY}, {x: breakX, y: startY},
                                {x: breakX + (side==='left'?-10:10), y: node.targetY}, {x: endX, y: node.targetY}
                            ], {
                                fill: 'transparent', stroke: '#333', strokeWidth: 1.5,
                                selectable: false, evented: false, isDecorator: true
                            });
                            canvas.add(polyline);

                            // 【需求2】使文字具備互動性
                            const text = new fabric.Text(node.label, {
                                left: side === 'left' ? endX - 5 : endX + 5,
                                top: node.targetY - 14,
                                originX: align, originY: 'top',
                                fontSize: 16, fill: '#000',
                                selectable: false, evented: true, isDecorator: true,
                                hoverCursor: 'pointer', isLabel: true, linkId: node.id
                            });
                            
                            // 滑鼠懸停樣式
                            text.on('mouseover', () => { text.set('fill', '#2563eb'); canvas.requestRenderAll(); });
                            text.on('mouseout', () => { text.set('fill', '#000'); canvas.requestRenderAll(); });
                            
                            canvas.add(text);
                        });
                    };

                    drawSide(lefts, 'left'); drawSide(rights, 'right');
                }

                // 匯出與匯入專案 JSON
                function exportProject() {
                    const blob = new Blob([JSON.stringify(packProjectData(), null, 2)], { type: 'application/json' });
                    const link = document.createElement('a');
                    link.download = 'pie_chart_project.json';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                }

                function importProject(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (event) => restoreProjectData(JSON.parse(event.target.result));
                    reader.readAsText(file);
                    e.target.value = '';
                }

                async function exportImage() {
                    isLoading.value = true;
                    loadingMessage.value = "[處理中] 正在去後端跨越CORS取得圖片...";
                    
                    try {
                        canvas.discardActiveObject();
                        canvas.renderAll();

                        const objects = canvas.getObjects('image');
                        const fetchPromises = objects.map(async (obj) => {
                            if (obj.originalUrl && obj.originalUrl.startsWith('http') && !obj.isBlob) {
                                // 呼叫 Python 後端 CORS Proxy
                                const proxyUrl = `/api/proxy-image?url=${encodeURIComponent(obj.originalUrl)}`;
                                return new Promise((resolve) => {
                                    obj.setSrc(proxyUrl, () => resolve(), { crossOrigin: 'anonymous' });
                                });
                            }
                            return Promise.resolve();
                        });

                        await Promise.all(fetchPromises);
                        loadingMessage.value = "[替代畫面圖片] 正在 CANVAS 截圖...";
                        canvas.renderAll(); 
                        
                        const dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
                        const blob = await (await fetch(dataURL)).blob();

                        if (navigator.share && /mobile|android|iphone|ipad/i.test(navigator.userAgent)) {
                            const file = new File([blob], 'pie-chart.png', { type: 'image/png' });
                            await navigator.share({ title: chartTitle.value, files: [file] })
                                .catch(err => console.log('分享取消或失敗:', err));
                        } else {
                            const link = document.createElement('a');
                            link.download = `${chartTitle.value || 'chart'}.png`;
                            link.href = dataURL;
                            link.click();
                        }
                    } catch (error) {
                        alert("匯出發生錯誤: " + error.message);
                        console.error(error);
                    } finally {
                        isLoading.value = false;
                    }
                }

                return {
                    chartTitle, slices, addSlice, removeSlice, handleFileUpload,
                    renderChart, exportProject, importProject, exportImage,
                    isLoading, loadingMessage, lastSavedTime
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
